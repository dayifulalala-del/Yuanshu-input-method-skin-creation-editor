  // ---------- 导出前体检：动画只存在于一种明暗模式时提示同步 ----------
  function copyAnimationsBetween(src, dst) {
    let n = 0;
    for (const k in src) {
      const v = src[k];
      if (v && typeof v === 'object' && v.animationType) {
        dst[k] = JSON.parse(JSON.stringify(v));
      }
    }
    for (const k in src) {
      const v = src[k];
      if (v && typeof v === 'object' && v.animation && dst[k] && typeof dst[k] === 'object' && !dst[k].type) {
        dst[k].animation = JSON.parse(JSON.stringify(v.animation));
        n++;
      }
    }
    return n;
  }

  function preExportHealthCheck() {
    const m = M();

    // ===== 自动补齐缺失的键盘文件 =====
    // config 引用了但 light/dark 里不存在的文件：优先从另一模式复制，两边都没有则用模板生成
    const cfg = m.config || {};
    const referenced = new Set();
    for (const kType in cfg) {
      const v = cfg[kType];
      if (!v || typeof v !== 'object' || !('iPhone' in v || 'iPad' in v)) continue;
      for (const dev of ['iPhone', 'iPad']) {
        for (const ori in (v[dev] || {})) {
          if (v[dev][ori]) referenced.add(v[dev][ori]);
        }
      }
    }
    const created = [];
    for (const f of referenced) {
      for (const mode of ['light', 'dark']) {
        if (!m.docs[mode][f]) {
          const other = m.docs[mode === 'light' ? 'dark' : 'light'][f];
          const doc = other && !other.__parseError
            ? JSON.parse(JSON.stringify(other))
            : SkinTemplate.buildKeyboard(mode === 'dark');
          m.docs[mode][f] = doc;
          m.docDirty[mode].add(f);
          created.push(`${mode === 'light' ? '浅色' : '深色'}/${f}`);
        }
      }
    }
    if (created.length) {
      toast(`已自动补齐缺失的键盘文件：${created.join('、')}（缺哪补哪，手机不再显示空白键盘）`);
    }

    const hasAnim = doc => doc && !doc.__parseError &&
      Object.values(doc).some(v => v && typeof v === 'object' && (v.animationType || v.animation));
    const fixes = [];
    const allNames = new Set([...Object.keys(m.docs.light), ...Object.keys(m.docs.dark)]);
    for (const name of allNames) {
      const L = m.docs.light[name], D = m.docs.dark[name];
      if (!L || !D || L.__parseError || D.__parseError) continue;
      const lHas = hasAnim(L), dHas = hasAnim(D);
      if (lHas && !dHas) fixes.push({ name, from: 'light', to: 'dark' });
      else if (dHas && !lHas) fixes.push({ name, from: 'dark', to: 'light' });
    }
    if (!fixes.length) return;
    const list = fixes.map(f => `· ${f.name}（只有${f.from === 'light' ? '浅色' : '深色'}模式有动画）`).join('\n');
    if (confirm(`发现按键动画只加在了一种模式里：\n${list}\n\n手机处于另一模式（比如夜间深色）时将看不到动画。\n\n点「确定」自动同步到另一模式（推荐）\n点「取消」保持现状继续导出`)) {
      pushUndo();
      let total = 0;
      for (const f of fixes) {
        total += copyAnimationsBetween(m.docs[f.from][f.name], m.docs[f.to][f.name]);
        m.docDirty[f.to].add(f.name);
      }
      toast(`已把动画同步到另一模式（${total} 个按键）`);
    }
  }

  // ---------- 环境探测（导出方式按环境自动选择） ----------
  function isIOSLike() {
    const ua = navigator.userAgent || '';
    // iPadOS 13+ 桌面模式 UA 伪装成 Mac，用触摸点数识别
    return /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  }
  function isMobileLike() {
    const ua = navigator.userAgent || '';
    return isIOSLike() || /Android|Mobile|HarmonyOS/i.test(ua) ||
      (window.matchMedia && window.matchMedia('(max-width: 900px)').matches && navigator.maxTouchPoints > 0);
  }
  function isInAppBrowser() {
    const ua = navigator.userAgent || '';
    return /MicroMessenger|QQ\/|Weibo|DingTalk|Quark(?=.*Mobile)/i.test(ua);
  }

  // 触发浏览器下载（a 标签必须真实挂到页面上，部分手机浏览器才认）
  function triggerDownload(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    // 延迟回收：手机浏览器下载是异步的，太早 revoke 会得到空文件
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
  }

  // 系统分享面板（iPhone 上可以「存储到文件」或直接发给元书）
  async function shareSkinFile(blob, name) {
    try {
      const file = new File([blob], name, { type: 'application/octet-stream' });
      if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
        await navigator.share({ files: [file] });
        return true;
      }
    } catch (e) {
      // 用户取消分享不算失败
      if (e && (e.name === 'AbortError' || e.name === 'NotAllowedError')) return true;
      console.warn('分享失败', e);
    }
    return false;
  }

  function fmtSize(n) {
    if (n > 1024 * 1024) return (n / 1024 / 1024).toFixed(2) + ' MB';
    if (n > 1024) return (n / 1024).toFixed(0) + ' KB';
    return n + ' B';
  }

  // 手机端导出面板：文件已经打包好，按钮点击 = 新的用户手势，
  // 在手势内同步调用分享/下载，绕开 iOS「异步打包后 a.click() 被静默拦截」的限制
  function openExportModal(blob, name) {
    const m = UI.modal('皮肤已打包完成', '440px');
    m.body.appendChild(el('div', 'panel-hint ok', `✓ ${name}（${fmtSize(blob.size)}）已生成，选择保存方式：`));

    if (isInAppBrowser()) {
      m.body.appendChild(el('div', 'hint-line warn',
        '⚠ 检测到你在微信/QQ 等内置浏览器里。这类浏览器不允许保存文件！\n请点右上角「⋯」→「在浏览器（Safari）中打开」，再重新导出。'));
    }

    const canShareFile = (() => {
      try {
        const f = new File([new Uint8Array(1)], 't.cskin', { type: 'application/octet-stream' });
        return !!(navigator.canShare && navigator.share && navigator.canShare({ files: [f] }));
      } catch (_) { return false; }
    })();

    if (canShareFile) {
      const shareBtn = button('📤 存到「文件」/ 分享（iPhone 推荐）', async () => {
        const ok = await shareSkinFile(blob, name);
        if (ok) { m.close(); toast('已打开分享面板，选「存储到文件」或直接发送'); }
        else toast('分享没有成功，试试下面的「直接下载」', true);
      }, 'btn primary');
      shareBtn.style.cssText = 'display:block;width:100%;margin:6px 0;padding:10px;';
      m.body.appendChild(shareBtn);
    }

    const dlBtn = button('⬇ 直接下载 ' + name, () => {
      try {
        triggerDownload(blob, name);
        toast('已开始下载，去浏览器的「下载」里找它');
      } catch (e) { toast('下载失败：' + e.message, true); }
    }, 'btn' + (canShareFile ? '' : ' primary'));
    dlBtn.style.cssText = 'display:block;width:100%;margin:6px 0;padding:10px;';
    m.body.appendChild(dlBtn);

    const guide = UI.section('📱 怎么把皮肤装进手机？（点开看步骤）', false);
    guide.body.appendChild(el('div', 'hint-line',
      'iPhone / iPad：\n' +
      '① 点上面「存到文件」，保存到 iCloud 云盘或「我的 iPhone」\n' +
      '② 打开「文件」App，找到刚才的 .cskin 文件\n' +
      '③ 点它 → 分享 → 选「元书输入法」；或打开元书 App → 皮肤 → 导入\n' +
      '④ 在元书的皮肤列表里启用它\n\n' +
      '安卓 / 电脑：下载后把文件传到手机，用元书 App 的「皮肤 → 导入」选择该文件。\n\n' +
      '改完的皮肤要重新导入一次才会生效；旧缓存已在导出时自动清理。'));
    m.body.appendChild(guide.root);
  }

  async function exportFile() {
    if (!M().loaded) { toast('还没有打开皮肤', true); return; }
    preExportHealthCheck();
    if (!M().demoPng) {
      // 自动用预览生成封面
      const canvas = document.getElementById('previewCanvas');
      if (canvas && canvas.width) {
        await new Promise(res => canvas.toBlob(async b => {
          if (b) M().demoPng = new Uint8Array(await b.arrayBuffer());
          res();
        }, 'image/png'));
      }
    }
    try {
      const blob = await SkinModel.exportCskin();
      const name = (M().config && M().config.name ? M().config.name : 'skin') + '.cskin';
      if (isMobileLike() || isInAppBrowser()) {
        // 手机：打包完成后弹面板，让用户在"新的一次点击"里保存/分享
        // （iOS 不允许在异步操作之后偷偷触发下载，这正是以前手机导不出的原因）
        openExportModal(blob, name);
      } else {
        triggerDownload(blob, name);
        toast('已导出 ' + name + '（旧缓存已自动清理）');
      }
    } catch (e) {
      console.error(e);
      toast('导出失败：' + e.message, true);
    }
  }

  // ---------- 事件绑定 ----------
  function bindEvents() {
    // 导入
    const fileInput = document.getElementById('fileInput');

        }, 'pick-item');

    };

    document.getElementById('btnUndo').onclick = undo;
    document.getElementById('btnRedo').onclick = redo;
    document.getElementById('btnRandomPress').onclick = applyRandomPressColors;
    document.getElementById('btnClearPress').onclick = clearAllPressColors;

    // 界面主题（明亮/暗黑）
    const applyTheme = t => {
      document.body.classList.toggle('light', t === 'light');
      try { localStorage.setItem('editorTheme', t); } catch (_) { }
    };
    let savedTheme = 'dark';
    try { savedTheme = localStorage.getItem('editorTheme') || 'dark'; } catch (_) { }
    applyTheme(savedTheme);
    document.getElementById('btnTheme').onclick = () => {
      applyTheme(document.body.classList.contains('light') ? 'dark' : 'light');
    };

    // 手机壳开关
    document.getElementById('chkShell').onchange = () => renderPreview();

    // 拖拽导入
    document.body.addEventListener('dragover', e => e.preventDefault());
    document.body.addEventListener('drop', e => {
      e.preventDefault();
      const f = e.dataTransfer.files[0];
      if (f && /\.(cskin|zip)$/i.test(f.name)) importFile(f);
    });

    // 顶栏切换
    document.getElementById('selMode').onchange = e => {
      Renderer.state.mode = e.target.value;
      renderAll();
    };
    document.getElementById('selDevice').onchange = e => {
      const [d, o] = e.target.value.split('-');
      Renderer.state.device = d;
      Renderer.state.orientation = o;
      // 按 config 自动换文件
      autoPickDocForDevice();
      renderAll();
    };
    document.getElementById('selBar').onchange = e => {
      Renderer.state.barMode = e.target.value;
      renderPreview();
    };
    document.getElementById('selShift').onchange = e => {
      Renderer.state.shiftState = e.target.value;
      renderPreview();
    };
    document.getElementById('selState').onchange = e => {
      const v = e.target.value;
      const sim = Renderer.state.sim;
      sim.returnKeyType = null; sim.preediting = false;
      if (v === 'preedit') sim.preediting = true;
      else if (v.startsWith('rk')) sim.returnKeyType = Number(v.slice(2));
      // 打拼音场景顺便让候选栏/预编辑有内容，更直观
      renderPreview();
      if (v === 'normal') toast('已回到常规状态');
      else toast('已切到模拟场景：真机在此情况下，带「事件通知/条件样式」的键会自动变样');
    };
    document.getElementById('selZoom').onchange = e => {
      if (e.target.value === 'auto') applyAutoZoom();
      else Renderer.state.zoom = Number(e.target.value) || 1;
      renderPreview();
    };
    document.getElementById('selScale').onchange = e => {
      Renderer.state.assetScale = Number(e.target.value);
      renderPreview();
    };
    document.getElementById('chkSync').onchange = e => {
      app.syncModes = e.target.checked;
      toast(app.syncModes ? '之后的修改会同时应用到浅色和深色' : '已关闭双模式同步');
    };
    document.getElementById('chkHints').onchange = e => {
      Renderer.state.showHints = e.target.checked;
      renderPreview();
    };

    // 预览点击选中
    const overlay = document.getElementById('overlayCanvas');
    overlay.addEventListener('click', e => {
      const rect = overlay.getBoundingClientRect();
      const x = (e.clientX - rect.left) / Renderer.state.zoom;
      const y = (e.clientY - rect.top) / Renderer.state.zoom;
      const hit = Renderer.hitTest(x, y);
      if (hit && hit.kind === 'key') {
        app.selection = hit.name;
        Renderer.state.selectedName = hit.name;
        renderPreview();
        refreshInspector();
      } else if (hit && hit.kind === 'area') {
        app.selection = null;
        Renderer.state.selectedName = null;
        renderPreview();
        // 打开对应全局面板
        app.leftTab = 'global';
        document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === 'global'));
        refreshLeftPanel();
        refreshInspector();
      }
    });
    // 按住任意键 = 显示它的「按下」效果（highlight 样式）并播放按键动画
    overlay.addEventListener('mousedown', e => {
      const rect = overlay.getBoundingClientRect();
      const x = (e.clientX - rect.left) / Renderer.state.zoom;
      const y = (e.clientY - rect.top) / Renderer.state.zoom;
      const hit = Renderer.hitTest(x, y);
      if (hit && hit.kind === 'key') {
        Renderer.state.highlightKey = hit.name;
        startPressAnim(hit.name);
        renderPreview();
      }
    });
    const releasePress = () => {
      releasePressAnim();
      if (Renderer.state.highlightKey) {
        Renderer.state.highlightKey = null;
        renderPreview();
      }
    };
    overlay.addEventListener('mouseup', releasePress);
    overlay.addEventListener('mouseleave', releasePress);
    overlay.addEventListener('touchstart', e => {
      const t = e.changedTouches && e.changedTouches[0];
      if (!t) return;
      const rect = overlay.getBoundingClientRect();
      const x = (t.clientX - rect.left) / Renderer.state.zoom;
      const y = (t.clientY - rect.top) / Renderer.state.zoom;
      const hit = Renderer.hitTest(x, y);
      if (hit && hit.kind === 'key') {
        app.selection = hit.name;
        Renderer.state.selectedName = hit.name;
        Renderer.state.highlightKey = hit.name;
        startPressAnim(hit.name);
        renderPreview();
        refreshInspector();
        e.preventDefault();
      }
    }, { passive: false });
    overlay.addEventListener('touchend', e => { releasePress(); e.preventDefault(); }, { passive: false });
    overlay.addEventListener('touchcancel', e => { releasePress(); e.preventDefault(); }, { passive: false });

    // 左侧标签
    document.querySelectorAll('.tab').forEach(b => {
      b.onclick = () => {
        app.leftTab = b.dataset.tab;
        document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === b));
        refreshLeftPanel();
      };
    });

    // 快捷键
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
        if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
        e.preventDefault(); undo();
      }
      if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) {
        if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
        e.preventDefault(); redo();
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault(); exportFile();
      }
    });

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      if (!isAutoZoom()) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => renderPreview(), 120);
    });
    window.addEventListener('orientationchange', () => {
      if (!isAutoZoom()) return;
      setTimeout(() => renderPreview(), 260);
    });
  }

  function autoPickDocForDevice() {
    // 根据 config 的当前键盘类型映射挑选合适的文件
    const cfg = M().config || {};
    const cur = Renderer.state.docName;
    // 找到当前文件属于哪个键盘类型
    for (const kType in cfg) {
      const v = cfg[kType];
      if (!v || typeof v !== 'object' || !('iPhone' in v || 'iPad' in v)) continue;
      const all = [];
      for (const dev of ['iPhone', 'iPad']) for (const ori in (v[dev] || {})) all.push(v[dev][ori]);
      if (all.includes(cur)) {
        const dev = Renderer.state.device;
        const target = v[dev] && v[dev][Renderer.state.orientation];
        if (target && M().docs[Renderer.state.mode][target]) {
          Renderer.state.docName = target;
        }
        return;
      }
    }
  }

  // ---------- 测试挂钩（开发用）----------
  async function loadFromUrl(url) {
    const resp = await fetch(url);
    const buf = await resp.arrayBuffer();
    await SkinModel.loadCskin(buf, url.split('/').pop());
    afterLoad();
  }

  // ---------- 启动 ----------
  function boot() {
    bindEvents();
    setupMobileViewportDefaults();
    const zoomValue = document.getElementById('selZoom').value;
    Renderer.state.zoom = zoomValue === 'auto' ? 1 : (Number(zoomValue) || 1);
    applyAutoZoom();
    updateTitle();
    refreshInspector();
    const params = new URLSearchParams(location.search);
    if (params.get('test')) {
      loadFromUrl('test-skins/' + params.get('test') + '.cskin').catch(e => {
        console.error('test load failed', e);
        toast('测试皮肤加载失败：' + e.message, true);
      });
    }
  }

  document.addEventListener('DOMContentLoaded', boot);

  return {
    get selection() { return app.selection; },
    set selection(v) { app.selection = v; Renderer.state.selectedName = v; },
    get layoutArea() { return app.layoutArea; },
    set layoutArea(v) { app.layoutArea = v; },
    get sourceFile() { return app.sourceFile; },
    set sourceFile(v) { app.sourceFile = v; },
    currentDoc, edit, commit, batchEdit, editLayout, undo, redo,
    renderAll, renderPreview, refreshLeftPanel, refreshInspector, gotoTab,
    importFile, exportFile, loadFromUrl, testAnimation,
    applyAnimationEverywhere, removeAnimationEverywhere, splitKeyboard, applyEffectPreset, unifyReturnKeyTextColorEverywhere,
    afterLoad,
    get leftTab() { return app.leftTab; },
    set leftTab(v) { app.leftTab = v; },
  };
})();

</script>
</body>
</html>
