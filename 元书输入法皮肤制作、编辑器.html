<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>元书皮肤编辑器 · 全能版</title>
<style>
/* 元书皮肤编辑器 v2 —— 支持明亮/暗黑双主题（body.light 切换） */
* { box-sizing: border-box; }

:root {
  --bg: #1e1f24;            /* 页面底色 */
  --bg-center: #17181d;     /* 预览区底色 */
  --panel: #22232a;         /* 侧栏 */
  --panel2: #26272e;        /* 顶栏/卡片 */
  --panel3: #2a2b33;        /* 卡片内层 */
  --panel4: #2c2d35;        /* 按钮式条目 */
  --border: #34353d;
  --border2: #3a3b44;
  --border3: #45464f;
  --text: #d8dae2;
  --text-strong: #ffffff;
  --text-dim: #9aa0ac;
  --text-faint: #7d8391;
  --text-mute: #6d7382;
  --accent: #4f8cff;
  --accent-deep: #2b5cd9;
  --accent-deep2: #3a6ae8;
  --accent-text: #8ab4ff;
  --accent-bg: #2a3040;
  --input-bg: #17181c;
  --btn-bg: #33343d;
  --btn-hover: #3d3e49;
  --mini-bg: #2c2d35;
  --mini-hover: #3a3b46;
  --hover-row: #2c2d36;
  --danger: #ff8a8e;
  --danger-border: #6b3438;
  --ok: #59c184;
  --warn: #e6b455;
  --err-bg: #3a2426; --err-fg: #ff9b9e;
  --warn-bg: #38321f; --warn-fg: #e6c477;
  --shadow-strong: rgba(0,0,0,.5);
  --check1: #33343e; --check2: #2c2d36;
  --scroll: #3a3b46;
}
body.light {
  --bg: #eef0f4;
  --bg-center: #e3e6ec;
  --panel: #f7f8fa;
  --panel2: #ffffff;
  --panel3: #f1f2f6;
  --panel4: #ffffff;
  --border: #d8dbe2;
  --border2: #ccd0d9;
  --border3: #b9bec9;
  --text: #23262e;
  --text-strong: #000000;
  --text-dim: #4c5361;
  --text-faint: #6b7280;
  --text-mute: #8a90a0;
  --accent: #2f6fed;
  --accent-deep: #2b5cd9;
  --accent-deep2: #3a6ae8;
  --accent-text: #2456c8;
  --accent-bg: #e3ecff;
  --input-bg: #ffffff;
  --btn-bg: #e9ebf1;
  --btn-hover: #dde1e9;
  --mini-bg: #eceef3;
  --mini-hover: #dfe3ea;
  --hover-row: #e9ecf2;
  --danger: #d92d20;
  --danger-border: #f2b8b5;
  --ok: #1e9e5a;
  --warn: #b57e0a;
  --err-bg: #fde8e8; --err-fg: #b42318;
  --warn-bg: #fdf3d7; --warn-fg: #93690a;
  --shadow-strong: rgba(60,70,90,.25);
  --check1: #d9dce3; --check2: #e8eaef;
  --scroll: #c3c8d2;
}

html, body { height: 100%; margin: 0; }
body {
  font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; flex-direction: column; overflow: hidden;
}

/* ===== 顶栏 ===== */
#topbar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; background: var(--panel2); border-bottom: 1px solid var(--border);
  flex-wrap: wrap; flex-shrink: 0;
}
#topbar .brand { font-weight: 700; color: var(--accent-text); margin-right: 4px; white-space: nowrap; }
#titleName { color: var(--text-dim); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#topbar .gap { flex: 1; }
select, input[type=text], input[type=number], textarea {
  background: var(--input-bg); color: var(--text); border: 1px solid var(--border2);
  border-radius: 6px; padding: 4px 6px; font: inherit;
}
select:focus, input:focus, textarea:focus { outline: 1px solid var(--accent); }
textarea { width: 100%; resize: vertical; }
textarea.err, input.err { border-color: #e5484d; }

.btn {
  background: var(--btn-bg); color: var(--text); border: 1px solid var(--border3);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit;
}
.btn:hover { background: var(--btn-hover); }
.btn.primary { background: var(--accent-deep); border-color: var(--accent-deep2); color: #fff; }
.btn.primary:hover { background: var(--accent-deep2); }
.btn.small { padding: 2px 8px; font-size: 12px; margin: 2px 2px 2px 0; }
.btn.danger { color: var(--danger); border-color: var(--danger-border); }
.btn.wizard {
  background: linear-gradient(120deg, #7b5cff, #4f8cff);
  border-color: #6a7bff; color: #fff; font-weight: 700;
}
.btn.wizard:hover { background: linear-gradient(120deg, #8b6cff, #5f9cff); }
.mini-btn {
  background: var(--mini-bg); color: var(--text-dim); border: 1px solid var(--border2);
  border-radius: 4px; padding: 1px 6px; cursor: pointer; font-size: 12px;
}
.mini-btn:hover { background: var(--mini-hover); color: var(--text-strong); }
.chk { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }

/* ===== 主体三栏 ===== */
#main { display: flex; flex: 1; min-height: 0; }

#left {
  width: 320px; min-width: 240px; background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
}
#leftTabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
.tab {
  flex: 1; min-width: 60px; text-align: center; padding: 7px 2px; cursor: pointer;
  background: none; border: none; color: var(--text-dim); font: inherit; font-size: 12px;
  border-bottom: 2px solid transparent;
}
.tab:hover { color: var(--text-strong); }
.tab.active { color: var(--accent-text); border-bottom-color: var(--accent); }
#leftBody { flex: 1; overflow-y: auto; padding: 10px; }

#center {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  align-items: center; overflow: auto; padding: 20px; background: var(--bg-center);
}
#previewWrap { position: relative; }
#previewCanvas { display: block; }
#overlayCanvas { position: absolute; left: 0; top: 0; cursor: pointer; }
#previewEmpty { color: var(--text-mute); padding: 60px 30px; text-align: center; max-width: 460px; }

#right {
  width: 360px; min-width: 280px; background: var(--panel); border-left: 1px solid var(--border);
  overflow-y: auto; padding: 10px;
}

/* =====================================================
   iPhone 17 Pro Max 仿真机身
   所有尺寸用 --z（缩放倍率）等比缩放
   ===================================================== */
#phoneShell {
  --z: 1;
  position: relative;
  padding: calc(3px * var(--z));                    /* 钛金属边框厚度 */
  border-radius: calc(62px * var(--z));
  background:
    linear-gradient(135deg, #9a9ba1 0%, #5b5c62 18%, #3d3e44 38%, #7c7d84 52%, #45464c 68%, #8e8f96 86%, #55565c 100%);
  box-shadow:
    0 calc(24px * var(--z)) calc(60px * var(--z)) var(--shadow-strong),
    0 calc(4px * var(--z)) calc(14px * var(--z)) rgba(0,0,0,.35),
    inset 0 0 calc(2px * var(--z)) rgba(255,255,255,.55);
}
/* 黑色内圈（屏幕边框） */
#phoneScreen {
  position: relative;
  border: calc(9px * var(--z)) solid #060607;
  border-radius: calc(59px * var(--z));
  overflow: hidden;
  background: #fff;
  display: flex; flex-direction: column;
}
#phoneShell[data-kb="dark"] #phoneScreen { background: #000; }

/* 侧面按键 */
.ps-btn {
  position: absolute; border-radius: calc(2px * var(--z));
  background: linear-gradient(90deg, #85868c, #4a4b51 45%, #6d6e74);
  box-shadow: inset 0 calc(1px * var(--z)) calc(1px * var(--z)) rgba(255,255,255,.4);
  z-index: -1;
}
.ps-action  { left: calc(-2.5px * var(--z)); top: calc(150px * var(--z)); width: calc(4px * var(--z)); height: calc(34px * var(--z)); }
.ps-volup   { left: calc(-2.5px * var(--z)); top: calc(216px * var(--z)); width: calc(4px * var(--z)); height: calc(62px * var(--z)); }
.ps-voldown { left: calc(-2.5px * var(--z)); top: calc(292px * var(--z)); width: calc(4px * var(--z)); height: calc(62px * var(--z)); }
.ps-power   { right: calc(-2.5px * var(--z)); top: calc(232px * var(--z)); width: calc(4px * var(--z)); height: calc(96px * var(--z)); }

/* 顶部（状态栏 + 导航），主题跟随皮肤明暗 */
#psTop { flex-shrink: 0; }
#phoneShell[data-kb="light"] #psTop { background: #f6f6f8; color: #000; }
#phoneShell[data-kb="dark"]  #psTop { background: #131315; color: #fff; }

#psStatus {
  position: relative;
  display: flex; align-items: center; justify-content: space-between;
  height: calc(54px * var(--z));
  padding: calc(10px * var(--z)) calc(30px * var(--z)) 0;
  font-weight: 600;
}
.ps-time { font-size: calc(17px * var(--z)); letter-spacing: .02em; min-width: calc(54px * var(--z)); }
/* 灵动岛 */
#psIsland {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: calc(11px * var(--z));
  width: calc(124px * var(--z)); height: calc(37px * var(--z));
  background: #000; border-radius: calc(20px * var(--z));
  box-shadow: inset 0 0 calc(3px * var(--z)) rgba(255,255,255,.08);
}
.ps-cam {
  position: absolute; right: calc(11px * var(--z)); top: 50%; transform: translateY(-50%);
  width: calc(11px * var(--z)); height: calc(11px * var(--z));
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #2d3748 0%, #10141c 55%, #000 100%);
}
.ps-staticons { display: flex; align-items: center; gap: calc(6px * var(--z)); }
.ps-staticons svg { fill: currentColor; width: calc(17px * var(--z)); height: calc(11px * var(--z)); }
.ps-wifi { width: calc(15px * var(--z)) !important; }
.ps-5g { font-size: calc(12px * var(--z)); font-weight: 700; }
.ps-batt {
  position: relative; display: inline-block;
  width: calc(25px * var(--z)); height: calc(12px * var(--z));
  border: calc(1px * var(--z)) solid currentColor; border-radius: calc(4px * var(--z));
  opacity: .95;
}
.ps-batt::after {
  content: ''; position: absolute; right: calc(-3.5px * var(--z)); top: 50%; transform: translateY(-50%);
  width: calc(2px * var(--z)); height: calc(5px * var(--z));
  background: currentColor; border-radius: 0 1px 1px 0; opacity: .6;
}
.ps-batt-fill {
  position: absolute; left: calc(1.5px * var(--z)); top: calc(1.5px * var(--z)); bottom: calc(1.5px * var(--z));
  width: 72%; background: currentColor; border-radius: calc(2px * var(--z));
}

/* 信息 App 导航条 */
.ps-nav {
  display: flex; align-items: center;
  padding: 0 calc(14px * var(--z)) calc(8px * var(--z));
  border-bottom: 1px solid rgba(128,128,128,.25);
}
.ps-back { color: #0a84ff; font-size: calc(30px * var(--z)); line-height: 1; margin-right: calc(8px * var(--z)); }
.ps-contact { flex: 1; display: flex; flex-direction: column; align-items: center; gap: calc(2px * var(--z)); }
.ps-avatar {
  width: calc(40px * var(--z)); height: calc(40px * var(--z)); border-radius: 50%;
  background: linear-gradient(180deg, #a8b1bd, #8494a7);
  color: #fff; font-size: calc(17px * var(--z));
  display: flex; align-items: center; justify-content: center; font-weight: 600;
}
.ps-name { font-size: calc(11.5px * var(--z)); }
.ps-name i { font-style: normal; color: rgba(128,128,128,.8); }
.ps-video { fill: #0a84ff; width: calc(24px * var(--z)); height: calc(17px * var(--z)); }

/* 聊天区（高度由 JS 填充） */
#psApp { display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
#phoneShell[data-kb="light"] #psApp { background: #ffffff; }
#phoneShell[data-kb="dark"]  #psApp { background: #000000; }
.ps-chat { padding: calc(10px * var(--z)) calc(16px * var(--z)); overflow: hidden; }
.ps-date { text-align: center; color: rgba(128,128,128,.9); font-size: calc(11px * var(--z)); margin-bottom: calc(8px * var(--z)); }
.ps-bubble {
  max-width: 72%; width: fit-content;
  padding: calc(8px * var(--z)) calc(13px * var(--z));
  margin: calc(3px * var(--z)) 0;
  border-radius: calc(18px * var(--z));
  font-size: calc(15px * var(--z)); line-height: 1.35;
}
.ps-bubble.in { background: #e9e9eb; color: #000; border-bottom-left-radius: calc(5px * var(--z)); }
.ps-bubble.out { background: #0a84ff; color: #fff; margin-left: auto; border-bottom-right-radius: calc(5px * var(--z)); }
#phoneShell[data-kb="dark"] .ps-bubble.in { background: #26262a; color: #fff; }
.ps-inputbar {
  display: flex; align-items: center; gap: calc(9px * var(--z));
  padding: calc(6px * var(--z)) calc(14px * var(--z)) calc(8px * var(--z));
}
.ps-plus {
  width: calc(31px * var(--z)); height: calc(31px * var(--z)); border-radius: 50%;
  background: rgba(128,128,128,.22); color: rgba(128,128,128,1);
  font-size: calc(21px * var(--z));
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.ps-field {
  flex: 1; display: flex; align-items: center; justify-content: space-between;
  border: 1px solid rgba(128,128,128,.45); border-radius: calc(17px * var(--z));
  padding: calc(5px * var(--z)) calc(12px * var(--z));
  font-size: calc(15px * var(--z)); color: rgba(128,128,128,.85);
}
#phoneShell[data-kb="dark"] .ps-field { color: rgba(200,200,205,.7); }
.ps-mic { fill: rgba(128,128,128,.9); stroke: rgba(128,128,128,.9); }

/* Home 指示条（叠在键盘上） */
#psHome {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(8px * var(--z));
  width: calc(150px * var(--z)); height: calc(5px * var(--z));
  border-radius: calc(3px * var(--z));
  background: rgba(0,0,0,.85); pointer-events: none; z-index: 5;
}
#phoneShell[data-kb="dark"] #psHome { background: rgba(255,255,255,.85); }

/* 关闭手机壳时：隐藏所有机身元素，只留键盘画布 */
#phoneShell.bare { padding: 0; border-radius: 8px; background: none; box-shadow: none; }
#phoneShell.bare #phoneScreen { border: none; border-radius: 8px; background: none; }
#phoneShell.bare #psTop, #phoneShell.bare #psApp, #phoneShell.bare #psHome,
#phoneShell.bare .ps-btn { display: none; }
#phoneShell.bare #previewCanvas { border-radius: 8px; box-shadow: 0 6px 30px var(--shadow-strong); }

/* ===== 面板通用 ===== */
.panel-hint { color: var(--text-faint); margin: 4px 0 10px; font-size: 12px; }
.panel-hint.ok { color: var(--ok); }
.hint-line { color: var(--text-faint); font-size: 11.5px; margin: 4px 0; white-space: pre-line; }
.hint-line.warn { color: var(--warn); }
.fld { margin: 7px 0; }
.fld-label { display: block; color: var(--text-dim); font-size: 12px; margin-bottom: 3px; }
.fld-hint { color: var(--text-mute); font-size: 11px; }
.sec { border: 1px solid var(--border); border-radius: 8px; margin: 8px 0; background: var(--panel2); }
.sec-title { padding: 7px 10px; cursor: pointer; color: var(--text); font-weight: 600; user-select: none; }
.sec-body { padding: 4px 10px 10px; }
.sec .sec { background: var(--panel3); }

.insp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.insp-title { font-size: 15px; font-weight: 700; color: var(--text-strong); word-break: break-all; }

/* 颜色输入 */
.color-inp { display: flex; align-items: center; gap: 5px; }
.color-inp input[type=color] { width: 30px; height: 26px; padding: 0; border: 1px solid var(--border2); border-radius: 5px; background: none; cursor: pointer; }
.color-inp input[type=text] { width: 105px; }
.color-inp input[type=range] { width: 60px; }
.color-inp.empty input[type=color] { opacity: .3; }

/* 尺寸/insets */
.dim-inp { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.dim-inp input { width: 70px; }
.insets-inp, .pt-inp { display: flex; gap: 6px; flex-wrap: wrap; }
.insets-box { display: flex; align-items: center; gap: 3px; }
.insets-box input { width: 54px; }
.insets-lab { color: var(--text-faint); font-size: 11px; }

/* 样式引用 */
.ref-row { display: flex; align-items: center; gap: 4px; margin: 3px 0; }
.ref-row.selected .ref-name { border-color: var(--accent); color: var(--accent-text); }
.ref-name {
  flex: 1; text-align: left; background: var(--panel4); border: 1px solid var(--border2);
  color: var(--text); border-radius: 5px; padding: 3px 8px; cursor: pointer; font: inherit; font-size: 12px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ref-name:hover { border-color: var(--accent); }
.ref-name.missing { color: var(--danger); border-color: var(--danger-border); }
.ref-tools { margin-top: 4px; }

/* 动作编辑 */
.act-field { margin: 8px 0; padding: 6px 8px; background: var(--panel3); border-radius: 6px; }
.act-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.act-cur { color: var(--accent-text); font-size: 12px; text-align: right; }
.act-box { margin-top: 4px; display: flex; flex-direction: column; gap: 4px; }
.act-box select, .act-box input { width: 100%; }

/* 文件列表 */
.file-row { display: flex; align-items: center; gap: 4px; margin: 3px 0; flex-wrap: wrap; }
.file-name {
  flex: 1; text-align: left; background: var(--panel4); border: 1px solid var(--border2);
  color: var(--text); border-radius: 6px; padding: 6px 9px; cursor: pointer; font: inherit;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.file-row.active .file-name { border-color: var(--accent); color: var(--accent-text); background: var(--accent-bg); }
.file-usage { width: 100%; color: var(--text-mute); font-size: 11px; padding-left: 8px; }

/* 布局树 */
.layout-tree { margin: 6px 0; }
.lt-row { display: flex; align-items: center; justify-content: space-between; padding: 3px 4px; border-radius: 5px; gap: 4px; }
.lt-row:hover { background: var(--hover-row); }
.lt-row .lt-label { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lt-row.lt-stack > .lt-label { color: var(--warn); }
.lt-row.lt-cell.selected > .lt-label { color: var(--accent-text); }
.lt-row.lt-cell.missing > .lt-label { color: var(--danger); }
.lt-acts { display: flex; gap: 2px; flex-shrink: 0; }

/* 选择列表 */
.pick-list { max-height: 320px; overflow-y: auto; margin-top: 6px; }
.pick-item {
  display: block; width: 100%; text-align: left; background: none; border: none;
  color: var(--text); padding: 6px 8px; cursor: pointer; font: inherit; border-radius: 5px;
}
.pick-item:hover { background: var(--hover-row); color: var(--text-strong); }
.pick-item.danger { color: var(--danger); }

/* 资源 */
.res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin: 8px 0; }
.res-card { background: var(--panel3); border: 1px solid var(--border2); border-radius: 8px; padding: 6px; cursor: pointer; }
.res-card:hover { border-color: var(--accent); }
.res-thumb { width: 100%; background:
  repeating-conic-gradient(var(--check1) 0 25%, var(--check2) 0 50%) 0 0/16px 16px; border-radius: 5px; }
.res-name { font-size: 12px; color: var(--text); margin-top: 4px; word-break: break-all; }
.res-info { font-size: 11px; color: var(--text-mute); }
.img-picker { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.img-thumb { background: repeating-conic-gradient(var(--check1) 0 25%, var(--check2) 0 50%) 0 0/12px 12px; border-radius: 4px; }

/* 切片编辑器 */
.slice-wrap { display: flex; gap: 12px; }
.slice-left { flex: 1; overflow: auto; max-height: 66vh; }
.slice-canvas { cursor: crosshair; }
.slice-zoom { margin-top: 6px; display: flex; gap: 4px; align-items: center; }
.slice-right { width: 220px; flex-shrink: 0; overflow-y: auto; max-height: 66vh; }

/* 校验 */
.vld-item { padding: 5px 8px; border-radius: 5px; margin: 3px 0; font-size: 12px; }
.vld-item.error { background: var(--err-bg); color: var(--err-fg); }
.vld-item.warn { background: var(--warn-bg); color: var(--warn-fg); }

/* 源码 */
.src-ta { min-height: 55vh; font-family: Consolas, "Courier New", monospace; font-size: 12px; white-space: pre; }
.raw-ta { font-family: Consolas, "Courier New", monospace; font-size: 12px; white-space: pre; }

/* 渐变编辑 */
.grad-row { display: flex; align-items: center; gap: 4px; margin: 3px 0; }

/* 向导 */
.wiz-theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 10px 0; }
.wiz-theme-card {
  background: var(--panel3); border: 2px solid var(--border2); border-radius: 10px;
  padding: 8px; cursor: pointer; font: inherit; color: var(--text); text-align: center;
}
.wiz-theme-card:hover { border-color: var(--accent); }
.wiz-theme-card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }
.wiz-swatch {
  height: 54px; border-radius: 7px; display: flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid rgba(128,128,128,.25);
}
.wiz-k {
  width: 24px; height: 32px; border-radius: 5px; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600;
}
.wiz-theme-name { font-size: 13px; font-weight: 700; margin-top: 6px; }
.wiz-theme-tag { font-size: 11px; color: var(--text-mute); }
.wiz-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
.wiz-foot .btn { flex: 1; padding: 9px; }

/* 面包屑：选中按键在皮肤结构中的位置 */
.crumbs {
  display: flex; align-items: center; flex-wrap: wrap; gap: 2px;
  margin-bottom: 8px; padding: 5px 7px;
  background: var(--panel3); border: 1px solid var(--border); border-radius: 7px;
}
.crumb {
  background: none; border: none; color: var(--accent-text); font: inherit;
  font-size: 12px; cursor: pointer; padding: 1px 4px; border-radius: 4px; white-space: nowrap;
}
.crumb:hover { background: var(--accent-bg); }
.crumb.static { color: var(--text-dim); cursor: default; }
.crumb.static:hover { background: none; }
.crumb-sep { color: var(--text-mute); font-size: 11px; }

/* 结构图弹窗 */
.sm-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 12.5px; color: var(--text); }
.sm-row .sm-text { flex: 1; }
.sm-row.dim { color: var(--text-mute); }

/* 布局树缩进导线 */
.lt-row.lt-depth { border-left: 2px solid var(--border3); }

/* SF 图标选择器 */
.sf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin: 8px 0; }
.sf-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--panel3); border: 1px solid var(--border2); border-radius: 8px;
  padding: 8px 4px; cursor: pointer; font: inherit; color: var(--text);
}
.sf-item:hover { border-color: var(--accent); background: var(--hover-row); }
.sf-item .sf-glyph { font-size: 22px; line-height: 1.1; }
.sf-item .sf-zh { font-size: 12px; color: var(--text); text-align: center; }
.sf-item .sf-name { font-size: 10px; color: var(--text-mute); word-break: break-all; text-align: center; }

/* 皮肤封面 */
.demo-img { max-width: 100%; border-radius: 6px; border: 1px solid var(--border2); }

/* 弹窗 */
.modal-back {
  position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 100;
  display: flex; align-items: center; justify-content: center;
}
.modal {
  background: var(--panel2); border: 1px solid var(--border2); border-radius: 10px;
  width: 440px; max-width: 94vw; max-height: 88vh; display: flex; flex-direction: column;
  box-shadow: 0 12px 50px var(--shadow-strong);
}
.modal-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 700; color: var(--text-strong);
}
.modal-body { padding: 12px 14px; overflow-y: auto; }

/* toast */
#toast {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #2e3b55; color: #dbe4ff; padding: 8px 18px; border-radius: 8px;
  opacity: 0; transition: all .25s; z-index: 200; pointer-events: none;
  box-shadow: 0 6px 24px rgba(0,0,0,.5); max-width: 80vw;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err { background: #55232a; color: #ffd4d6; }

/* 滚动条 */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 5px; }
::-webkit-scrollbar-track { background: transparent; }


/* ===== 手机/窄屏自适应：把桌面三栏改为上下布局，预览自动适配屏幕 ===== */
@media (max-width: 900px) {
  html, body {
    height: 100dvh;
    min-height: 100dvh;
    overflow: hidden;
  }
  body {
    font-size: 12px;
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;
  }
  #topbar {
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding: max(6px, env(safe-area-inset-top)) 6px 6px;
    gap: 6px;
  }
  #topbar .brand {
    position: sticky;
    left: 0;
    z-index: 3;
    background: var(--panel2);
    padding-right: 8px;
  }
  #titleName { max-width: 120px; }
  #topbar .gap { display: none; }
  .btn { padding: 5px 8px; white-space: nowrap; }
  select { max-width: 150px; min-height: 30px; }
  input[type=text], input[type=number], textarea { font-size: 16px; } /* 防止 iOS 输入时自动放大页面 */

  #main {
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  #center {
    order: 1;
    width: 100%;
    flex: 0 0 52dvh;
    height: 52dvh;
    min-height: 260px;
    padding: 8px;
    overflow: auto;
    align-items: center;
    justify-content: flex-start;
    -webkit-overflow-scrolling: touch;
  }
  #left {
    order: 2;
    width: 100%;
    min-width: 0;
    flex: 0 0 23dvh;
    height: 23dvh;
    min-height: 145px;
    border-right: 0;
    border-top: 1px solid var(--border);
  }
  #right {
    order: 3;
    width: 100%;
    min-width: 0;
    flex: 1 1 25dvh;
    height: 25dvh;
    min-height: 165px;
    border-left: 0;
    border-top: 1px solid var(--border);
    padding: 8px;
  }
  #leftTabs {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tab {
    flex: 0 0 auto;
    min-width: 72px;
    padding: 8px 4px;
  }
  #leftBody { padding: 8px; }
  #previewWrap { max-width: 100%; }
  #phoneShell { margin: 0 auto; }
  #phoneScreen { max-width: none; }
  #previewCanvas, #overlayCanvas { touch-action: none; }
  .sec-body { padding: 6px 8px 10px; }
  .fld { margin: 6px 0; }
  .color-inp input[type=text] { width: 92px; }
  .dim-inp input, .insets-box input { width: 64px; }
  .modal {
    width: min(94vw, 520px);
    max-height: 82dvh;
  }
  #toast { bottom: max(12px, env(safe-area-inset-bottom)); max-width: 92vw; }
}

@media (max-width: 520px) {
  #center { flex-basis: 50dvh; height: 50dvh; min-height: 240px; }
  #left { flex-basis: 22dvh; height: 22dvh; min-height: 132px; }
  #right { flex-basis: 28dvh; height: 28dvh; min-height: 150px; }
  #topbar .brand { max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
  #titleName { display: none; }
  .btn { padding: 5px 7px; }
  select { max-width: 136px; }
}

</style>
</head>
<body>

<div id="topbar">
  <span class="brand">元书皮肤编辑器</span>
  <span id="titleName">未打开皮肤</span>
  <button class="btn wizard" id="btnWizard" title="不懂参数也能做皮肤：跟着几步走，自动配好颜色">🪄 一键做皮肤</button>
  <button class="btn" id="btnStructure" title="看懂皮肤的层级结构：什么东西在哪儿改">🧭 结构</button>
  <button class="btn primary" id="btnImport">导入 .cskin</button>
  <button class="btn" id="btnNew">新建皮肤</button>
  <button class="btn primary" id="btnExport">导出 .cskin</button>
  <input type="file" id="fileInput" accept=".cskin,.zip" style="display:none">
  <button class="btn" id="btnUndo" title="Ctrl+Z">↩ 撤销</button>
  <button class="btn" id="btnRedo" title="Ctrl+Y">↪ 重做</button>
  <button class="btn" id="btnRandomPress" title="给每个按键一个随机的按下颜色（导出后手机上同样生效）">🎲 按下随机色</button>
  <span class="gap"></span>
  <select id="selDevice" title="设备与方向">
    <option value="iPhone-portrait">iPhone 17 Pro Max 竖屏</option>
    <option value="iPhone-landscape">iPhone 17 Pro Max 横屏</option>
    <option value="iPad-portrait">iPad 竖屏</option>
    <option value="iPad-landscape">iPad 横屏</option>
  </select>
  <select id="selMode" title="明暗模式（皮肤）">
    <option value="light">☀ 浅色皮肤</option>
    <option value="dark">🌙 深色皮肤</option>
  </select>
  <select id="selBar" title="上方区域显示什么">
    <option value="toolbar">工具栏</option>
    <option value="candidates">横向候选</option>
    <option value="vertical">纵向候选(展开)</option>
  </select>
  <select id="selShift" title="Shift 状态">
    <option value="normal">小写</option>
    <option value="uppercased">大写</option>
    <option value="capsLocked">大写锁定</option>
  </select>
  <select id="selState" title="模拟不同场景，预览「事件通知/条件样式」的变色效果（比如回车键在聊天框里变蓝）">
    <option value="normal">常规状态</option>
    <option value="rk4">场景：可发送(回车变蓝)</option>
    <option value="rk1">场景：前往 Go</option>
    <option value="rk7">场景：搜索 Search</option>
    <option value="rk9">场景：完成 Done</option>
    <option value="preedit">场景：正在打拼音</option>
  </select>
  <select id="selZoom" title="缩放">
    <option value="auto" selected>自动适配</option>
    <option value="0.35">35%</option>
    <option value="0.45">45%</option>
    <option value="0.6">60%</option>
    <option value="0.75">75%</option>
    <option value="0.9">90%</option>
    <option value="1">100%</option>
    <option value="1.25">125%</option>
    <option value="1.5">150%</option>
  </select>
  <select id="selScale" title="皮肤图片的设计分辨率倍数（一般 iOS 皮肤是 3 倍图）">
    <option value="3" selected>图3倍</option>
    <option value="2">图2倍</option>
    <option value="1">图1倍</option>
  </select>
  <label class="chk" title="预览外面套一个 iPhone 17 Pro Max 的仿真机身">
    <input type="checkbox" id="chkShell" checked> 手机壳
  </label>
  <label class="chk" title="勾选后，所有修改会同时应用到浅色和深色模式（强烈建议保持勾选，否则手机在另一模式下看不到你的修改）">
    <input type="checkbox" id="chkSync" checked> 明暗同步改
  </label>
  <label class="chk" title="显示选中按键的长按符号面板">
    <input type="checkbox" id="chkHints"> 长按预览
  </label>
  <button class="btn" id="btnTheme" title="切换编辑器界面的明亮/暗黑主题">🌓 界面主题</button>
</div>

<div id="main">
  <div id="left">
    <div id="leftTabs">
      <button class="tab active" data-tab="files">键盘</button>
      <button class="tab" data-tab="global">全局</button>
      <button class="tab" data-tab="layout">布局树</button>
      <button class="tab" data-tab="res">图片</button>
      <button class="tab" data-tab="cfg">皮肤信息</button>
      <button class="tab" data-tab="check">检查</button>
      <button class="tab" data-tab="src">源码</button>
    </div>
    <div id="leftBody">
      <div class="panel-hint">导入皮肤后，这里会列出所有键盘文件。</div>
    </div>
  </div>

  <div id="center">
    <div id="phoneShell" data-kb="light">
      <div class="ps-btn ps-action"></div>
      <div class="ps-btn ps-volup"></div>
      <div class="ps-btn ps-voldown"></div>
      <div class="ps-btn ps-power"></div>
      <div id="phoneScreen">
        <div id="psTop">
          <div id="psStatus">
            <span class="ps-time">9:41</span>
            <div id="psIsland"><span class="ps-cam"></span></div>
            <span class="ps-staticons">
              <svg class="ps-sig" viewBox="0 0 18 12" width="17" height="11"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
              <span class="ps-5g">5G</span>
              <svg class="ps-wifi" viewBox="0 0 16 12" width="15" height="11"><path d="M8 10.8 5.6 8.4a3.4 3.4 0 0 1 4.8 0Z"/><path d="M3.5 6.3a6.4 6.4 0 0 1 9 0l-1.5 1.5a4.3 4.3 0 0 0-6 0Z" opacity=".9"/><path d="M1 3.8a9.9 9.9 0 0 1 14 0l-1.5 1.5a7.8 7.8 0 0 0-11 0Z" opacity=".8"/></svg>
              <span class="ps-batt"><span class="ps-batt-fill"></span></span>
            </span>
          </div>
          <div class="ps-nav">
            <span class="ps-back">‹</span>
            <div class="ps-contact">
              <span class="ps-avatar">美</span>
              <span class="ps-name">小美 <i>›</i></span>
            </div>
            <svg class="ps-video" viewBox="0 0 24 16" width="22" height="15"><rect x="0" y="1" width="16" height="14" rx="3"/><path d="M17.5 6.5 23 3v10l-5.5-3.5Z"/></svg>
          </div>
        </div>
        <div id="psApp">
          <div class="ps-chat">
            <div class="ps-date">今天 21:36</div>
            <div class="ps-bubble in">周末一起出去拍照呀？📷</div>
            <div class="ps-bubble out">好呀！我正在用元书输入法回你 😆</div>
            <div class="ps-bubble in">哇 这个键盘皮肤好好看！</div>
          </div>
          <div class="ps-inputbar">
            <span class="ps-plus">＋</span>
            <div class="ps-field"><span id="psFieldText">iMessage 信息</span><svg class="ps-mic" viewBox="0 0 12 18" width="11" height="16"><rect x="3.5" y="0" width="5" height="10" rx="2.5"/><path d="M1 8a5 5 0 0 0 10 0M6 13v4M3.5 17.5h5" fill="none" stroke-width="1.4"/></svg></div>
          </div>
        </div>
        <div id="previewWrap">
          <canvas id="previewCanvas"></canvas>
          <canvas id="overlayCanvas"></canvas>
          <div id="previewEmpty">
            <div style="font-size:15px;color:var(--text);margin-bottom:6px">第一次做皮肤？</div>
            <button class="btn wizard" id="btnWizardEmpty" style="font-size:15px;padding:10px 18px;margin-bottom:16px">🪄 点这里一键做皮肤</button>
            <div style="font-size:12px;line-height:1.8">
              或者：把 .cskin 文件拖进来 / 点左上角「导入」修改现成皮肤<br><br>
              做皮肤时：<br>
              · 点预览里的按键 → 右侧直接改颜色文字<br>
              · 按住按键不放 → 看按下效果和动画<br>
              · 点空白区域 → 打开整体设置
            </div>
          </div>
        </div>
        <div id="psHome"></div>
      </div>
    </div>
  </div>

  <div id="right">
    <div id="inspectorBody"></div>
  </div>
</div>

<script>
/* =========================================================
 * model.js — .cskin 皮肤包的读取 / 数据模型 / 写回
 * ========================================================= */
'use strict';

const SkinModel = (() => {

  // ---------- 工具 ----------
  const td = new TextDecoder('utf-8');
  const te = new TextEncoder();

  function yamlLoad(text, label) {
    try {
      return jsyaml.load(text, { json: true });
    } catch (e) {
      throw new Error(`YAML 解析失败（${label}）：${e.message}`);
    }
  }

  function yamlDump(obj) {
    return jsyaml.dump(obj, {
      indent: 2,
      lineWidth: -1,
      noRefs: true,
      quotingType: '"',
      sortKeys: false,
    });
  }

  // ---------- 模型 ----------
  const model = {
    loaded: false,
    fileName: '',          // 原始 cskin 文件名
    rootPrefix: '',        // zip 内的根目录前缀，如 "喜乐/"
    rawFiles: new Map(),   // path(去掉前缀) -> Uint8Array （所有文件原始内容）
    config: null,          // config.yaml 解析结果
    docs: { light: {}, dark: {} },   // 键盘文件名(不含.yaml) -> 解析对象
    docDirty: { light: new Set(), dark: new Set() },
    configDirty: false,
    textOverrides: new Map(), // 被改写的 jsonnet/libsonnet/其它文本；单独保存，优先于包内原始字节
    animationDirty: false,    // 用户在可视化里改过按键动画 → 导出时生成 jsonnet 覆盖层
    resources: { light: {}, dark: {} }, // 图片名 -> {bytes, url, img(Image), slices:{名:{rect,insets}}, slicesDirty}
    fonts: [],             // fonts 目录下的文件名
    sounds: [],            // sound 目录下的文件名
    demoPng: null,         // Uint8Array 或 null
    readme: null,          // 字符串或 null
  };

  function reset() {
    model.loaded = false;
    model.fileName = '';
    model.rootPrefix = '';
    model.rawFiles = new Map();
    model.config = null;
    model.docs = { light: {}, dark: {} };
    model.docDirty = { light: new Set(), dark: new Set() };
    model.configDirty = false;
    model.textOverrides = new Map();
    model.animationDirty = false;
    for (const m of ['light', 'dark']) {
      for (const k in model.resources[m]) {
        const r = model.resources[m][k];
        if (r.url) URL.revokeObjectURL(r.url);
      }
    }
    model.resources = { light: {}, dark: {} };
    model.fonts = [];
    model.sounds = [];
    model.demoPng = null;
    model.readme = null;
  }

  // ---------- 载入 ----------
  async function loadCskin(arrayBuffer, fileName) {
    reset();
    const zip = await JSZip.loadAsync(arrayBuffer);
    const paths = Object.keys(zip.files).filter(p => !zip.files[p].dir);

    // 过滤 mac 垃圾文件
    const valid = paths.filter(p =>
      !p.startsWith('__MACOSX/') && !p.split('/').pop().startsWith('._') &&
      p.split('/').pop() !== '.DS_Store');

    // 找根前缀：config.yaml 所在目录
    let rootPrefix = '';
    let cfgPath = valid.find(p => p === 'config.yaml');
    if (!cfgPath) {
      const cand = valid.find(p => p.endsWith('/config.yaml'));
      if (!cand) throw new Error('包内找不到 config.yaml，不是有效的皮肤文件');
      rootPrefix = cand.slice(0, cand.length - 'config.yaml'.length);
      cfgPath = cand;
    }
    model.rootPrefix = rootPrefix;

    // 读全部文件字节
    for (const p of valid) {
      if (rootPrefix && !p.startsWith(rootPrefix)) continue;
      const rel = p.slice(rootPrefix.length);
      if (!rel) continue;
      const bytes = await zip.files[p].async('uint8array');
      model.rawFiles.set(rel, bytes);
    }

    // config
    model.config = yamlLoad(td.decode(model.rawFiles.get('config.yaml')), 'config.yaml') || {};

    // 键盘文件 + 资源
    for (const mode of ['light', 'dark']) {
      for (const [rel, bytes] of model.rawFiles) {
        const mDoc = rel.match(new RegExp(`^${mode}/([^/]+)\\.yaml$`));
        if (mDoc) {
          const name = mDoc[1];
          try {
            model.docs[mode][name] = yamlLoad(td.decode(bytes), `${mode}/${name}.yaml`) || {};
          } catch (e) {
            console.warn(e.message);
            model.docs[mode][name] = { __parseError: e.message, __raw: td.decode(bytes) };
          }
          continue;
        }
        const mRes = rel.match(new RegExp(`^${mode}/resources/([^/]+)\\.(png|PNG)$`));
        if (mRes) {
          const name = mRes[1];
          model.resources[mode][name] = model.resources[mode][name] || { slices: {} };
          model.resources[mode][name].bytes = bytes;
          continue;
        }
        const mResY = rel.match(new RegExp(`^${mode}/resources/([^/]+)\\.yaml$`));
        if (mResY) {
          const name = mResY[1];
          model.resources[mode][name] = model.resources[mode][name] || { slices: {} };
          try {
            model.resources[mode][name].slices = yamlLoad(td.decode(bytes), rel) || {};
          } catch (e) { console.warn(e.message); }
        }
      }
    }

    model.fonts = [...model.rawFiles.keys()].filter(p => p.startsWith('fonts/')).map(p => p.slice(6));
    model.sounds = [...model.rawFiles.keys()].filter(p => p.startsWith('sound/')).map(p => p.slice(6));
    model.demoPng = model.rawFiles.get('demo.png') || null;
    model.readme = model.rawFiles.has('README.md') ? td.decode(model.rawFiles.get('README.md')) : null;

    // 解码所有图片
    await decodeAllImages();

    model.fileName = fileName || 'skin.cskin';
    model.loaded = true;
    return model;
  }

  async function decodeAllImages() {
    const jobs = [];
    for (const mode of ['light', 'dark']) {
      for (const name in model.resources[mode]) {
        const r = model.resources[mode][name];
        if (!r.bytes) continue;
        jobs.push(decodeImage(r));
      }
    }
    await Promise.all(jobs);
  }

  function decodeImage(r) {
    return new Promise(resolve => {
      if (r.url) URL.revokeObjectURL(r.url);
      const blob = new Blob([r.bytes], { type: 'image/png' });
      r.url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => { r.img = img; resolve(); };
      img.onerror = () => { r.img = null; resolve(); };
      img.src = r.url;
    });
  }

  // 空皮肤模板；t9Pinyin=true 时中文键盘用九键
  async function newSkin(t9Pinyin) {
    reset();
    const tmpl = SkinTemplate.build(t9Pinyin); // 由 template.js 提供
    model.config = tmpl.config;
    model.docs = tmpl.docs;
    model.fileName = '我的新皮肤.cskin';
    for (const mode of ['light', 'dark']) {
      for (const n in model.docs[mode]) model.docDirty[mode].add(n);
    }
    model.configDirty = true;
    model.loaded = true;
    return model;
  }

  // ---------- 资源操作 ----------
  async function setResourceImage(mode, name, bytes) {
    const r = model.resources[mode][name] = model.resources[mode][name] || { slices: {} };
    r.bytes = bytes;
    r.slicesDirty = true;
    await decodeImage(r);
  }

  function deleteResource(mode, name) {
    const r = model.resources[mode][name];
    if (r && r.url) URL.revokeObjectURL(r.url);
    delete model.resources[mode][name];
    model.rawFiles.delete(`${mode}/resources/${name}.png`);
    model.rawFiles.delete(`${mode}/resources/${name}.yaml`);
  }

  function getResource(mode, name) {
    // 当前模式找不到时回退另一个模式（与真机行为一致性最好的近似）
    return model.resources[mode][name] || model.resources[mode === 'light' ? 'dark' : 'light'][name] || null;
  }

  // ================================================================
  // Jsonnet 源码联动
  //   本编辑器改的是"编译后的成品 YAML"，而 jsonnet 编译型皮肤在手机上
  //   「运行 main.jsonnet」时会用 jsonnet 源码重新生成 YAML，把成品覆盖掉。
  //   为了让"预编辑/候选区位置""按键动画"这类改动重编译后仍然生效，这里
  //   把它们直接写回 jsonnet 源码（官方模板的稳定字段），或在导出时生成一层
  //   包装覆盖层。思路参考社区可用方案，仅针对官方模板的稳定结构做精确映射。
  // ================================================================
  function sourceText(rel) {
    if (model.textOverrides.has(rel)) return model.textOverrides.get(rel);
    const bytes = model.rawFiles.get(rel);
    return bytes ? td.decode(bytes) : null;
  }
  function findSourcePath(suffix) {
    const all = new Set([...model.rawFiles.keys(), ...model.textOverrides.keys()]);
    return [...all].find(p => p === suffix || p.endsWith('/' + suffix)) || null;
  }
  function hasJsonnet() {
    return [...model.rawFiles.keys(), ...model.textOverrides.keys()].some(p => /(^|\/)jsonnet\//.test(p) || /\.(jsonnet|libsonnet)$/i.test(p));
  }

  // ---- 预编辑区 / 候选区内边距 ↔ jsonnet 源码 ----
  function jsonnetPreeditBinding(docName) {
    const name = String(docName || '');
    let rel = null;
    if (/^iPadPinyin/i.test(name)) {
      rel = findSourcePath('jsonnet/Components/iPadPinyin.libsonnet');
      if (rel) return { rel, kind: 'candidateInsets', label: 'iPadPinyin.libsonnet → candidateInsets' };
    }
    if (/^iPadNumeric/i.test(name)) {
      rel = findSourcePath('jsonnet/Components/iPadNumeric.libsonnet');
      if (rel) return { rel, kind: 'candidateInsets', label: 'iPadNumeric.libsonnet → candidateInsets' };
    }
    rel = findSourcePath('jsonnet/Constants/Keyboard.libsonnet');
    return rel ? { rel, kind: 'preedit', label: 'Keyboard.libsonnet → preedit.insets' } : null;
  }
  // 括号配对：跳过字符串、行/块注释、# 注释，返回与 open 位置 { 配对的 } 下标
  function matchingBrace(text, open) {
    let depth = 0, quote = null, escaped = false, lineComment = false, blockComment = false;
    for (let i = open; i < text.length; i++) {
      const c = text[i], n = text[i + 1];
      if (lineComment) { if (c === '\n') lineComment = false; continue; }
      if (blockComment) { if (c === '*' && n === '/') { blockComment = false; i++; } continue; }
      if (quote) {
        if (escaped) { escaped = false; continue; }
        if (c === '\\') { escaped = true; continue; }
        if (c === quote) quote = null;
        continue;
      }
      if (c === '/' && n === '/') { lineComment = true; i++; continue; }
      if (c === '/' && n === '*') { blockComment = true; i++; continue; }
      if (c === '#') { lineComment = true; continue; }
      if (c === '"' || c === "'") { quote = c; continue; }
      if (c === '{') depth++;
      if (c === '}' && --depth === 0) return i;
    }
    return -1;
  }
  function locateJsonnetInsets(text, binding) {
    const anchorRe = binding.kind === 'candidateInsets'
      ? /(?:^|\n)[ \t]*local[ \t]+candidateInsets[ \t]*=[ \t]*/m
      : /(?:^|\n)[ \t]*preedit[ \t]*:[ \t]*/m;
    const anchor = anchorRe.exec(text);
    if (!anchor) return null;
    const outerOpen = text.indexOf('{', anchor.index + anchor[0].length);
    if (outerOpen < 0) return null;
    const outerClose = matchingBrace(text, outerOpen);
    if (outerClose < 0) return null;
    const innerText = text.slice(outerOpen + 1, outerClose);
    const insetsMatch = /(?:^|\n)([ \t]*)insets[ \t]*:[ \t]*/m.exec(innerText);
    if (!insetsMatch) return null;
    const insetsOpen = text.indexOf('{', outerOpen + 1 + insetsMatch.index + insetsMatch[0].length);
    if (insetsOpen < 0 || insetsOpen >= outerClose) return null;
    const insetsClose = matchingBrace(text, insetsOpen);
    if (insetsClose < 0 || insetsClose > outerClose) return null;
    return { insetsOpen, insetsClose, indent: insetsMatch[1] || '' };
  }
  function getJsonnetPreeditInsets(docName) {
    const binding = jsonnetPreeditBinding(docName);
    if (!binding) return null;
    const text = sourceText(binding.rel);
    const loc = text && locateJsonnetInsets(text, binding);
    if (!loc) return null;
    const body = text.slice(loc.insetsOpen + 1, loc.insetsClose);
    const values = {};
    const re = /\b(top|bottom|left|right)[ \t]*:[ \t]*(-?(?:\d+(?:\.\d+)?|\.\d+))/g;
    let m;
    while ((m = re.exec(body))) values[m[1]] = Number(m[2]);
    return { values, binding };
  }
  function setJsonnetPreeditInsets(docName, insets) {
    const binding = jsonnetPreeditBinding(docName);
    if (!binding) throw new Error('这个皮肤里没有可联动的 jsonnet 预编辑区源码');
    const text = sourceText(binding.rel);
    const loc = text && locateJsonnetInsets(text, binding);
    if (!loc) throw new Error(`定位不到 ${binding.label}，源码结构可能不是官方模板`);
    const values = insets || {};
    const lines = [];
    for (const key of ['top', 'bottom', 'left', 'right']) {
      if (values[key] == null || values[key] === '') continue;
      const n = Number(values[key]);
      if (!Number.isFinite(n)) throw new Error(`预编辑区${key}不是有效数字`);
      lines.push(`${loc.indent}  ${key}: ${n},`);
    }
    const replacement = lines.length ? `\n${lines.join('\n')}\n${loc.indent}` : '';
    const next = text.slice(0, loc.insetsOpen + 1) + replacement + text.slice(loc.insetsClose);
    model.textOverrides.set(binding.rel, next);
    return binding;
  }

  // ---- 通用 jsonnet 覆盖层 ----
  // 让"在可视化里做的任何改动"（颜色/通知/布局/样式/尺寸/动画/config 等）在手机
  // 「运行 main.jsonnet」重编译后依然生效：导出时把 main.jsonnet 包一层，用编译产物
  // 与"用户改动"做对比，把改过的顶层键覆盖回重编译结果上。
  //   注意：预编辑/候选区"位置"是编译期常量（preedit.insets / candidateInsets），必须
  //   改 jsonnet 源码，已由 setJsonnetPreeditInsets 单独处理，不走这里。
  const OVERLAY_MARKER = '// @yuanshu-editor-overlay';
  const OLD_ANIM_MARKER = '// @yuanshu-editor-animation-overlay';
  function markAnimationDirty() { model.animationDirty = true; }

  // 对比"原始编译产物"与"用户编辑后的文档"，返回改过/新增的顶层键(patch)与删除的键(deleted)
  function docTopLevelDiff(originalObj, editedObj) {
    const patch = {};
    const deleted = [];
    const oo = (originalObj && typeof originalObj === 'object') ? originalObj : {};
    const eo = (editedObj && typeof editedObj === 'object') ? editedObj : {};
    for (const k of Object.keys(eo)) {
      if (k === '__parseError' || k === '__raw') continue;
      if (!(k in oo) || JSON.stringify(eo[k]) !== JSON.stringify(oo[k])) patch[k] = eo[k];
    }
    for (const k of Object.keys(oo)) if (!(k in eo)) deleted.push(k);
    return { patch, deleted };
  }
  // 原始编译产物：优先包内原始字节（= 源码重编译应产出的内容）
  function originalCompiledDoc(rel) {
    if (!model.rawFiles.has(rel)) return {};
    try { return yamlLoad(td.decode(model.rawFiles.get(rel)), rel) || {}; }
    catch (e) { return {}; }
  }
  // 收集所有键盘文件的改动 + config.yaml 改动
  function collectOverlayConfig() {
    const documents = {};
    for (const mode of ['light', 'dark']) {
      for (const name in model.docs[mode]) {
        const doc = model.docs[mode][name];
        if (!doc || doc.__parseError) continue;
        const rel = `${mode}/${name}.yaml`;
        const { patch, deleted } = docTopLevelDiff(originalCompiledDoc(rel), doc);
        if (Object.keys(patch).length || deleted.length) {
          documents[rel] = JSON.parse(JSON.stringify({ patch, deleted }));
        }
      }
    }
    // config.yaml：与原始不同就整体覆盖（config 很小，整体覆盖最稳）
    let configYaml = null;
    let origCfg = {};
    if (model.rawFiles.has('config.yaml')) {
      try { origCfg = yamlLoad(td.decode(model.rawFiles.get('config.yaml')), 'config.yaml') || {}; } catch (e) {}
    }
    if (JSON.stringify(model.config || {}) !== JSON.stringify(origCfg)) {
      configYaml = JSON.parse(JSON.stringify(model.config || {}));
    }
    return { configYaml, documents };
  }

  // 导出时调用：只要有任何改动（或已装过覆盖层），就把 main.jsonnet 包一层。
  function prepareJsonnetOverlay() {
    const mainRel = findSourcePath('jsonnet/main.jsonnet');
    if (!mainRel) return;
    const mainText = sourceText(mainRel);
    const alreadyInstalled = mainText && (mainText.includes(OVERLAY_MARKER) || mainText.includes(OLD_ANIM_MARKER));
    const ov = collectOverlayConfig();
    const hasChange = ov.configYaml != null || Object.keys(ov.documents).length > 0 || model.animationDirty;
    if (!hasChange && !alreadyInstalled) return;
    if (!alreadyInstalled && (!mainText.includes('std.toString') || !mainText.includes('config.yaml'))) {
      throw new Error('这个皮肤的 main.jsonnet 不是可安全包装的标准结构，已停止导出，避免生成损坏皮肤');
    }
    const dir = mainRel.slice(0, mainRel.length - 'main.jsonnet'.length);
    const backupRel = dir + 'main.editor-original.jsonnet';
    const overlayRel = dir + 'editor_overlay.libsonnet';
    const configRel = dir + 'editor_overlay_config.libsonnet';
    if (!alreadyInstalled) {
      if (model.rawFiles.has(backupRel) || model.textOverrides.has(backupRel)) {
        throw new Error('皮肤内已有 main.editor-original.jsonnet，无法安全安装覆盖层');
      }
      model.textOverrides.set(backupRel, mainText);
    } else if (!sourceText(backupRel)) {
      throw new Error('覆盖层缺少原始 main.jsonnet 备份，已停止导出');
    }
    // 清理旧版"仅动画"覆盖层文件（升级到通用覆盖层）
    for (const old of [dir + 'editor_animation_overlay.libsonnet', dir + 'editor_animation_config.libsonnet']) {
      model.rawFiles.delete(old);
      model.textOverrides.delete(old);
    }
    const overlaySource =
`// Generated by 元书皮肤编辑器；用于在 jsonnet 重编译后保留可视化里做的所有改动。
// applyDoc：先删掉 deleted 里的顶层键，再用 patch 覆盖同名顶层键。
{
  applyDoc(doc, cfg)::
    local deleted = std.get(cfg, 'deleted', []);
    local kept = {
      [k]: doc[k]
      for k in std.objectFields(doc)
      if !std.member(deleted, k)
    };
    kept + std.get(cfg, 'patch', {}),
}
`;
    const configSource = JSON.stringify(ov, null, 2) + '\n';
    const wrapperSource =
`${OVERLAY_MARKER}
// 由元书皮肤编辑器生成：在此皮肤重编译（运行 main.jsonnet）后，把编辑器里的改动重新套用上去。
local original = import 'main.editor-original.jsonnet';
local overlay = import 'editor_overlay.libsonnet';
local ov = import 'editor_overlay_config.libsonnet';

{
  [path]:
    if path == 'config.yaml' then
      (if ov.configYaml != null
        then std.manifestYamlDoc(ov.configYaml, indent_array_in_object=true, quote_keys=false)
        else original[path])
    else if !std.objectHas(ov.documents, path) then original[path]
    else std.toString(overlay.applyDoc(std.parseJson(original[path]), ov.documents[path]))
  for path in std.objectFields(original)
}
`;
    model.textOverrides.set(overlayRel, overlaySource);
    model.textOverrides.set(configRel, configSource);
    model.textOverrides.set(mainRel, wrapperSource);
    model.animationDirty = false;
  }

  // ---------- 导出 ----------
  async function exportCskin(opts = {}) {
    // jsonnet 皮肤：先把 main.jsonnet 包一层，保证重编译后可视化里做的所有改动仍生效。
    prepareJsonnetOverlay();
    const zip = new JSZip();
    const prefix = model.rootPrefix || ((model.config && model.config.name ? String(model.config.name) : '皮肤') + '/');

    const skip = new Set();     // 已写入、后续不再用原始字节覆盖的 path
    // config：没改过就逐字节保留，避免无谓地重排/重写触发手机端解析报错
    const rawConfig = model.rawFiles.get('config.yaml');
    zip.file(prefix + 'config.yaml', (model.configDirty || !rawConfig) ? yamlDump(model.config) : rawConfig);
    skip.add('config.yaml');

    // 键盘文件：只有真正改过的才重新 dump，其余逐字节保留编译产物
    for (const mode of ['light', 'dark']) {
      for (const name in model.docs[mode]) {
        const doc = model.docs[mode][name];
        const rel = `${mode}/${name}.yaml`;
        if (doc && doc.__parseError) {
          zip.file(prefix + rel, doc.__raw);
        } else if (!model.docDirty[mode].has(name) && model.rawFiles.has(rel)) {
          zip.file(prefix + rel, model.rawFiles.get(rel)); // 未改动 → 原始字节
        } else {
          zip.file(prefix + rel, yamlDump(doc));
        }
        skip.add(rel);
      }
      // 资源
      for (const rname in model.resources[mode]) {
        const r = model.resources[mode][rname];
        if (r.bytes) {
          zip.file(`${prefix}${mode}/resources/${rname}.png`, r.bytes);
          skip.add(`${mode}/resources/${rname}.png`);
        }
        if (r.slices && Object.keys(r.slices).length) {
          const sliceRel = `${mode}/resources/${rname}.yaml`;
          const sliceBytes = (!r.slicesDirty && model.rawFiles.has(sliceRel))
            ? model.rawFiles.get(sliceRel)
            : yamlDump(r.slices);
          zip.file(prefix + sliceRel, sliceBytes);
          skip.add(sliceRel);
        }
      }
    }

    if (model.demoPng) { zip.file(prefix + 'demo.png', model.demoPng); skip.add('demo.png'); }
    if (model.readme != null) { zip.file(prefix + 'README.md', model.readme); skip.add('README.md'); }

    // jsonnet / libsonnet 等源码改动优先于包内原始字节
    for (const [rel, text] of model.textOverrides) {
      zip.file(prefix + rel, text);
      skip.add(rel);
    }

    // 其余原始文件原样保留；删除 App 生成的 .keyboard 缓存（避免修改不生效）
    for (const [rel, bytes] of model.rawFiles) {
      if (skip.has(rel)) continue;
      const base = rel.split('/').pop();
      if (base.startsWith('.') && base.endsWith('.keyboard')) continue; // 旧缓存，必须丢弃
      // 已被删除的键盘 yaml 不再写回
      const mDoc = rel.match(/^(light|dark)\/([^/]+)\.yaml$/);
      if (mDoc && !(mDoc[2] in model.docs[mDoc[1]])) continue;
      const mRes = rel.match(/^(light|dark)\/resources\/([^/]+)\.(png|yaml)$/);
      if (mRes && !(mRes[2] in model.resources[mRes[1]])) continue;
      zip.file(prefix + rel, bytes);
    }

    return await zip.generateAsync({
      type: 'blob',
      compression: 'DEFLATE',
      compressionOptions: { level: 6 },
    });
  }

  // ---------- 文本文件直接读写（原始 YAML / jsonnet 源码编辑用） ----------
  function readTextFile(rel) {
    if (rel === 'config.yaml') return (model.textOverrides.has(rel) ? model.textOverrides.get(rel) : yamlDump(model.config));
    const mDoc = rel.match(/^(light|dark)\/([^/]+)\.yaml$/);
    if (mDoc && model.docs[mDoc[1]][mDoc[2]]) {
      const doc = model.docs[mDoc[1]][mDoc[2]];
      return doc.__parseError ? doc.__raw : yamlDump(doc);
    }
    if (model.textOverrides.has(rel)) return model.textOverrides.get(rel);
    const bytes = model.rawFiles.get(rel);
    return bytes ? td.decode(bytes) : null;
  }

  function writeTextFile(rel, text) {
    if (rel === 'config.yaml') {
      model.config = yamlLoad(text, rel) || {};
      model.configDirty = true;
      return;
    }
    const mDoc = rel.match(/^(light|dark)\/([^/]+)\.yaml$/);
    if (mDoc) {
      model.docs[mDoc[1]][mDoc[2]] = yamlLoad(text, rel) || {};
      model.docDirty[mDoc[1]].add(mDoc[2]);
      return;
    }
    const mResY = rel.match(/^(light|dark)\/resources\/([^/]+)\.yaml$/);
    if (mResY) {
      const r = model.resources[mResY[1]][mResY[2]];
      if (r) { r.slices = yamlLoad(text, rel) || {}; r.slicesDirty = true; }
      return;
    }
    // jsonnet / libsonnet 等其它文本 → 存入 textOverrides（导出时优先），支持撤销
    model.textOverrides.set(rel, text);
  }

  function listTextFiles() {
    const out = new Set(['config.yaml']);
    for (const mode of ['light', 'dark']) {
      for (const n in model.docs[mode]) out.add(`${mode}/${n}.yaml`);
      for (const n in model.resources[mode]) out.add(`${mode}/resources/${n}.yaml`);
    }
    for (const rel of model.rawFiles.keys()) {
      const base = rel.split('/').pop();
      if (base.startsWith('.') && base.endsWith('.keyboard')) continue;
      if (/\.(yaml|yml|md|txt|json|jsonnet|libsonnet)$/i.test(rel)) out.add(rel);
    }
    for (const rel of model.textOverrides.keys()) out.add(rel);
    return [...out].sort();
  }

  // ---------- 键盘文件管理 ----------
  function addKeyboardDoc(mode, name, obj) {
    model.docs[mode][name] = obj;
    model.docDirty[mode].add(name);
  }
  function removeKeyboardDoc(mode, name) {
    delete model.docs[mode][name];
  }
  function renameKeyboardDoc(oldName, newName) {
    for (const mode of ['light', 'dark']) {
      if (model.docs[mode][oldName]) {
        model.docs[mode][newName] = model.docs[mode][oldName];
        delete model.docs[mode][oldName];
        model.docDirty[mode].add(newName);
      }
    }
    // 同步 config 引用
    const cfg = model.config || {};
    for (const k in cfg) {
      const v = cfg[k];
      if (v && typeof v === 'object') {
        for (const dev of ['iPhone', 'iPad']) {
          if (v[dev] && typeof v[dev] === 'object') {
            for (const ori in v[dev]) {
              if (v[dev][ori] === oldName) v[dev][ori] = newName;
            }
          }
        }
      }
    }
    model.configDirty = true;
  }

  // ---------- 快照（撤销/重做） ----------
  function snapshot() {
    return JSON.stringify({
      config: model.config,
      docs: model.docs,

    mode: 'light',           // light / dark
    docName: null,           // 当前预览的键盘文件名

    conditions: {},          // conditionKey -> value（条件样式模拟）

        { index: 2, text: '尼', comment: '' },
        { index: 3, text: '妮', comment: '' },
        { index: 4, text: '泥', comment: '' },

      return '#' + hex.slice(-6);

    if (s.startsWith('#')) s = s.slice(1);

    if (s.length === 6) return '#' + s;

      if (w < 0.35) return 600;

    if (v == null) return null;
    if (typeof v === 'number') return v;

      if (!out.length && ref.length && ref[0] && ref[0].styleName) {

        for (const n of names) if (doc[n]) out.push(doc[n]);
      }
      return out;
    }
    if (typeof ref === 'object') return [ref];
    return [];

    const key = cond.conditionKey;
    if (key == null) return true;

    let cur = state.conditions[key];

    const want = cond.conditionValue;
    if (cur == null) return want === false || want == null; // 默认未开启
    if (Array.isArray(want)) return want.includes(cur);

    if (!ntf || typeof ntf !== 'object') return false;

    if (t === 'returnKeyType') {
      if (state.sim.returnKeyType == null) return false;

    if (t === 'rime') {

  function drawNinePatch(ctx, img, sx, sy, sw, sh, insets, dx, dy, dw, dh) {

      [dx, dx + dl, dx + dw - dr],
      [l, sMidW, r],
      [dl, dMidW, dr],
    ];
    const rows = [
      [sy, sy + t, sy + sh - b],
      [dy, dy + dt, dy + dh - db],
      [t, sMidH, b],
      [dt, dMidH, db],

  function substituteText(t) {
