  // ============ 长按符号面板 hintSymbolsStyle 编辑 ============
  // 对应官方文档 guides/skins/hintsymbolsgrid（长按符号面板）：
  // 手指按住按键不放 → 键上方弹出符号面板 → 滑到想要的符号上松手输入。
  // 符号多时自动换行排成网格；兼容旧版属性名 holdSymbolsStyle 并支持一键迁移。
  function hintSymbolsEditor(container, doc, def) {
    container.innerHTML = '';
    const keyName = App.selection;

    // 定位面板：新版 hintSymbolsStyle 优先，旧版 holdSymbolsStyle 兜底
    const propOf = dd => (dd && dd.hintSymbolsStyle != null) ? 'hintSymbolsStyle'
      : ((dd && dd.holdSymbolsStyle != null) ? 'holdSymbolsStyle' : null);
    const panelOf = d => {
      const dd = d[keyName];
      const p = propOf(dd);
      if (!p) return null;
      const ref = dd[p];
      return typeof ref === 'string' ? d[ref] : ref;
    };
    // 面板修改按名字同步写进浅色+深色两份文件
    const editPanel = mut => App.edit(d => {
      const hs2 = panelOf(d);
      if (hs2 && typeof hs2 === 'object') mut(hs2, d);
    });
    const isDarkDoc = d => d === SkinModel.model.docs.dark[Renderer.state.docName];
    const redraw = () => hintSymbolsEditor(container, doc, doc[keyName] || def);

    // 生成两种模式下都不冲突的新名字
    const mkNamer = () => {
      const m0 = SkinModel.model;
      const taken = new Set([
        ...Object.keys(m0.docs.light[Renderer.state.docName] || {}),
        ...Object.keys(m0.docs.dark[Renderer.state.docName] || {}),
      ]);
      return base => { let n = base, i = 2; while (taken.has(n)) n = base + i++; taken.add(n); return n; };
    };

    // 把一串字符拆成符号数组：有空格按空格分（支持多字符符号），否则一个字一个符号
    const splitSymbols = s => {
      s = String(s == null ? '' : s).trim();
      if (!s) return [];
      if (/\s/.test(s)) return s.split(/\s+/).filter(Boolean);
      return [...s];
    };

    // 批量添加符号（自动建好前景样式，小白不用碰"样式"概念）
    function addSymbols(chars) {
      if (!chars.length) return;
      const mk = mkNamer();
      const baseCount = ((panelOf(doc) || {}).symbolStyles || []).length;
      const items = chars.map((ch, idx) => {
        const symN = mk(`${keyName || 'key'}HintSym${baseCount + idx + 1}`);
        return { ch, symN, fgN: mk(symN + 'Fg') };
      });
      App.edit(d => {
        const hs2 = panelOf(d);
        if (!hs2) return;
        const dark = isDarkDoc(d);
        for (const it of items) {
          d[it.fgN] = { buttonStyleType: 'text', text: it.ch, fontSize: 18, normalColor: dark ? '#ffffff' : '#000000' };
          d[it.symN] = { action: { symbol: it.ch }, foregroundStyle: it.fgN };
          hs2.symbolStyles = hs2.symbolStyles || [];
          hs2.symbolStyles.push(it.symN);
        }
      });
      // 自动打开长按预览，立刻能看到效果
      Renderer.state.showHints = true;
      const chk = document.getElementById('chkHints');
      if (chk) chk.checked = true;
      App.renderPreview();
      redraw();
      toast(`已添加 ${items.length} 个符号，预览里正显示这个面板`);
    }

    function openBatchAdd() {
      const m = UI.modal('添加长按符号', '460px');
      m.body.appendChild(el('div', 'hint-line',
        '想加什么符号就直接打出来，一个字算一个符号。\n如输入 ！？…～ 会一次加 4 个。多字符符号（如 :-)）之间用空格分开。'));
      const inp = el('input'); inp.type = 'text'; inp.style.width = '100%'; inp.placeholder = '如：！？…～';
      m.body.appendChild(inp);
      const presets = [
        ['中文标点', '，。？！…：；～'],
        ['英文标点', ',.?!\'";:'],
        ['括号书名号', '（）「」《》【】'],
        ['数字', '1234567890'],
        ['货币符号', '￥$€£%°'],
        ['a 的注音', 'àáǎâā'],
        ['e 的注音', 'èéěêē'],
      ];
      const rowP = el('div');
      for (const [lab, s] of presets) {
        rowP.appendChild(button(lab, () => { inp.value = s; }, 'btn small'));
      }
      m.body.appendChild(field('快捷模板（点一下填入，可再改）', rowP));
      m.body.appendChild(button('✓ 添加这些符号', () => {
        const chars = splitSymbols(inp.value);
        if (!chars.length) { toast('还没输入符号', true); return; }
        m.close();
        addSymbols(chars);
      }, 'btn primary'));
    }

    // 给面板配一套好看的默认样式（白底圆角+蓝色选中），一键完成
    function beautifyPanel() {
      const mk = mkNamer();
      const bgN = mk((keyName || 'key') + 'HintPanelBg');
      const selN = mk((keyName || 'key') + 'HintPanelSel');
      App.edit(d => {
        const hs2 = panelOf(d);
        if (!hs2) return;
        const dark = isDarkDoc(d);
        d[bgN] = {
          buttonStyleType: 'geometry', cornerRadius: 9,
          normalColor: dark ? '#3a3a3c' : '#ffffff',
          normalBorderColor: dark ? '#00000066' : '#00000022', borderSize: 0.5,
          normalShadowColor: '#00000088', shadowRadius: 8, shadowOpacity: 0.35, shadowOffset: { x: 0, y: 2 },
        };
        d[selN] = {
          buttonStyleType: 'geometry', cornerRadius: 7,
          insets: { top: 4, bottom: 4, left: 3, right: 3 },
          normalColor: dark ? '#0a84ff' : '#3478f6',
        };
        hs2.backgroundStyle = bgN;
        hs2.selectedBackgroundStyle = selN;
        if (!hs2.size) hs2.size = { width: 38, height: 48 };
      });
      redraw();
      toast('面板已配好默认样式（可在下面继续微调）');
    }

    const prop = propOf(def);

    if (!prop) {
      container.appendChild(button('＋给这个键加「长按符号面板」', () => {
        const mk = mkNamer();
        const n = mk((keyName || 'key') + 'HintSymbolsStyle');
        App.edit(d => {
          const dd = d[keyName];
          if (!dd) return;
          d[n] = { size: { width: 38, height: 48 }, selectedIndex: 0, symbolStyles: [] };
          dd.hintSymbolsStyle = n;
        });
        redraw();
        // 顺手把面板底子配好，再引导去加符号
        beautifyPanel();
      }, 'btn small'));
      container.appendChild(el('div', 'hint-line',
        '加上后：手机上按住这个键不放会弹出一排符号，滑过去松手即可输入（比如按住句号弹出 ？！…）。'));
      return;
    }

    // 旧版属性名迁移提示
    if (prop === 'holdSymbolsStyle') {
      container.appendChild(el('div', 'hint-line warn',
        '⚠ 这个键用的是旧版仓输入法的属性名 holdSymbolsStyle，元书（v3）不识别。'));
      container.appendChild(button('一键改成新版名字 hintSymbolsStyle', () => {
        App.edit(d => {
          const dd = d[keyName];
          if (dd && dd.holdSymbolsStyle != null && dd.hintSymbolsStyle == null) {
            dd.hintSymbolsStyle = dd.holdSymbolsStyle;
            delete dd.holdSymbolsStyle;
          }
        });
        redraw();
        toast('已改为 hintSymbolsStyle（新版）');
      }, 'btn small'));
    }

    const refName = typeof def[prop] === 'string' ? def[prop] : null;
    const hs = refName ? doc[refName] : def[prop];
    if (!hs) { container.appendChild(el('div', 'hint-line', `样式 ${refName} 不存在`)); return; }

    container.appendChild(el('div', 'hint-line',
      '手机上：按住这个键不放 → 弹出面板 → 滑到符号上松手输入。\n符号很多时会自动换行排成网格。想在预览里看：勾选顶栏「长按预览」并选中此键。'));

    container.appendChild(field('每格宽度（官方新增 size 参数）', numInput(hs.size && hs.size.width, v => editPanel(h => { h.size = h.size || {}; if (v == null) delete h.size.width; else h.size.width = v; }), { step: 1, min: 10 })));
    container.appendChild(field('每格高度', numInput(hs.size && hs.size.height, v => editPanel(h => { h.size = h.size || {}; if (v == null) delete h.size.height; else h.size.height = v; }), { step: 1, min: 10 })));
    container.appendChild(field('默认选中第几个（0=第一个）', numInput(hs.selectedIndex, v => editPanel(h => set(h, 'selectedIndex', v)), { step: 1, min: 0 })));

    container.appendChild(button('✨ 一键美化面板（白底圆角+蓝色选中）', beautifyPanel, 'btn small'));

    const bgBox = el('div');
    container.appendChild(field('面板背景样式', bgBox));
    styleRefEditor(bgBox, doc, hs, 'backgroundStyle', { baseName: 'hintSymbolsBackground', resolveOwner: panelOf });
    const selBox = el('div');
    container.appendChild(field('选中格背景样式（滑到哪格哪格亮）', selBox));
    styleRefEditor(selBox, doc, hs, 'selectedBackgroundStyle', { baseName: 'hintSymbolsSelected', resolveOwner: panelOf });

    const listWrap = el('div', 'hs-list');
    container.appendChild(el('div', 'fld-label', '符号列表（顺序=面板里从左到右）：'));
    container.appendChild(listWrap);

    function drawList() {
      listWrap.innerHTML = '';
      const items = hs.symbolStyles || [];
      items.forEach((sn, i) => {
        const sdef = typeof sn === 'string' ? doc[sn] : sn;
        const row = el('div', 'ref-row');
        const text = sdef ? Actions.label(sdef.action) : '（缺失）';
        row.appendChild(button(`${i + 1}. ${text}`, () => {
          if (!sdef) return;
          const symOwner = typeof sn === 'string' ? (d => d[sn]) : (d => (d === doc ? sdef : null));
          const m = UI.modal(`长按符号 ${i + 1}`, '460px');
          // 快捷改内容：显示和输出一起换
          const curContent = sdef.action && typeof sdef.action === 'object'
            ? (sdef.action.symbol != null ? sdef.action.symbol : sdef.action.character) : '';
          m.body.appendChild(field('符号内容（显示和输出一起改）', textInput(curContent, v => {
            if (v == null || v === '') return;
            App.edit(d => {
              const sd = symOwner(d);
              if (!sd) return;
              if (sd.action && typeof sd.action === 'object' && 'character' in sd.action) sd.action = { character: v };
              else sd.action = { symbol: v };
              const fgNames = sd.foregroundStyle == null ? [] : (Array.isArray(sd.foregroundStyle) ? sd.foregroundStyle : [sd.foregroundStyle]);
              for (const fn2 of fgNames) {
                const fs = typeof fn2 === 'string' ? d[fn2] : fn2;
                if (fs && (fs.buttonStyleType === 'text' || fs.text != null)) fs.text = v;
              }
            });
            drawList();
          })));
          actionField(m.body, doc, sdef, 'action', '选中后输出什么（高级）', symOwner);
          const fgBox = el('div');
          m.body.appendChild(field('显示样式（前景）', fgBox));
          styleRefEditor(fgBox, doc, sdef, 'foregroundStyle', { multi: true, defaultType: 'text', baseName: (typeof sn === 'string' ? sn : 'hintSymbol') + 'Fg', resolveOwner: symOwner });
        }, 'ref-name'));
        if (i > 0) row.appendChild(button('↑', () => {
          editPanel(h => {
            const a = h.symbolStyles || [];
            if (i < 1 || i >= a.length) return;
            [a[i - 1], a[i]] = [a[i], a[i - 1]];
          });
          drawList();
          App.renderPreview();
        }, 'mini-btn'));
        row.appendChild(button('✕', () => {
          editPanel(h => { (h.symbolStyles || []).splice(i, 1); });
          drawList();
          App.renderPreview();
        }, 'mini-btn'));
        listWrap.appendChild(row);
      });
      if (!items.length) {
        listWrap.appendChild(el('div', 'hint-line warn', '面板还没有符号——空面板在手机上不会显示，点下面添加。'));
      }
      listWrap.appendChild(button('＋添加符号（可一次加一串）', openBatchAdd, 'btn small'));
    }
    drawList();

    container.appendChild(button('删除整个长按面板', () => {
      if (!confirm('确定删除这个键的长按符号面板吗？（符号样式定义保留，可撤销）')) return;
      App.edit(d => {
        const dd = d[keyName];
        if (dd) { delete dd.hintSymbolsStyle; delete dd.holdSymbolsStyle; }
      });
      redraw();
    }, 'btn small danger'));
  }

  // ============ 主入口：按键检查器 ============
  // ============ 结构定位：这个键在皮肤层级里的位置（面包屑用） ============
  const AREA_LABELS = [
    ['keyboardLayout', '按键区'],
    ['toolbarLayout', '工具栏'],
    ['horizontalCandidatesLayout', '横向候选栏'],
    ['verticalCandidatesLayout', '纵向候选栏'],
  ];
  function findCellLocation(doc, keyName) {
    for (const [area, label] of AREA_LABELS) {
      const walk = (arr, trail) => {
        if (!Array.isArray(arr)) return null;
        let rowN = 0, colN = 0;
        for (const it of arr) {
          if (!it) continue;
          if (it.Cell === keyName) return trail;
          if (it.HStack) { rowN++; const r = walk(it.HStack.subviews, [...trail, `第${rowN}行`]); if (r) return r; }
          if (it.VStack) { colN++; const r = walk(it.VStack.subviews, [...trail, `第${colN}列`]); if (r) return r; }
        }
        return null;
      };
      const r = walk(doc[area], []);
      if (r) return { area, label, trail: r };
    }
    return null;
  }

  // 面包屑：文件 ▸ 区域 ▸ 第N行 ▸ 键名（每段可点击跳到对应面板）
  function buildCrumbs(doc, keyName) {
    const crumbs = el('div', 'crumbs');
    crumbs.title = '这个键在皮肤结构里的位置（点任意一段跳到对应编辑面板）';
    const sep = () => crumbs.appendChild(el('span', 'crumb-sep', '▸'));
    const add = (text, onClick, title) => {
      const c = onClick ? button(text, onClick, 'crumb') : el('span', 'crumb static', text);
      if (title) c.title = title;
      crumbs.appendChild(c);
    };
    add('📄 ' + (Renderer.state.docName || '键盘文件'), () => App.gotoTab('files'), '所在键盘文件 → 打开「键盘」页');
    sep();
    const loc = findCellLocation(doc, keyName);
    if (loc) {
      const goLayout = () => { App.layoutArea = loc.area; App.gotoTab('layout'); };
      add(loc.label, goLayout, '所在区域 → 打开「布局树」页');
      for (const t of loc.trail) { sep(); add(t, goLayout, '所在行/列 → 打开「布局树」页'); }
      sep();
    } else {
      add('⚠ 未放进布局', () => { App.gotoTab('layout'); }, '这个键有定义但没放进任何布局，预览里不显示 → 去「布局树」把它加进某一行');
      sep();
    }
    add('🔘 ' + keyName, null);
    return crumbs;
  }

  function showKey(container, doc, keyName) {
    container.innerHTML = '';
    const def = doc[keyName];
    if (def == null) {
      container.appendChild(el('div', 'hint-line', `按键 "${keyName}" 的定义不存在。`));
      container.appendChild(button('创建定义', () => {
        App.edit(d => { d[keyName] = { action: { character: 'a' } }; });
        showKey(container, doc, keyName);
      }, 'btn small'));
      return;
    }

    container.appendChild(buildCrumbs(doc, keyName));

    const head = el('div', 'insp-head');
    head.appendChild(el('span', 'insp-title', keyName));
    const renBtn = button('重命名', () => {
      const nn = prompt('新的按键名称：', keyName);
      if (!nn || nn === keyName) return;
      if (doc[nn]) { toast('已存在同名定义', true); return; }
      App.edit(d => {
        d[nn] = d[keyName];
        delete d[keyName];
        renameCellRefs(d, keyName, nn);
      });
      App.selection = nn;
      showKey(container, doc, nn);
    }, 'mini-btn');
    head.appendChild(renBtn);
    container.appendChild(head);

    // ---- 集合视图 ----
    if (def.type) {
      showCollection(container, doc, keyName, def);
      return;
    }

    // ---- 快速配色（只影响这一个键，共享样式自动分离） ----
    const quickSec = section('快速配色（只改这一个键）', true);

    // 智能检测「自动变色」并一键取消。覆盖两条路径：
    //   ① 条件样式（backgroundStyle/foregroundStyle 里带 conditionKey）
    //   ② 事件通知——尤其是 notificationType: returnKeyType 的通知：仓输入法会「自动」
    //      把它加到回车键上（不需要按键里写 notification），这才是"可发送变蓝"的真正来源。
    const isCondRef = k => Array.isArray(def[k]) && def[k].some(x => x && typeof x === 'object' && x.conditionKey);
    const isReturnKey = def.action === 'enter';
    const returnKeyNtfNames = () => Object.keys(doc).filter(k => {
      const v = doc[k];
      return v && typeof v === 'object' && !Array.isArray(v) && v.notificationType === 'returnKeyType';
    });
    const ownNtfNames = def.notification == null ? [] : (Array.isArray(def.notification) ? def.notification : [def.notification]);
    const hasAutoColor = isCondRef('backgroundStyle') || isCondRef('foregroundStyle') ||
      (isReturnKey && returnKeyNtfNames().length > 0) ||
      ownNtfNames.some(n => typeof n === 'string' && doc[n]);
    if (hasAutoColor) {
      quickSec.body.appendChild(el('div', 'hint-line',
        '💡 这个键会「自动变色」（随场景变颜色，比如回车键在能发送时变蓝）。\n想让它固定成一种样子、彻底不再变色，点下面按钮：'));
      quickSec.body.appendChild(button('🚫 取消自动变色，固定成常规样子', () => {
        App.edit(d => {
          const dd = d[keyName]; if (!dd || typeof dd !== 'object') return;
          // ① 展平自身条件样式：选「默认状态」那一项（条件值含 0 = 平常的样子），没有就取第一项
          for (const key of ['backgroundStyle', 'foregroundStyle']) {
            const ref = dd[key];
            if (!Array.isArray(ref) || !ref.some(x => x && typeof x === 'object' && x.conditionKey)) continue;
            let pick = ref.find(x => x && Array.isArray(x.conditionValue) && x.conditionValue.map(Number).includes(0));
            if (!pick) pick = ref.find(x => x && x.styleName != null);
            if (pick && pick.styleName != null) dd[key] = Array.isArray(pick.styleName) ? pick.styleName[0] : pick.styleName;
          }
          const cloneRef = r => Array.isArray(r) ? JSON.parse(JSON.stringify(r)) : r;
          const normBg = dd.backgroundStyle, normFg = dd.foregroundStyle;
          // ② 中和会给这个键变色的事件通知：把通知里的背景/前景换成这个键的常规样式，
          //    这样即使通知被触发，看起来也和平常一模一样（不再变蓝）。
          const targets = new Set();
          for (const nn of (dd.notification == null ? [] : (Array.isArray(dd.notification) ? dd.notification : [dd.notification])))
            if (typeof nn === 'string') targets.add(nn);
          if (dd.action === 'enter') {
            for (const k in d) {
              const v = d[k];
              if (v && typeof v === 'object' && !Array.isArray(v) && v.notificationType === 'returnKeyType') targets.add(k);
            }
          }
          for (const nk of targets) {
            const ntf = d[nk];
            if (!ntf || typeof ntf !== 'object') continue;
            if (normBg != null) ntf.backgroundStyle = cloneRef(normBg);
            if (normFg != null) ntf.foregroundStyle = cloneRef(normFg);
          }
        });
        toast('已固定成常规样子，回车键"可发送变蓝"也一并取消了（记得重新导出并导入手机才生效）');
        showKey(container, doc, keyName);
      }, 'btn small'));
      quickSec.body.appendChild(el('div', 'hint-line', '取消后，下面的「按键底色/文字颜色」就能正常单独改这个键了。'));
    }
    // 回车键专用：只统一"变化时"的文字颜色（保留发送/搜索字样和背景，只把变色时的文字色改成和普通键一样）
    if (isReturnKey) {
      quickSec.body.appendChild(button('🔤 回车键变化时，文字颜色跟普通键一致（修复变色时文字色不一样）', () => {
        const n = App.unifyReturnKeyTextColorEverywhere();
        showKey(container, doc, keyName);
        toast(n ? `已把所有键盘回车键"变化时"的文字颜色统一成键盘普通文字色（改了 ${n} 处·含浅深）` : '没找到可统一的回车键文字样式', !n);
      }, 'btn small'));
      quickSec.body.appendChild(el('div', 'hint-line', '这个只改"回车键变化时（发送/搜索）"的文字颜色，让它和其它按键的文字一个颜色；发送/搜索字样和背景都保留。'));
    }

    const bgRef0 = typeof def.backgroundStyle === 'string' ? doc[def.backgroundStyle] : null;
    const isImgBg = bgRef0 && bgRef0.buttonStyleType === 'fileImage';
    if (isImgBg) {
      quickSec.body.appendChild(el('div', 'hint-line warn', '这个键的背景是图片。想改成纯色请点下面按钮（改后可撤销）：'));
      quickSec.body.appendChild(button('把这个键改成纯色背景', () => {
        App.edit(d => {
          const dd = d[keyName]; if (!dd) return;
          const st = ensureUniqueStyle(d, keyName, dd, 'backgroundStyle');
          if (!st) return;
          st.buttonStyleType = 'geometry';
          delete st.normalImage; delete st.highlightImage; delete st.contentMode;
          if (st.cornerRadius == null) st.cornerRadius = 6;
          if (!st.insets) st.insets = { top: 4, bottom: 4, left: 3, right: 3 };
          st.normalColor = '#ffffff';
        });
        showKey(container, doc, keyName);
      }, 'btn small'));
    } else {
      const curBg = bgRef0 || {};
      const firstColor = v => Array.isArray(v) ? v[0] : v;
      quickSec.body.appendChild(field('按键底色', colorInput(firstColor(curBg.normalColor), v => App.edit(d => {
        const dd = d[keyName]; if (!dd) return;
        const st = ensureUniqueStyle(d, keyName, dd, 'backgroundStyle');
        if (!st) return;
        if (v == null) delete st.normalColor; else st.normalColor = v;
      }))));
      quickSec.body.appendChild(field('按下时底色', colorInput(firstColor(curBg.highlightColor), v => App.edit(d => {
        const dd = d[keyName]; if (!dd) return;
        const st = ensureUniqueStyle(d, keyName, dd, 'backgroundStyle');
        if (!st) return;
        if (v == null) delete st.highlightColor; else st.highlightColor = v;
      }))));
    }
    // 文字颜色（text / systemImage 前景）
    const fgTextStyle = (() => {
      const names = def.foregroundStyle == null ? [] : (Array.isArray(def.foregroundStyle) ? def.foregroundStyle : [def.foregroundStyle]);
      for (const n of names) {
        if (typeof n !== 'string') continue;
        const s = doc[n];
        if (s && (s.buttonStyleType === 'text' || s.text != null || s.buttonStyleType === 'systemImage')) return s;
      }
      return null;
    })();
    if (fgTextStyle) {
      quickSec.body.appendChild(field('文字/图标颜色', colorInput(fgTextStyle.normalColor, v => App.edit(d => {
        const dd = d[keyName]; if (!dd) return;
        const sts = ensureUniqueFgStyles(d, keyName, dd, s => s.buttonStyleType === 'text' || s.text != null || s.buttonStyleType === 'systemImage');
        for (const st of sts) { if (v == null) delete st.normalColor; else st.normalColor = v; }
      }))));
      quickSec.body.appendChild(field('文字大小', numInput(fgTextStyle.fontSize, v => App.edit(d => {
        const dd = d[keyName]; if (!dd) return;
        const sts = ensureUniqueFgStyles(d, keyName, dd, s => s.buttonStyleType === 'text' || s.text != null);
        for (const st of sts) { if (v == null) delete st.fontSize; else st.fontSize = v; }
      }), { step: 0.5, min: 6 })));
    }
    quickSec.body.appendChild(el('div', 'hint-line', '如果这个样式原本被多个键共用，这里改动时会自动为本键复制一份独立样式，其他键不受影响。'));
    container.appendChild(quickSec.root);

    // 明暗同步安全：所有修改按“按键名字”落到浅色/深色两份文件
    const keyOwner = d => d[keyName];
    const editKey = mut => App.edit(d => {
      const dd = d[keyName];
      if (dd && typeof dd === 'object') mut(dd);
    });

    // ---- 尺寸 ----
    const sizeSec = section('尺寸与位置', true);
    sizeSec.body.appendChild(field('宽度（自动=和同行按键平分）', dimInput(def.size && def.size.width, v => editKey(dd => {
      dd.size = dd.size || {};
      if (v == null) delete dd.size.width; else dd.size.width = v;
      if (!Object.keys(dd.size).length) delete dd.size;
    }))));
    sizeSec.body.appendChild(field('高度（自动=和同列按键平分）', dimInput(def.size && def.size.height, v => editKey(dd => {
      dd.size = dd.size || {};
      if (v == null) delete dd.size.height; else dd.size.height = v;
      if (!Object.keys(dd.size).length) delete dd.size;
    }))));
    sizeSec.body.appendChild(field('内容中心 center（0~1，挪动文字/图标位置，0.5,0.5=正中）', pointInput(def.center ? { ...def.center } : null, v => editKey(dd => set(dd, 'center', v)), { step: 0.01, defaultVal: 0.5, min: 0, max: 1 })));
    const boundsSec = section('可视区域 bounds（高级：让按键的"可见部分"小于点击区域）', false);
    const b = def.bounds || {};
    boundsSec.body.appendChild(field('对齐', selectInput(b.alignment || '', [['', '（居中·默认）'], ['center', '正中 center'], ['centerTop', '上中'], ['centerBottom', '下中'], ['left', '左'], ['right', '右'], ['leftTop', '左上'], ['leftBottom', '左下'], ['rightTop', '右上'], ['rightBottom', '右下']], v => editKey(dd => { dd.bounds = dd.bounds || {}; if (v) dd.bounds.alignment = v; else delete dd.bounds.alignment; if (!Object.keys(dd.bounds).length) delete dd.bounds; }))));
    boundsSec.body.appendChild(field('宽', dimInput(b.width, v => editKey(dd => { dd.bounds = dd.bounds || {}; if (v == null) delete dd.bounds.width; else dd.bounds.width = v; if (!Object.keys(dd.bounds).length) delete dd.bounds; }))));
    boundsSec.body.appendChild(field('高', dimInput(b.height, v => editKey(dd => { dd.bounds = dd.bounds || {}; if (v == null) delete dd.bounds.height; else dd.bounds.height = v; if (!Object.keys(dd.bounds).length) delete dd.bounds; }))));
    sizeSec.body.appendChild(boundsSec.root);
    container.appendChild(sizeSec.root);

    // ---- 动作 ----
    const actSec = section('按键动作（点一下 / 滑动做什么）', true);
    actionField(actSec.body, doc, def, 'action', '点击动作', keyOwner);
    actionField(actSec.body, doc, def, 'swipeUpAction', '上滑动作（手指按住往上划）', keyOwner);
    actionField(actSec.body, doc, def, 'swipeDownAction', '下滑动作（手指按住往下划）', keyOwner);
    actionField(actSec.body, doc, def, 'swipeLeftAction', '左滑动作（部分版本支持）', keyOwner);
    actionField(actSec.body, doc, def, 'swipeRightAction', '右滑动作（部分版本支持）', keyOwner);
    const advAct = section('更多动作（长按重复 / 状态动作）', false);
    actionField(advAct.body, doc, def, 'repeatAction', '长按重复动作（按住不放连续触发，删除键常用）', keyOwner);
    actionField(advAct.body, doc, def, 'preeditStateAction', '打拼音时点击（有预编辑文字时改做什么）', keyOwner);
    actionField(advAct.body, doc, def, 'uppercasedStateAction', '大写状态下点击', keyOwner);
    actSec.body.appendChild(advAct.root);
    container.appendChild(actSec.root);

    // ---- 样式 ----
    const stSec = section('外观样式', true);
    const bgBox = el('div');
    stSec.body.appendChild(field('背景样式（按键的底色/底图）', bgBox));
    styleRefEditor(bgBox, doc, def, 'backgroundStyle', { baseName: keyName + 'Background', resolveOwner: keyOwner });
    const fgBox = el('div');
    stSec.body.appendChild(field('前景样式（键面上的文字/图标，可叠多层）', fgBox));
    styleRefEditor(fgBox, doc, def, 'foregroundStyle', { multi: true, defaultType: 'text', baseName: keyName + 'Foreground', resolveOwner: keyOwner });
    const upSec = section('大写 / 大写锁定状态前景（按 Shift 后键面显示什么）', false);
    const upBox = el('div');
    upSec.body.appendChild(field('大写状态前景', upBox));
    styleRefEditor(upBox, doc, def, 'uppercasedStateForegroundStyle', { multi: true, defaultType: 'text', baseName: keyName + 'Uppercased', resolveOwner: keyOwner });
    const capsBox = el('div');
    upSec.body.appendChild(field('大写锁定前景（双击 Shift 锁定后）', capsBox));
    styleRefEditor(capsBox, doc, def, 'capsLockedStateForegroundStyle', { multi: true, defaultType: 'text', baseName: keyName + 'CapsLocked', resolveOwner: keyOwner });
    stSec.body.appendChild(upSec.root);
    container.appendChild(stSec.root);

    // ---- 气泡 ----
    const hintSec = section('按压气泡 / 长按符号', false);
    const hintBox = el('div');
    hintSec.body.appendChild(field('按压气泡样式 hintStyle', hintBox));
    hintStyleEditor(hintBox, doc, def);
    hintSec.body.appendChild(el('div', 'fld-label', '长按符号面板 hintSymbolsStyle：'));
    const hsBox = el('div');
    hintSec.body.appendChild(hsBox);
    hintSymbolsEditor(hsBox, doc, def);
    container.appendChild(hintSec.root);

    // ---- 按键动画 / 按键特效 ----
    const aniSec = section('按键动画 / 按键特效（这个键按下时）', false);
    const aniBox = el('div');
    aniSec.body.appendChild(el('div', 'hint-line', '按键动画=按下缩放/回弹；按键特效=按下弹出图片。下面加哪种都行。'));
    aniSec.body.appendChild(aniBox);
    animationEditor(aniBox, doc, def);
    container.appendChild(aniSec.root);

    // ---- 通知 ----
    const ntfSec = section('事件通知（智能变色/变功能）', false);
    const ntfBox = el('div');
    ntfSec.body.appendChild(ntfBox);
    notificationEditor(ntfBox, doc, def);
    container.appendChild(ntfSec.root);

    // ---- 布局操作 ----
    const layoutSec = section('布局操作', false);
    layoutSec.body.appendChild(button('复制这个键（新名称）', () => {
      const nn = prompt('新按键名称：', keyName + 'Copy');
      if (!nn) return;
      if (doc[nn]) { toast('已存在同名定义', true); return; }
      App.edit(d => { d[nn] = JSON.parse(JSON.stringify(d[keyName] || def)); });
      toast(`已创建 ${nn}，在布局树中把它放到想要的位置`);
    }, 'btn small'));
    layoutSec.body.appendChild(button('从布局中移除此键的所有位置', () => {
      if (!confirm(`确定把 ${keyName} 从布局中移除吗？（定义保留，可再加回）`)) return;
      App.edit(d => { removeCellRefs(d, keyName); });
    }, 'btn small danger'));
    container.appendChild(layoutSec.root);

    // ---- 原始 YAML ----
    const rawSec = section('此按键的 YAML 源码', false);
    const ta = el('textarea', 'raw-ta');
    ta.rows = 10;
    ta.value = SkinModel.yamlDump({ [keyName]: def });
    ta.onchange = () => {
      try {
        const obj = jsyaml.load(ta.value);
        const nd = obj && obj[keyName] != null ? obj[keyName] : obj;
        App.edit(d => { d[keyName] = nd; });
        ta.classList.remove('err');
        showKey(container, doc, keyName);
      } catch (e) { ta.classList.add('err'); toast('YAML 有误：' + e.message, true); }
    };
    rawSec.body.appendChild(ta);
    container.appendChild(rawSec.root);
  }

  function hintStyleEditor(container, doc, def) {
    container.innerHTML = '';
    const keyName = App.selection;
    if (!def.hintStyle) {
      container.appendChild(button('＋添加按压气泡', () => {
        const base = (keyName || 'key') + 'HintStyle';
        // 浅色/深色都不能重名
        const taken = nm => (SkinModel.model.docs.light[Renderer.state.docName] || {})[nm] != null
          || (SkinModel.model.docs.dark[Renderer.state.docName] || {})[nm] != null;
        let n = base, i = 2;
        while (taken(n)) n = base + i++;
        // 气泡样式定义 + 按键的 hintStyle 引用都写进两个模式（明暗同步）
        App.edit(d => { d[n] = d[n] || {}; if (d[keyName]) d[keyName].hintStyle = n; });
        hintStyleEditor(container, doc, def);
      }, 'btn small'));
      return;
    }
    const refName = typeof def.hintStyle === 'string' ? def.hintStyle : null;
    const hs = refName ? doc[refName] : def.hintStyle;
    if (!hs) { container.appendChild(el('div', 'hint-line', `样式 ${refName} 不存在`)); return; }
    // 在任一模式文档里定位同一个气泡样式对象——用于明暗同步改
    const resolveHs = d => {
      const dd = d[keyName]; if (!dd) return null;
      const ref = dd.hintStyle;
      return typeof ref === 'string' ? d[ref] : ref;
    };
    const bgBox = el('div');
    container.appendChild(field('气泡背景', bgBox));
    styleRefEditor(bgBox, doc, hs, 'backgroundStyle', { baseName: 'hintBackground', resolveOwner: resolveHs });
    const fgBox = el('div');
    container.appendChild(field('气泡前景', fgBox));
    styleRefEditor(fgBox, doc, hs, 'foregroundStyle', { multi: true, defaultType: 'text', baseName: 'hintForeground', resolveOwner: resolveHs });
    container.appendChild(field('关闭溢出检测', checkbox(hs.checkIfOverflowsParentHeight === false, v => App.edit(d => {
      const h = resolveHs(d); if (!h) return;
      if (v) h.checkIfOverflowsParentHeight = false; else delete h.checkIfOverflowsParentHeight;
    }), '气泡使用上半透明图片时建议勾选（浅色/深色会一起改）')));
    container.appendChild(button('移除气泡', () => {
      App.edit(d => { if (d[keyName]) delete d[keyName].hintStyle; });
      hintStyleEditor(container, doc, def);
    }, 'btn small danger'));
  }

  // ============ 集合视图检查器 ============
  const COLLECTION_TYPES = [
    ['symbols', '竖排符号列表'],
    ['t9Symbols', '九键·竖排符号列表'],
    ['t9HorizontalSymbols', '九键·横排拼音列表'],
    ['numericSymbols', '数字键盘·符号列表'],
    ['horizontalSymbols', '横排符号列表'],
    ['classifiedSymbols', '符号分类·一级（常用/中文…）'],
    ['subClassifiedSymbols', '符号分类·二级（具体符号）'],
    ['categorySymbols', '内置分类符号'],
    ['horizontalCandidates', '横排候选字'],
    ['verticalCandidates', '竖排候选字'],
  ];

  function showCollection(container, doc, keyName, def) {
    container.appendChild(el('div', 'hint-line', '这是一个「集合视图」（符号列表 / 候选栏等）'));
    container.appendChild(field('类型', selectInput(def.type, COLLECTION_TYPES, v => { App.edit(() => { def.type = v; }); showKeyRefresh(container, doc, keyName); })));

    const sizeSec = section('尺寸', true);
    sizeSec.body.appendChild(field('宽度', dimInput(def.size && def.size.width, v => App.edit(() => { def.size = def.size || {}; if (v == null) delete def.size.width; else def.size.width = v; }))));
    sizeSec.body.appendChild(field('高度', dimInput(def.size && def.size.height, v => App.edit(() => { def.size = def.size || {}; if (v == null) delete def.size.height; else def.size.height = v; }))));
    sizeSec.body.appendChild(field('内边距', insetsInput(def.insets, v => App.edit(() => set(def, 'insets', v)))));
    container.appendChild(sizeSec.root);

    const stSec = section('样式', true);
    const bgBox = el('div');
    stSec.body.appendChild(field('背景样式', bgBox));
    styleRefEditor(bgBox, doc, def, 'backgroundStyle', { baseName: keyName + 'Background' });

    if (def.type === 'horizontalCandidates' || def.type === 'verticalCandidates') {
      const csName = typeof def.candidateStyle === 'string' ? def.candidateStyle : null;
      const cs = csName ? doc[csName] : def.candidateStyle;
      if (cs) {
        const candSec = section('候选字样式', true);
        const fields = [
          ['preferredTextColor', '首选字颜色'], ['preferredIndexColor', '首选序号颜色'], ['preferredCommentColor', '首选注释颜色'],
          ['preferredBackgroundColor', '首选背景色'], ['textColor', '其他候选字颜色'], ['indexColor', '其他序号颜色'],
          ['commentColor', '其他注释颜色'], ['highlightBackgroundColor', '按下背景色'],
        ];
        for (const [k, lab] of fields) {
          candSec.body.appendChild(field(lab, colorInput(cs[k], v => App.edit(() => set(cs, k, v)))));
        }
        for (const [k, lab] of [['textFontSize', '候选字字号'], ['indexFontSize', '序号字号'], ['commentFontSize', '注释字号']]) {
          candSec.body.appendChild(field(lab, numInput(cs[k], v => App.edit(() => set(cs, k, v)), { step: 0.5, min: 1 })));
        }
        candSec.body.appendChild(field('候选字内边距', insetsInput(cs.insets, v => App.edit(() => set(cs, 'insets', v)))));
        stSec.body.appendChild(candSec.root);
      }
      if (def.type === 'verticalCandidates') {
        stSec.body.appendChild(field('最大行数', numInput(def.maxRows, v => App.edit(() => set(def, 'maxRows', v)), { step: 1, min: 1 })));
        stSec.body.appendChild(field('分割线颜色', colorInput(def.separatorColor, v => App.edit(() => set(def, 'separatorColor', v)))));
      }
    } else {
      // cellStyle
      const cellName = typeof def.cellStyle === 'string' ? def.cellStyle : null;
      const cell = cellName ? doc[cellName] : def.cellStyle;
      if (cell) {
        const cellSec = section('单元格样式 cellStyle', true);
        cellSec.body.appendChild(field('单元格内边距', insetsInput(cell.insets, v => App.edit(() => set(cell, 'insets', v)))));
        const cbg = el('div');
        cellSec.body.appendChild(field('单元格背景', cbg));
        styleRefEditor(cbg, doc, cell, 'backgroundStyle', { baseName: (cellName || 'cell') + 'Background' });
        const cfg2 = el('div');
        cellSec.body.appendChild(field('单元格文字样式', cfg2));
        styleRefEditor(cfg2, doc, cell, 'foregroundStyle', { defaultType: 'text', baseName: (cellName || 'cell') + 'Foreground' });
        stSec.body.appendChild(cellSec.root);
      }
      // 数据源
      if (def.type !== 'subClassifiedSymbols' && def.type !== 'categorySymbols' && def.type !== 'numericSymbols' && def.type !== 't9Symbols' && def.type !== 't9HorizontalSymbols') {
        const dsSec = section('数据源（每行一项）', true);
        const dsName = typeof def.dataSource === 'string' ? def.dataSource : null;
        const ds = dsName ? doc[dsName] : def.dataSource;
        const ta = el('textarea'); ta.rows = 8;
        if (Array.isArray(ds)) {
          ta.value = ds.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join('\n');
        }
        ta.onchange = () => {
          const arr = ta.value.split('\n').map(s => s.trim()).filter(Boolean).map(s => {
            if (s.startsWith('{')) { try { return JSON.parse(s); } catch (_) { return s; } }
            return s;
          });
          App.edit(d => {
            if (dsName) d[dsName] = arr;
            else def.dataSource = arr;
          });
        };
        dsSec.body.appendChild(ta);
        dsSec.body.appendChild(el('div', 'hint-line', '普通符号直接写一行一个；高级用法可写 JSON：{"label":"显示","value":"输出"} 或 {"label":"1","action":"tab"}'));
        container.appendChild(dsSec.root);
      } else if (def.type === 't9Symbols' || def.type === 'numericSymbols') {
        container.appendChild(el('div', 'hint-line', '这个列表的数据在 App 的「键盘设置」里配置，皮肤内只定样式。'));
      }
      if (def.type === 'horizontalSymbols' || def.type === 't9HorizontalSymbols') {
        stSec.body.appendChild(field('最大列数', numInput(def.maxColumns != null ? def.maxColumns : def.maxColums, v => App.edit(() => { delete def.maxColums; set(def, 'maxColumns', v); }), { step: 1, min: 1 })));
        stSec.body.appendChild(field('从右往左', checkbox(def.contentRightToLeft, v => App.edit(() => { if (v) def.contentRightToLeft = true; else delete def.contentRightToLeft; }), '')));
      }
      if (def.type === 'subClassifiedSymbols') {
        stSec.body.appendChild(field('最大行数', numInput(def.maximumRow, v => App.edit(() => set(def, 'maximumRow', v)), { step: 1, min: 1 })));
        stSec.body.appendChild(field('最大列数', numInput(def.maximumColumn, v => App.edit(() => set(def, 'maximumColumn', v)), { step: 1, min: 1 })));
        stSec.body.appendChild(field('显示分割线', checkbox(def.displaySeparatorLine !== false, v => App.edit(() => { if (v) delete def.displaySeparatorLine; else def.displaySeparatorLine = false; }), '')));
        stSec.body.appendChild(field('分割线颜色', colorInput(def.separatorLineColor, v => App.edit(() => set(def, 'separatorLineColor', v)))));
      }
    }
    container.appendChild(stSec.root);

    // 原始 YAML
    const rawSec = section('YAML 源码', false);
    const ta2 = el('textarea', 'raw-ta'); ta2.rows = 8;
    ta2.value = SkinModel.yamlDump({ [keyName]: def });
    ta2.onchange = () => {
      try {
        const obj = jsyaml.load(ta2.value);
        App.edit(d => { d[keyName] = obj && obj[keyName] != null ? obj[keyName] : obj; });
        ta2.classList.remove('err');
      } catch (e) { ta2.classList.add('err'); }
    };
    rawSec.body.appendChild(ta2);
    container.appendChild(rawSec.root);
  }

  function showKeyRefresh(container, doc, keyName) {
    showKey(container, doc, keyName);
  }

  // 布局中 Cell 引用改名 / 删除
  function renameCellRefs(doc, oldName, newName) {
    const walk = arr => {
      if (!Array.isArray(arr)) return;
      for (const item of arr) {
        if (item && item.Cell === oldName) item.Cell = newName;
        if (item && item.HStack) walk(item.HStack.subviews);
        if (item && item.VStack) walk(item.VStack.subviews);
      }
    };
    for (const k of ['keyboardLayout', 'toolbarLayout', 'horizontalCandidatesLayout', 'verticalCandidatesLayout']) walk(doc[k]);
  }
  function removeCellRefs(doc, name) {
    const walk = arr => {
      if (!Array.isArray(arr)) return;
      for (let i = arr.length - 1; i >= 0; i--) {
        const item = arr[i];
        if (item && item.Cell === name) arr.splice(i, 1);
        else if (item && item.HStack) walk(item.HStack.subviews);
        else if (item && item.VStack) walk(item.VStack.subviews);
      }
    };
    for (const k of ['keyboardLayout', 'toolbarLayout', 'horizontalCandidatesLayout', 'verticalCandidatesLayout']) walk(doc[k]);
  }

  return { showKey, buildStyleEditor, styleRefEditor, openStyleModal, actionField, renameCellRefs, removeCellRefs,
           ensureUniqueStyle, ensureUniqueFgStyles, refCount,
           ANIM_PRESETS, openAnimPresetPicker, ensurePresetAnim };
})();

</script>
<script>
/* =========================================================
 * panels.js — 左侧面板：键盘文件 / 全局样式 / 布局树 /
 *             皮肤信息(config) / 校验 / 源码
 * ========================================================= */
'use strict';

const Panels = (() => {
  const { el, field, section, textInput, numInput, selectInput, checkbox, colorInput, dimInput, insetsInput, button, toast } = UI;
  const M = () => SkinModel.model;

  // 键盘模板选择（26键 / 九键 / 数字）
  function pickKeyboardTemplate(cb) {
    const m = UI.modal('选择键盘模板', '420px');
    const opts = [
      ['t26', '26 键全键盘', '标准 QWERTY 布局'],
      ['t9', '中文九键（T9）', '3×3 九宫格 + 左侧符号栏（手机需启用九键输入方案）'],
      ['numeric', '数字键盘', '拨号盘式 123 布局'],
    ];
    for (const [k, lab, desc] of opts) {
      const b = UI.button('', () => { m.close(); cb(k); }, 'pick-item');
      b.innerHTML = `<b>${lab}</b><br><span style="opacity:.65;font-size:12px">${desc}</span>`;
      m.body.appendChild(b);
    }
  }

  function createKeyboardFromTemplate(name, kind) {
    SkinModel.addKeyboardDoc('light', name, SkinTemplate.newKeyboardByKind(kind, false));
    SkinModel.addKeyboardDoc('dark', name, SkinTemplate.newKeyboardByKind(kind, true));
    if (kind === 't9') toast('九键键盘已创建！注意：手机上需启用「中文九键」输入方案才能打字');
  }

  // ============ 键盘文件面板 ============
  function buildFilesPanel(container) {
    container.innerHTML = '';
    const mode = Renderer.state.mode;
    const docNames = Object.keys(M().docs[mode]).sort();

    // config 里键盘类型的映射反查：文件名 -> [用途]
    const usage = {};
    const cfg = M().config || {};
    for (const kType in cfg) {
      const v = cfg[kType];
      if (!v || typeof v !== 'object' || !('iPhone' in v || 'iPad' in v)) continue;
      for (const dev of ['iPhone', 'iPad']) {
        for (const ori in (v[dev] || {})) {
          const f = v[dev][ori];
          usage[f] = usage[f] || [];
          usage[f].push(`${kType}·${dev}·${ori === 'portrait' ? '竖' : ori === 'landscape' ? '横' : '悬浮'}`);
        }
      }
    }

    container.appendChild(el('div', 'panel-hint', `当前编辑：${mode === 'light' ? '浅色' : '深色'}模式（顶部可切换）`));

    for (const name of docNames) {
      const row = el('div', 'file-row' + (Renderer.state.docName === name ? ' active' : ''));
      const btn = button(name, () => {
        Renderer.state.docName = name;
        App.selection = null;
        App.renderAll();
      }, 'file-name');
      row.appendChild(btn);
      const u = usage[name];
      if (u) row.appendChild(el('div', 'file-usage', u.slice(0, 3).join(' ')));
      const menu = button('⋯', () => {
        const m = UI.modal(`键盘文件：${name}`, '420px');
        m.body.appendChild(button('重命名（自动更新 config 引用）', () => {
          const nn = prompt('新文件名（不含 .yaml）：', name);
          if (!nn || nn === name) return;
          SkinModel.renameKeyboardDoc(name, nn);
          if (Renderer.state.docName === name) Renderer.state.docName = nn;
          m.close(); App.commit(); buildFilesPanel(container);
        }, 'pick-item'));
        m.body.appendChild(button('复制为新键盘…', () => {
          const nn = prompt('新文件名：', name + '_copy');
          if (!nn) return;
          for (const md of ['light', 'dark']) {
            if (M().docs[md][name]) SkinModel.addKeyboardDoc(md, nn, JSON.parse(JSON.stringify(M().docs[md][name])));
          }
          m.close(); App.commit(); buildFilesPanel(container);
        }, 'pick-item'));
        m.body.appendChild(button('把浅色版复制到深色', () => {
          if (!M().docs.light[name]) { toast('浅色版不存在', true); return; }
          SkinModel.addKeyboardDoc('dark', name, JSON.parse(JSON.stringify(M().docs.light[name])));
          m.close(); App.commit(); toast('已复制到深色模式');
        }, 'pick-item'));
        m.body.appendChild(button('把深色版复制到浅色', () => {
          if (!M().docs.dark[name]) { toast('深色版不存在', true); return; }
          SkinModel.addKeyboardDoc('light', name, JSON.parse(JSON.stringify(M().docs.dark[name])));
          m.close(); App.commit(); toast('已复制到浅色模式');
        }, 'pick-item'));
        m.body.appendChild(button('删除此键盘文件', () => {
          if (!confirm(`确定删除 ${name}（浅色+深色）吗？`)) return;
          SkinModel.removeKeyboardDoc('light', name);
          SkinModel.removeKeyboardDoc('dark', name);
          if (Renderer.state.docName === name) Renderer.state.docName = Object.keys(M().docs[mode])[0] || null;
          m.close(); App.commit(); buildFilesPanel(container);
        }, 'pick-item danger'));
      }, 'mini-btn');
      row.appendChild(menu);
      container.appendChild(row);
    }

    container.appendChild(button('＋ 新建键盘文件', () => {
      const nn = prompt('键盘文件名（如 mykeyboard）：', '');
      if (!nn) return;
      pickKeyboardTemplate(kind => {
        createKeyboardFromTemplate(nn, kind);
        Renderer.state.docName = nn;
        App.commit(); buildFilesPanel(container);
      });
    }, 'btn'));

    // ---- config 键盘映射 ----
    const mapSec = section('键盘用途分配（config.yaml）', false);
    buildConfigMapping(mapSec.body);
    container.appendChild(mapSec.root);
  }

  const KEYBOARD_KINDS = [
    ['pinyin', '中文键盘 pinyin（必须）'],
    ['alphabetic', '英文键盘 alphabetic'],
    ['numeric', '数字键盘 numeric'],
    ['symbolic', '符号键盘 symbolic'],
    ['emoji', 'Emoji 键盘 emoji'],
  ];

  function buildConfigMapping(body) {
    body.innerHTML = '';
    const cfg = M().config = M().config || {};
    const mode = Renderer.state.mode;
    const docNames = [...new Set([...Object.keys(M().docs.light), ...Object.keys(M().docs.dark)])].sort();
    const options = [['', '（不提供）'], ...docNames.map(n => [n, n])];

    const kinds = new Map(KEYBOARD_KINDS);
    // 自定义键盘类型（config 中已有但不在预设内的）
    for (const k in cfg) {
      const v = cfg[k];
      if (v && typeof v === 'object' && ('iPhone' in v || 'iPad' in v) && !kinds.has(k)) kinds.set(k, `自定义键盘 ${k}`);
    }

    const optionsWithNew = [...options, ['__new__', '＋ 新建一个键盘文件…']];
    for (const [kind, lab] of kinds) {
      const sec = section(lab, kind === 'pinyin');
      const slots = [
        ['iPhone', 'portrait', 'iPhone 竖屏'], ['iPhone', 'landscape', 'iPhone 横屏'],
        ['iPad', 'portrait', 'iPad 竖屏'], ['iPad', 'landscape', 'iPad 横屏'], ['iPad', 'floating', 'iPad 悬浮'],
      ];
      for (const [dev, ori, slab] of slots) {
        const cur = cfg[kind] && cfg[kind][dev] ? cfg[kind][dev][ori] : '';
        const assign = v => App.edit(null, () => {
          if (v) {
            cfg[kind] = cfg[kind] || {};
            cfg[kind][dev] = cfg[kind][dev] || {};
            cfg[kind][dev][ori] = v;
          } else if (cfg[kind] && cfg[kind][dev]) {
            delete cfg[kind][dev][ori];
            if (!Object.keys(cfg[kind][dev]).length) delete cfg[kind][dev];
            if (!Object.keys(cfg[kind]).filter(x => x === 'iPhone' || x === 'iPad').length) delete cfg[kind];
          }
          M().configDirty = true;
        });
        // 该键盘文件缺失时给出醒目提示
        const missing = cur && !M().docs.light[cur] && !M().docs.dark[cur];
        const selEl = selectInput(cur || '', optionsWithNew, v => {
          if (v === '__new__') {
            const suggested = `${kind}_${dev === 'iPad' ? 'ipad_' : ''}${ori}`;
            const nn = prompt('新键盘文件名：', suggested);
            if (!nn) { buildConfigMapping(body); return; }
            pickKeyboardTemplate(tmplKind => {
              createKeyboardFromTemplate(nn, tmplKind);
              assign(nn);
              Renderer.state.docName = nn;
              App.renderAll();
              toast(`已创建 ${nn} 并分配到 ${lab}·${slab}，可以开始编辑了`);
              buildConfigMapping(body);
            });
            return;
          }
          assign(v);
        });
        const f = field(slab + (missing ? '（引用的文件不存在！）' : ''), selEl);
        if (missing) f.querySelector('.fld-label').style.color = 'var(--danger)';
        sec.body.appendChild(f);
      }
      body.appendChild(sec.root);
    }
    body.appendChild(button('＋ 添加自定义键盘类型', () => {
      const n = prompt('自定义键盘类型名称（按键动作 keyboardType 用这个名字切换过来）：');
      if (!n) return;
      cfg[n] = { iPhone: {} };
      M().configDirty = true;
      App.commit();
      buildConfigMapping(body);
    }, 'btn small'));
  }

  // ============ 全局样式面板 ============
  // 按键特效自定义窗口：调大小/速度/位置/层级后再应用
  function openEffectCustomizer(fx, scope) {
    const d0 = JSON.parse(JSON.stringify(fx.def));
    const isCartoon = d0.animationType === 'cartoon';
    const cd = {
      targetScale: d0.targetScale != null ? d0.targetScale : 1,
      zPosition: d0.zPosition || 'below',
      cx: (d0.center && d0.center.x != null) ? d0.center.x : 0.5,
      cy: (d0.center && d0.center.y != null) ? d0.center.y : 0.5,
      fps: d0.fps != null ? d0.fps : 24,
      duration: d0.duration != null ? d0.duration : 700,
    };
    const m = UI.modal('🎛 自定义特效：' + fx.name, '440px');
    const mkSlider = (label, min, max, step, get, set) => {
      const wrap = el('div', 'slider-row');
      const rng = el('input'); rng.type = 'range'; rng.min = min; rng.max = max; rng.step = step; rng.value = get();
      const num = el('input'); num.type = 'number'; num.min = min; num.max = max; num.step = step; num.value = get(); num.className = 'slider-num';
      rng.oninput = () => { num.value = rng.value; set(parseFloat(rng.value)); };
      num.oninput = () => { rng.value = num.value; set(parseFloat(num.value)); };
      wrap.appendChild(rng); wrap.appendChild(num);
      return field(label, wrap);
    };
    m.body.appendChild(el('div', 'hint-line', `${fx.desc} · ${fx.frames.length}帧。拖滑块调好再点应用（改完导出后运行 main.jsonnet 生效）：`));
    m.body.appendChild(mkSlider('大小（特效整体缩放，1=原始）', 0.1, 2, 0.05, () => cd.targetScale, v => cd.targetScale = v));
    if (isCartoon) m.body.appendChild(mkSlider('播放速度 fps（越大越快）', 5, 60, 1, () => cd.fps, v => cd.fps = v));
    else m.body.appendChild(mkSlider('时长（毫秒·越大越慢）', 200, 2000, 50, () => cd.duration, v => cd.duration = v));
    m.body.appendChild(mkSlider('左右位置（0左·0.5中·1右）', 0, 1, 0.05, () => cd.cx, v => cd.cx = v));
    m.body.appendChild(mkSlider('上下位置（0上·0.5中·1下）', 0, 1, 0.05, () => cd.cy, v => cd.cy = v));
    m.body.appendChild(field('层级', selectInput(cd.zPosition, [['below', '在按键下方（被键盖住一部分）'], ['above', '在按键上方（盖在键上）']], v => cd.zPosition = v)));
    const scopeOpts = [['all', '所有键盘全部按键'], ['current', '当前键盘全部按键']];
    if (App.selection) scopeOpts.push(['key', '仅当前选中的键']);
    let dScope = scope && scopeOpts.some(o => o[0] === scope) ? scope : 'all';
    m.body.appendChild(field('作用范围', selectInput(dScope, scopeOpts, v => dScope = v)));
    const applyBtn = button('✅ 应用这个特效', async () => {
      const def = JSON.parse(JSON.stringify(d0));
      def.targetScale = cd.targetScale;
      def.zPosition = cd.zPosition;
      def.center = { x: cd.cx, y: cd.cy };
      if (isCartoon) def.fps = cd.fps; else def.duration = cd.duration;
      applyBtn.disabled = true; applyBtn.textContent = '处理中…';
      try {
        const r = await App.applyEffectPreset(fx, dScope, def);
        m.close();
        UI.toast(`已应用自定义特效「${fx.name}」到 ${r.keys} 个按键✓`);
        const cur = App.currentDoc();
        const first = cur ? Object.keys(cur).filter(k => cur[k] && cur[k].action)[0] : null;
        if (first) { App.selection = first; setTimeout(() => App.testAnimation(first), 150); }
      } catch (e) { UI.toast('应用失败：' + e.message, true); applyBtn.disabled = false; applyBtn.textContent = '✅ 应用这个特效'; }
    }, 'btn primary');
    applyBtn.style.cssText = 'margin-top:10px;';
    m.body.appendChild(applyBtn);
  }

  // 导入自定义特效：选多张 PNG（按名排序）→ 生成 cartoon/physics 特效 → 打开自定义窗口调参应用
  function fileToDataURI(file) {
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('读图失败')); r.readAsDataURL(file); });
  }
  function importCustomEffect(type) {
    const up = el('input'); up.type = 'file'; up.accept = 'image/png,.png'; up.multiple = true; up.style.display = 'none';
    document.body.appendChild(up);
    up.onchange = async () => {
      const files = [...up.files].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
      up.remove();
      if (!files.length) return;
      const id = 'custom' + Date.now();
      const frames = [];
      try { for (let i = 0; i < files.length; i++) frames.push({ name: `fx_${id}_${i + 1}.png`, dataURI: await fileToDataURI(files[i]) }); }
      catch (e) { UI.toast('导入失败：' + e.message, true); return; }
      const def = type === 'physics'
        ? { animationType: 'physics', duration: 700, targetScale: 0.4, randomImage: frames.length > 1, startPosition: { x: 0, y: 30 }, endPosition: { x: -5, y: -10 }, randomPosition: { x: 50, y: 15 }, useRotation: true, startAngle: 0, endAngle: 6.25, randomAngle: 2 }
        : { animationType: 'cartoon', fps: 24, zPosition: 'below', center: { y: 0.5 } };
      def.images = frames.map(f => f.name);
      const fx = { id, name: '自导入特效', from: '自定义', desc: (type === 'physics' ? '自导入物理飞溅' : '自导入帧动画') + `·${frames.length}张图`, def, frames };
      openEffectCustomizer(fx, App.selection ? 'key' : 'all');
    };
    up.click();
  }

  function buildGlobalPanel(container) {
    container.innerHTML = '';
    const doc = App.currentDoc();
    if (!doc) { container.appendChild(el('div', 'panel-hint', '先在「键盘」页选择一个键盘文件')); return; }

    // 全局区域样式（preeditStyle/toolbarStyle/候选栏等）按名字改，浅色/深色一起同步，
    // 避免「改了当前模式、另一模式没变，手机上看着没动」。
    const editRegion = (key, mut) => App.edit(d => { const r = d[key] = d[key] || {}; mut(r); });
    const regionOwner = key => (d => (d[key] = d[key] || {}));
    // 编辑某区域引用的前景/文字样式（按引用名在两个模式各自定位再改）
    const editRegionFg = (key, mut) => App.edit(d => {
      const region = d[key]; if (!region) return;
      const ref = region.foregroundStyle;
      const f = typeof ref === 'string' ? d[ref] : ref;
      if (f && typeof f === 'object') mut(f);
    });

    // 高度
    const hSec = section('三区高度', true);
    const heightInput = (key, lab) => {
      const wrap = el('div', 'dim-inp');
      const num = el('input'); num.type = 'text';
      num.value = doc[key] == null ? '' : String(doc[key]);
      num.placeholder = '如 220 或 30vh';
      num.onchange = () => App.edit(d => {
        const v = num.value.trim();
        if (v === '') delete d[key];
        else if (/^-?\d+(\.\d+)?$/.test(v)) d[key] = Number(v);
        else d[key] = v;
      });
      wrap.appendChild(num);
      return field(lab, wrap, key);
    };
    hSec.body.appendChild(heightInput('preeditHeight', '预编辑区高度'));
    hSec.body.appendChild(heightInput('toolbarHeight', '工具栏高度'));
    hSec.body.appendChild(heightInput('keyboardHeight', '按键区高度'));
    container.appendChild(hSec.root);

    // 键盘区
    const kSec = section('按键区 keyboardStyle', true);
    const ks = doc.keyboardStyle = doc.keyboardStyle || {};
    kSec.body.appendChild(field('内边距', insetsInput(ks.insets, v => editRegion('keyboardStyle', t => { if (v) t.insets = v; else delete t.insets; }))));
    const kbg = el('div');
    kSec.body.appendChild(field('键盘背景样式', kbg));
    Inspector.styleRefEditor(kbg, doc, ks, 'backgroundStyle', { baseName: 'keyboardBackground', resolveOwner: regionOwner('keyboardStyle') });
    container.appendChild(kSec.root);

    // preedit
    const pSec = section('预编辑区 preeditStyle（正在打的拼音码那行）', false);
    const ps = doc.preeditStyle = doc.preeditStyle || {};
    pSec.body.appendChild(field('内边距（左=拼音码离左边多远，调大往右移）', insetsInput(ps.insets, v => editRegion('preeditStyle', t => { if (v) t.insets = v; else delete t.insets; }))));

    // 🔗 jsonnet 联动：拼音码 / iPad 候选区位置 —— 直接写回源码，手机「运行 main.jsonnet」后不会被覆盖
    const jpi = SkinModel.getJsonnetPreeditInsets(Renderer.state.docName);
    if (jpi) {
      const isCand = jpi.binding.kind === 'candidateInsets';
      const jbox = el('div');
      jbox.appendChild(insetsInput(jpi.values || {}, v => {
        try {
          App.edit(null, () => SkinModel.setJsonnetPreeditInsets(Renderer.state.docName, v || {}));
          toast('已写入源码 ' + jpi.binding.label + '，手机重编译不丢');
        } catch (e) { toast(e.message, true); }
      }));
      pSec.body.appendChild(field('🔗 ' + (isCand ? '候选区左右位置（源码联动·左右调大→往中间收）' : '拼音码位置（源码联动·左调大→往右移）'), jbox));
      pSec.body.appendChild(el('div', 'hint-line',
        '✓ 这是 jsonnet 编译型皮肤，此项已联动源码（' + jpi.binding.label + '）：改上下左右会直接写进 jsonnet，导出后在元书里长按皮肤「运行 main.jsonnet」也不会被覆盖。上面普通「内边距」只影响本编辑器预览。'));
    } else if (SkinModel.hasJsonnet()) {
      pSec.body.appendChild(el('div', 'hint-line',
        '⚠ 这是 jsonnet 编译型皮肤，但没定位到官方模板的 preedit/candidate 位置源码。其它改动会随覆盖层保留；但"拼音码/候选区位置"是编译期常量，需要到「源码」页在对应 .libsonnet 里手改。'));
    }
    const pbg = el('div');
    pSec.body.appendChild(field('背景样式', pbg));
    Inspector.styleRefEditor(pbg, doc, ps, 'backgroundStyle', { baseName: 'preeditBackground', resolveOwner: regionOwner('preeditStyle') });
    // preedit 前景（专用格式）
    const fgName = typeof ps.foregroundStyle === 'string' ? ps.foregroundStyle : null;
    let fg = fgName ? doc[fgName] : ps.foregroundStyle;
    const mkFg = () => {
      if (!fg) {
        App.edit(d => {
          d.preeditForegroundStyle2 = { fontSize: 16, textColor: '#333333' };
          (d.preeditStyle = d.preeditStyle || {}).foregroundStyle = 'preeditForegroundStyle2';
        });
        fg = doc.preeditForegroundStyle2;
      }
    };
    const fgBox = el('div');
    if (fg) {
      fgBox.appendChild(field('文字颜色', colorInput(fg.textColor || fg.normalColor, v => editRegionFg('preeditStyle', f => { if (v == null) delete f.textColor; else f.textColor = v; }))));
      fgBox.appendChild(field('字号', numInput(fg.fontSize, v => editRegionFg('preeditStyle', f => { if (v == null) delete f.fontSize; else f.fontSize = v; }), { step: 0.5 })));
    } else {
      fgBox.appendChild(button('＋设置预编辑文字样式', () => { mkFg(); buildGlobalPanel(container); }, 'btn small'));
    }
    pSec.body.appendChild(field('文字样式', fgBox));
    container.appendChild(pSec.root);

    // 工具栏
    const tSec = section('工具栏 toolbar', false);
    const ts = doc.toolbarStyle = doc.toolbarStyle || {};
    tSec.body.appendChild(field('内边距', insetsInput(ts.insets, v => editRegion('toolbarStyle', t => { if (v) t.insets = v; else delete t.insets; }))));
    const tbg = el('div');
    tSec.body.appendChild(field('背景样式', tbg));
    Inspector.styleRefEditor(tbg, doc, ts, 'backgroundStyle', { baseName: 'toolbarBackground', resolveOwner: regionOwner('toolbarStyle') });
    tSec.body.appendChild(el('div', 'hint-line', '工具栏上的按钮：把预览上方切到「工具栏」后点击按钮即可编辑；增删按钮用「布局树」页。'));
    container.appendChild(tSec.root);

    // 横向候选栏
    const hcSec = section('横向候选栏', false);
    const hcs = doc.horizontalCandidatesStyle = doc.horizontalCandidatesStyle || {};
    hcSec.body.appendChild(field('内边距', insetsInput(hcs.insets, v => editRegion('horizontalCandidatesStyle', t => { if (v) t.insets = v; else delete t.insets; }))));
    const hcbg = el('div');
    hcSec.body.appendChild(field('背景样式', hcbg));
    Inspector.styleRefEditor(hcbg, doc, hcs, 'backgroundStyle', { baseName: 'horizontalCandidatesBackground', resolveOwner: regionOwner('horizontalCandidatesStyle') });
    container.appendChild(hcSec.root);

    // 纵向候选栏
    const vcSec = section('纵向候选栏', false);
    const vcs = doc.verticalCandidatesStyle = doc.verticalCandidatesStyle || {};
    vcSec.body.appendChild(field('内边距', insetsInput(vcs.insets, v => editRegion('verticalCandidatesStyle', t => { if (v) t.insets = v; else delete t.insets; }))));
    const vcbg = el('div');
    vcSec.body.appendChild(field('背景样式', vcbg));
    Inspector.styleRefEditor(vcbg, doc, vcs, 'backgroundStyle', { baseName: 'verticalCandidatesBackground', resolveOwner: regionOwner('verticalCandidatesStyle') });
    container.appendChild(vcSec.root);

    const collectKeyNames = d => {
      const names = new Set();
      const walk = arr => {
        if (!Array.isArray(arr)) return;
        for (const item of arr) {
          if (item && item.Cell != null) names.add(item.Cell);
          if (item && item.HStack) walk(item.HStack.subviews);
          if (item && item.VStack) walk(item.VStack.subviews);
        }
      };
      walk(d.keyboardLayout);
      return names;
    };

    // ===== 全部按键一起改（全局编辑模式） =====
    const allSec = section('全部按键一起改（全局）', true);
    let gScope = 'all';
    allSec.body.appendChild(field('作用范围', selectInput('all', [
      ['all', '整套皮肤的所有键盘（默认）'],
      ['current', '只当前这个键盘'],
    ], v => { gScope = v; })));
    const curMode = Renderer.state.mode;
    allSec.body.appendChild(el('div', 'hint-line',
      `🎨 颜色类改动只作用到你当前显示的【${curMode === 'light' ? '浅色' : '深色'}】键盘——想让深浅不一样，就切到另一个模式再各自调（顶栏切换浅/深）。圆角、文字大小这类"形状"改动浅深一起改，保持一致。\n默认作用到拼音/数字/符号/横竖屏/iPad 的所有键盘。含"打字时"才出现的样式也一并改到。`));

    // 遍历范围内的每个键盘文档；modes 指定改哪些明暗模式（颜色只改当前，形状改浅深）
    const forScopedDocs = (fn, modes) => {
      const m = M();
      const names = gScope === 'current' ? [Renderer.state.docName] : [...new Set([...Object.keys(m.docs.light), ...Object.keys(m.docs.dark)])];
      for (const mode of (modes || ['light', 'dark'])) {
        for (const name of names) {
          const d = m.docs[mode][name];
          if (d && !d.__parseError) { fn(d); m.docDirty[mode].add(name); }
        }
      }
    };
    // 解析一个样式引用 → 涉及的样式对象数组。支持：样式名(string)、内联对象、
    // 以及"条件样式数组"（如 [{conditionKey,conditionValue,styleName}]，回车键随场景变色就是这种）。
    const styleObjsOf = (d, ref) => {
      const out = [];
      if (ref == null) return out;
      if (typeof ref === 'string') { const s = d[ref]; if (s && typeof s === 'object') out.push(s); }
      else if (Array.isArray(ref)) {
        for (const it of ref) {
          if (!it || typeof it !== 'object') continue;
          if (it.styleName) { const s = d[it.styleName]; if (s && typeof s === 'object') out.push(s); }
          else out.push(it); // 内联条件样式
        }
      } else if (typeof ref === 'object') out.push(ref);
      return out;
    };
    // 某个键"会用到的所有背景样式"，包括通知切换出来的样式（打字时/回车态等）
    const notifStyles = (d, def, kind) => {
      const out = [];
      const ns = def.notification == null ? [] : (Array.isArray(def.notification) ? def.notification : [def.notification]);
      for (const nn of ns) {
        const nt = typeof nn === 'string' ? d[nn] : nn;
        if (nt && typeof nt === 'object') out.push(...styleObjsOf(d, nt[kind]));
      }
      return out;
    };
    // 对文档里每个按键的背景样式对象执行 fn（Set 防止共享样式重复处理）
    const eachKeyBg = (d, fn) => {
      const seen = new Set();
      for (const name of collectKeyNames(d)) {
        const def = d[name];
        if (!def || typeof def !== 'object' || def.type) continue;
        const styles = [...styleObjsOf(d, def.backgroundStyle), ...notifStyles(d, def, 'backgroundStyle')];
        for (const st of styles) { if (st && !seen.has(st)) { seen.add(st); fn(st, def, name); } }
      }
    };
    const eachKeyTextFg = (d, fn) => {
      const seen = new Set();
      for (const name of collectKeyNames(d)) {
        const def = d[name];
        if (!def || typeof def !== 'object' || def.type) continue;
        const styles = [
          ...styleObjsOf(d, def.foregroundStyle),
          ...styleObjsOf(d, def.uppercasedStateForegroundStyle),
          ...notifStyles(d, def, 'foregroundStyle'),
        ];
        for (const st of styles) {
          if (st && !seen.has(st) && st.buttonStyleType !== 'geometry' && st.buttonStyleType !== 'fileImage') {
            seen.add(st); fn(st);
          }
        }
      }
    };
    // 形状类：浅深一起改（保持一致）
    const gApply = (label, fn) => {
      App.edit(null, () => forScopedDocs(fn, ['light', 'dark']));
      UI.toast('已应用：' + label + (gScope === 'all' ? '（所有键盘·浅深）' : '（当前键盘·浅深）'));
    };
    // 颜色类：只改当前显示的明暗模式（浅/深各自调）
    const gApplyColor = (label, fn) => {
      const mode = Renderer.state.mode;
      App.edit(null, () => forScopedDocs(fn, [mode]));
      UI.toast('已应用：' + label + '（' + (mode === 'light' ? '浅色' : '深色') + '模式' + (gScope === 'all' ? '·所有键盘' : '') + '）');
    };

    allSec.body.appendChild(field('全部按键底色', UI.colorInput(null, v => {
      if (v == null) return;
      gApplyColor('按键底色', d => eachKeyBg(d, st => {
        if (st.buttonStyleType === 'fileImage') return; // 图片背景不动
        st.normalColor = v;
      }));
    })));
    allSec.body.appendChild(field('全部按下时底色', UI.colorInput(null, v => {
      if (v == null) return;
      gApplyColor('按下底色', d => eachKeyBg(d, st => {
        if (st.buttonStyleType === 'fileImage') return;
        st.highlightColor = v;
      }));
    })));
    allSec.body.appendChild(field('全部文字/图标颜色', UI.colorInput(null, v => {
      if (v == null) return;
      gApplyColor('文字颜色', d => eachKeyTextFg(d, st => { st.normalColor = v; }));
    })));
    allSec.body.appendChild(field('全部文字大小', UI.numInput(null, v => {
      if (v == null) return;
      gApply('文字大小', d => eachKeyTextFg(d, st => { if (st.buttonStyleType !== 'systemImage') st.fontSize = v; }));
    }, { step: 1, min: 6 })));
    allSec.body.appendChild(field('全部按键圆角', UI.numInput(null, v => {
      if (v == null) return;
      gApply('圆角', d => eachKeyBg(d, st => {

    // ===== 按键动画（全局）：按下时按键本身缩放/回弹 =====
    const animSec = section('🎬 按键动画（全局·按下时按键缩放回弹）', true);

    const fxPresets = window.__EFFECT_PRESETS || [];

  // ============ 布局树面板 ============
  function buildLayoutPanel(container) {
    container.innerHTML = '';
    const doc = App.currentDoc();
    if (!doc) { container.appendChild(el('div', 'panel-hint', '先选择一个键盘文件')); return; }

    const areaSel = selectInput(App.layoutArea || 'keyboardLayout', [
      ['keyboardLayout', '按键区布局'],
      ['toolbarLayout', '工具栏布局'],
      ['horizontalCandidatesLayout', '横向候选栏布局'],
      ['verticalCandidatesLayout', '纵向候选栏布局'],
    ], v => { App.layoutArea = v; buildLayoutPanel(container); });
    container.appendChild(field('编辑哪个区域', areaSel));

    const areaKey = App.layoutArea || 'keyboardLayout';

    // 横屏分体键盘：一键把键盘拆成左右两半（照图1）

      let gapVal = '0.14', scopeVal = 'current';

        buildLayoutPanel(container);

        '按键会等比缩小腾出空档。改完导出即可；jsonnet 皮肤记得导入后「运行 main.jsonnet」，分体会随覆盖层保留。要还原：点顶部↩撤销。'));

    if (!Array.isArray(doc[areaKey])) {
      container.appendChild(button('＋ 创建这个区域的布局', () => {
        App.editLayout(() => { App.currentDoc()[areaKey] = [{ HStack: { subviews: [] } }]; });
        buildLayoutPanel(container);
      }, 'btn small'));
      return;
    }

    const tree = el('div', 'layout-tree');
    container.appendChild(tree);

    function nodeRow(label, depth, actions, extraCls) {
      const row = el('div', 'lt-row' + (extraCls ? ' ' + extraCls : '') + (depth > 0 ? ' lt-depth' : ''));
      row.style.marginLeft = (depth * 14) + 'px';
      row.style.paddingLeft = '6px';
      row.appendChild(el('span', 'lt-label', label));
      const acts = el('span', 'lt-acts');
      for (const [txt, fn, title] of actions) {
        const b = button(txt, fn, 'mini-btn');
        if (title) b.title = title;
        acts.appendChild(b);
      }
      row.appendChild(acts);
      return row;
    }

    function drawLevel(arr, depth, parentArr, parentIdx) {
      let rowN = 0, colN = 0;
      arr.forEach((item, i) => {
        const move = (dir) => () => {
          const j = i + dir;
          if (j < 0 || j >= arr.length) return;
          App.editLayout(() => { [arr[i], arr[j]] = [arr[j], arr[i]]; });
          buildLayoutPanel(container);
        };
        const remove = () => {
          if (!confirm('确定删除这一项（含其子项）吗？')) return;
          App.editLayout(() => { arr.splice(i, 1); });
          buildLayoutPanel(container);
        };
        if (item.HStack || item.VStack) {
          const kind = item.HStack ? 'HStack' : 'VStack';
          const stack = item[kind];
          const n = item.HStack ? ++rowN : ++colN;
          const styleName = typeof stack.style === 'string' ? stack.style : null;
          const sz = styleName && doc[styleName] && doc[styleName].size ? JSON.stringify(doc[styleName].size) : '自动';
          const row = nodeRow(`${item.HStack ? `➡ 第${n}行` : `⬇ 第${n}列`}（${kind}·尺寸 ${sz}）`, depth, [
            ['尺寸', () => editStackSize(stack, kind), '设置这一行/列的高度或宽度'],
            ['＋键', () => addCellTo(stack), '添加按键'],
            ['＋行', () => { App.editLayout(() => { stack.subviews = stack.subviews || []; stack.subviews.push({ HStack: { subviews: [] } }); }); buildLayoutPanel(container); }],
            ['＋列', () => { App.editLayout(() => { stack.subviews = stack.subviews || []; stack.subviews.push({ VStack: { subviews: [] } }); }); buildLayoutPanel(container); }],
            ['↑', move(-1)], ['↓', move(1)], ['✕', remove],
          ], 'lt-stack');
          tree.appendChild(row);
          drawLevel(stack.subviews || [], depth + 1, arr, i);
        } else if (item.Cell != null) {
          const name = item.Cell;
          const def = doc[name];
          const missing = !def;
          const isCollection = def && def.type;
          const row = nodeRow(`${isCollection ? '▤' : '⌨'} ${name}${missing ? '（未定义）' : ''}`, depth, [

    function editStackSize(stack, kind) {
      const m = UI.modal('行/列尺寸', '400px');

      let styleName = typeof stack.style === 'string' ? stack.style : null;

          if (!styleName) {
            let n = 'stackStyle', i = 1;

            stack.style = styleName;
          }
          d[styleName] = d[styleName] || {};
          d[styleName].size = d[styleName].size || {};

    // 两个模式下同名文档（新建按键时定义要同时写进浅色+深色，否则镜像后的布局会引用到缺失的键）
    const bothModeDocs = () => [['light', false], ['dark', true]]
      .map(([mode, isDark]) => [M().docs[mode][Renderer.state.docName], isDark])

    const nameTakenAnyMode = nm => bothModeDocs().some(([d]) => d[nm] != null);
    const uniqueDocName = base => { let n = base, i = 2; while (nameTakenAnyMode(n)) n = base + i++; return n; };

          App.editLayout(() => { stack.subviews = stack.subviews || []; stack.subviews.push({ Cell: n }); });
          buildLayoutPanel(container);

      m.body.appendChild(button('新建普通按键（输入字符）', () => {
        m.close();
        const ch = prompt('这个键输入什么字符？（如 a)：', 'a');
        if (ch == null) return;
        const n = uniqueDocName((ch.replace(/[^\w]/g, '_') || 'key') + 'Button');
        const fgn = n + 'ForegroundStyle';
        App.editLayout(() => {
          for (const [d, isDark] of bothModeDocs()) {
            d[fgn] = { buttonStyleType: 'text', text: ch, fontSize: 20, normalColor: isDark ? '#ffffff' : '#000000' };
            d[n] = { action: { character: ch }, foregroundStyle: fgn };
          }
          stack.subviews = stack.subviews || [];
          stack.subviews.push({ Cell: n });
        });
        App.selection = n;
        buildLayoutPanel(container);
      }, 'pick-item'));
      m.body.appendChild(button('新建功能键（空格/回车/删除…）', () => {
        m.close();
        const m2 = UI.modal('选择功能', '400px');
        for (const [v, lab] of Actions.STANDARD) {
          m2.body.appendChild(button(lab, () => {
            m2.close();
            const n = uniqueDocName(v + 'Button');
            const fgn = n + 'ForegroundStyle';
            App.editLayout(() => {
              for (const [d, isDark] of bothModeDocs()) {
                d[fgn] = { buttonStyleType: 'text', text: lab, fontSize: 14, normalColor: isDark ? '#ffffff' : '#000000' };
                d[n] = { action: v, foregroundStyle: fgn };
              }
              stack.subviews = stack.subviews || [];
              stack.subviews.push({ Cell: n });
            });
            App.selection = n;
            buildLayoutPanel(container);
          }, 'pick-item'));
        }
      }, 'pick-item'));
    }

    drawLevel(doc[areaKey], 0, null, -1);

    container.appendChild(button('＋ 在最外层加一行 HStack', () => {
      App.editLayout(() => { const d = App.currentDoc(); d[areaKey] = d[areaKey] || []; d[areaKey].push({ HStack: { subviews: [] } }); });
