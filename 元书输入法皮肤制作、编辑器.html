    }, 'btn small'));
    container.appendChild(button('＋ 在最外层加一列 VStack', () => {
      App.editLayout(() => { const d = App.currentDoc(); d[areaKey] = d[areaKey] || []; d[areaKey].push({ VStack: { subviews: [] } }); });
      buildLayoutPanel(container);
    }, 'btn small'));
    container.appendChild(el('div', 'hint-line', '规则：同一层里只能全用行、或全用列、或全放按键，不能混用。'));
  }

  function pickKeyName(doc, cb) {
    const m = UI.modal('选择按键定义', '420px');
    const inp = el('input'); inp.type = 'text'; inp.placeholder = '搜索…'; inp.style.width = '100%';
    const list = el('div', 'pick-list');
    function draw() {
      list.innerHTML = '';
      const q = inp.value.trim().toLowerCase();
      const keys = Object.keys(doc).filter(k => {
        const v = doc[k];
        return v && typeof v === 'object' && !Array.isArray(v) && (v.action != null || v.type != null || v.foregroundStyle != null);
      }).filter(k => !q || k.toLowerCase().includes(q)).sort();
      for (const k of keys.slice(0, 300)) list.appendChild(button(k, () => { m.close(); cb(k); }, 'pick-item'));
    }
    inp.oninput = draw;
    m.body.appendChild(inp); m.body.appendChild(list);
    draw();
  }

  // ============ 皮肤信息（config）面板 ============
  function buildConfigPanel(container) {
    container.innerHTML = '';
    const cfg = M().config = M().config || {};

    const info = section('基本信息', true);
    info.body.appendChild(field('皮肤名称', textInput(cfg.name, v => App.edit(null, () => { if (v) cfg.name = v; else delete cfg.name; M().configDirty = true; }))));
    info.body.appendChild(field('作者', textInput(cfg.author, v => App.edit(null, () => { if (v) cfg.author = v; else delete cfg.author; M().configDirty = true; }))));
    info.body.appendChild(field('描述', textInput(cfg.description, v => App.edit(null, () => { if (v) cfg.description = v; else delete cfg.description; M().configDirty = true; }))));
    container.appendChild(info.root);

    // README
    const rSec = section('README（皮肤使用说明）', false);
    const ta = el('textarea'); ta.rows = 6;
    ta.value = M().readme || '';
    ta.onchange = () => { M().readme = ta.value || null; App.commit(); };
    rSec.body.appendChild(ta);
    container.appendChild(rSec.root);

    // demo.png
    const dSec = section('皮肤封面 demo.png', true);
    if (M().demoPng) {
      const img = el('img', 'demo-img');
      img.src = URL.createObjectURL(new Blob([M().demoPng], { type: 'image/png' }));
      dSec.body.appendChild(img);
    } else {
      dSec.body.appendChild(el('div', 'hint-line warn', '还没有封面图（导入 App 时必须有）'));
    }
    dSec.body.appendChild(button('用当前预览生成封面', () => {
      const canvas = document.getElementById('previewCanvas');
      canvas.toBlob(async blob => {
        M().demoPng = new Uint8Array(await blob.arrayBuffer());
        toast('已生成 demo.png');
        buildConfigPanel(container);
      }, 'image/png');
    }, 'btn small'));
    const up = el('input'); up.type = 'file'; up.accept = '.png';
    up.style.display = 'none';
    up.onchange = async () => {
      if (!up.files[0]) return;
      M().demoPng = new Uint8Array(await up.files[0].arrayBuffer());
      toast('已更新 demo.png');
      buildConfigPanel(container);
    };
    dSec.body.appendChild(button('上传图片作为封面', () => up.click(), 'btn small'));
    dSec.body.appendChild(up);
    container.appendChild(dSec.root);

    // 字体
    const fSec = section('字体 fontFace', false);
    fSec.body.appendChild(el('div', 'hint-line', `fonts 目录内文件：${M().fonts.length ? M().fonts.join('、') : '（无）'}`));
    const fontUp = el('input'); fontUp.type = 'file'; fontUp.accept = '.ttf,.otf'; fontUp.style.display = 'none';
    fontUp.onchange = async () => {
      const f = fontUp.files[0];
      if (!f) return;
      M().rawFiles.set('fonts/' + f.name, new Uint8Array(await f.arrayBuffer()));
      M().fonts.push(f.name);
      toast('已添加字体 ' + f.name);
      buildConfigPanel(container);
    };
    fSec.body.appendChild(button('＋添加字体文件', () => fontUp.click(), 'btn small'));
    fSec.body.appendChild(fontUp);
    const fta = el('textarea'); fta.rows = 6;
    fta.placeholder = 'fontFace 配置（YAML），如：\n- url: myfont.ttf\n  ranges:\n  - location: 65\n    length: 26';
    try { fta.value = cfg.fontFace ? jsyaml.dump(cfg.fontFace) : ''; } catch (_) { }
    fta.onchange = () => {
      try {
        const v = fta.value.trim() ? jsyaml.load(fta.value) : null;
        App.edit(null, () => { if (v) cfg.fontFace = v; else delete cfg.fontFace; M().configDirty = true; });
        fta.classList.remove('err');
      } catch (e) { fta.classList.add('err'); }
    };
    fSec.body.appendChild(field('fontFace 配置', fta));
    container.appendChild(fSec.root);

    // 按键音
    const sSec = section('按键音 keySound', false);
    sSec.body.appendChild(el('div', 'hint-line', `sound 目录内文件：${M().sounds.length ? M().sounds.join('、') : '（无）'}；仅支持 wav / aiff`));
    const sndUp = el('input'); sndUp.type = 'file'; sndUp.accept = '.wav,.aiff,.aif'; sndUp.style.display = 'none';
    sndUp.onchange = async () => {
      const f = sndUp.files[0];
      if (!f) return;
      M().rawFiles.set('sound/' + f.name, new Uint8Array(await f.arrayBuffer()));
      M().sounds.push(f.name);
      toast('已添加音频 ' + f.name);
      buildConfigPanel(container);
    };
    sSec.body.appendChild(button('＋添加音频文件', () => sndUp.click(), 'btn small'));
    sSec.body.appendChild(sndUp);
    // 修改一律现取 config.keySound，避免"清空后再选，写进已丢弃的旧对象、保存不上"的 bug
    const editKeySound = mut => App.edit(null, () => {
      const c = M().config = M().config || {};
      const kk = c.keySound = c.keySound || {};
      mut(kk);
      if (!Object.keys(kk).length) delete c.keySound;
      M().configDirty = true;
    });
    const curKS = () => (M().config && M().config.keySound) || {};

    // 试听：从皮肤包里取出音频直接播放——能响=文件本身没问题
    function playSound(name) {
      if (!name) { toast('还没选择音频', true); return; }
      const bytes = M().rawFiles.get('sound/' + name);
      if (!bytes) { toast(`皮肤包里找不到 sound/${name}`, true); return; }
      try {
        const url = URL.createObjectURL(new Blob([bytes], { type: name.toLowerCase().endsWith('.wav') ? 'audio/wav' : 'audio/aiff' }));
        const a = new Audio(url);
        a.onended = () => URL.revokeObjectURL(url);
        a.play().then(() => toast('▶ 正在试听 ' + name)).catch(e => toast('播放失败：' + e.message + '（浏览器可能不支持该格式）', true));
      } catch (e) { toast('播放失败：' + e.message, true); }
    }

    const soundOpts = [['', '（默认）'], ...M().sounds.map(s => [s, s])];
    for (const [k, lab] of [['input', '输入键按键音（字母/数字/符号键）'], ['delete', '删除键按键音'], ['system', '系统键按键音（Shift/回车/切换等）']]) {
      const row = el('div');
      const sel = selectInput(curKS()[k] || '', soundOpts, v => editKeySound(kk => { if (v) kk[k] = v; else delete kk[k]; }));
      row.appendChild(sel);
      row.appendChild(button('▶ 试听', () => playSound(sel.value || curKS()[k]), 'mini-btn'));
      sSec.body.appendChild(field(lab, row));
    }
    const ksTa = el('textarea'); ksTa.rows = 5;
    ksTa.placeholder = '按 action 单独配音（YAML）：\n- action: { character: "f" }\n  url: key_f.wav';
    try { ksTa.value = curKS().actions ? jsyaml.dump(curKS().actions) : ''; } catch (_) { }
    ksTa.onchange = () => {
      try {
        const v = ksTa.value.trim() ? jsyaml.load(ksTa.value) : null;
        editKeySound(kk => { if (v) kk.actions = v; else delete kk.actions; });
        ksTa.classList.remove('err');
      } catch (e) { ksTa.classList.add('err'); }
    };
    sSec.body.appendChild(field('按动作单独配音', ksTa));
    sSec.body.appendChild(el('div', 'hint-line',
      '📱 手机上听不到声音的排查顺序：\n' +
      '① 先点上面「▶ 试听」——编辑器里能响，说明音频文件本身没问题\n' +
      '② 元书 App 设置 → 键盘反馈：把「按键音」打开（关着的话皮肤配了也不响）\n' +
      '③ 检查手机侧边的静音拨键和媒体音量\n' +
      '④ 改完必须重新导出并导入皮肤\n' +
      '⑤ jsonnet 编译型皮肤：这里配的音效会随覆盖层写进 config.yaml，导入后「运行 main.jsonnet」也会保留，不用再手动改 jsonnet 了'));
    container.appendChild(sSec.root);
  }

  // ============ 校验面板 ============
  function buildValidatePanel(container) {
    container.innerHTML = '';
    const problems = [];
    const m = M();

    if (!m.demoPng) problems.push(['warn', '缺少 demo.png 封面（导入 App 必须）——在「皮肤信息」页生成']);
    if (SkinModel.hasJsonnet()) {
      problems.push(['info', '此皮肤是 jsonnet 编译型（带 jsonnet 文件夹）。手机导入后会从 jsonnet 源码「重新生成」键盘。本编辑器已做到：你在可视化里做的改动（颜色、通知、布局、按键样式、尺寸、动画、皮肤名/作者/音效等）会在【导出时】自动写进一层 jsonnet「覆盖层」，导入后长按皮肤「运行 main.jsonnet」照样全部生效。其中「拼音码/候选区位置」是编译期常量，已单独写进 jsonnet 源码常量。导出时未改动的文件会逐字节原样保留，不会破坏皮肤。']);
    }
    // 九键（T9）提示：需要输入方案配合
    {
      let hasT9 = false;
      for (const mode of ['light', 'dark']) {
        for (const name in m.docs[mode]) {
          const doc = m.docs[mode][name];
          if (doc && !doc.__parseError && Object.values(doc).some(v => v && typeof v === 'object' && (v.type === 't9Symbols' || v.type === 't9HorizontalSymbols'))) { hasT9 = true; break; }
        }
        if (hasT9) break;
      }
      if (hasT9) problems.push(['warn', '皮肤包含中文九键（T9）键盘。提醒：手机上还需启用支持九键的输入方案（元书「Rime」页恢复默认方案后，把「中文九键」拖到方案列表第一位），只有皮肤是打不出字的——官网「中文九键」文档有详细步骤']);
    }
    const cfg = m.config || {};
    if (!cfg.pinyin) problems.push(['error', 'config.yaml 未配置 pinyin 中文键盘（必须提供）']);

    // config 引用的文件是否存在
    for (const kType in cfg) {
      const v = cfg[kType];
      if (!v || typeof v !== 'object' || !('iPhone' in v || 'iPad' in v)) continue;
      for (const dev of ['iPhone', 'iPad']) {
        for (const ori in (v[dev] || {})) {
          const f = v[dev][ori];
          for (const mode of ['light', 'dark']) {
            if (!m.docs[mode][f]) problems.push(['error', `config：${kType}·${dev}·${ori} 引用的 ${mode}/${f}.yaml 不存在`]);
          }
        }
      }
    }

    // 每个文件内部检查
    for (const mode of ['light', 'dark']) {
      for (const name in m.docs[mode]) {
        const doc = m.docs[mode][name];
        if (doc.__parseError) { problems.push(['error', `${mode}/${name}.yaml 无法解析：${doc.__parseError}`]); continue; }
        const where = `${mode}/${name}`;
        // 布局引用检查 + 混用检查
        const checkLayout = (arr, area) => {
          if (!Array.isArray(arr)) return;
          let kinds = new Set();
          arr.forEach(item => {
            if (item.HStack) kinds.add('H');
            else if (item.VStack) kinds.add('V');
            else if (item.Cell != null) kinds.add('C');
          });
          if (kinds.size > 1) problems.push(['warn', `${where}：${area} 同一层混用了行/列/按键（真机可能渲染异常）`]);
          arr.forEach(item => {
            if (item.Cell != null && doc[item.Cell] == null) problems.push(['error', `${where}：布局引用的按键 "${item.Cell}" 没有定义`]);
            if (item.HStack) checkLayout(item.HStack.subviews, area);
            if (item.VStack) checkLayout(item.VStack.subviews, area);
          });
        };
        for (const area of ['keyboardLayout', 'toolbarLayout', 'horizontalCandidatesLayout', 'verticalCandidatesLayout']) checkLayout(doc[area], area);

        // 样式引用检查
        const checkRef = (ref, ctx) => {
          if (ref == null) return;
          const names = typeof ref === 'string' ? [ref] : (Array.isArray(ref) ? ref : []);
          for (const n of names) {
            if (typeof n === 'string' && doc[n] == null) problems.push(['error', `${where}：${ctx} 引用的样式 "${n}" 不存在`]);
            if (n && typeof n === 'object' && n.styleName) {
              const sns = Array.isArray(n.styleName) ? n.styleName : [n.styleName];
              for (const sn of sns) if (doc[sn] == null) problems.push(['error', `${where}：${ctx} 条件样式引用 "${sn}" 不存在`]);
            }
          }
        };
        for (const k in doc) {
          const v = doc[k];
          if (!v || typeof v !== 'object' || Array.isArray(v)) continue;
          checkRef(v.backgroundStyle, k);
          checkRef(v.foregroundStyle, k);
          // fileImage 图片存在性
          if (v.buttonStyleType === 'fileImage') {
            for (const ik of ['normalImage', 'highlightImage']) {
              const im = v[ik];
              if (im && im.file) {
                const res = SkinModel.getResource(mode, im.file);
                if (!res) problems.push(['error', `${where}：样式 ${k} 用的图片 "${im.file}" 不存在`]);
                else if (im.image && !(res.slices && res.slices[im.image])) problems.push(['warn', `${where}：样式 ${k} 用的切片 "${im.file}:${im.image}" 未定义`]);
              }
            }
          }
        }
        if (doc.keyboardHeight == null) problems.push(['warn', `${where}：未设置 keyboardHeight`]);

        // 空通知检查：匹配时按键会变空白（官方规则）
        for (const k in doc) {
          const v = doc[k];
          if (!v || typeof v !== 'object' || Array.isArray(v) || !v.notification) continue;
          const ntfs = Array.isArray(v.notification) ? v.notification : [v.notification];
          for (const nn of ntfs) {
            const ntf = typeof nn === 'string' ? doc[nn] : nn;
            if (!ntf) { problems.push(['error', `${where}：按键 ${k} 引用的通知 "${nn}" 不存在`]); continue; }
            if (!ntf.backgroundStyle && !ntf.foregroundStyle) {
              problems.push(['warn', `${where}：按键 ${k} 的通知 "${typeof nn === 'string' ? nn : '(内联)'}" 没设置任何样式——真机上通知触发时这个键会变成空白！不需要它就把它删掉`]);
            }
          }
        }
      }
    }

    if (!problems.length) {
      container.appendChild(el('div', 'panel-hint ok', '✓ 没有发现问题，皮肤结构完整'));
    } else {
      const errs = problems.filter(p => p[0] === 'error');
      const warns = problems.filter(p => p[0] === 'warn');
      container.appendChild(el('div', 'panel-hint', `发现 ${errs.length} 个错误、${warns.length} 个提醒`));
      for (const [lvl, msg] of problems) {
        container.appendChild(el('div', 'vld-item ' + lvl, (lvl === 'error' ? '✕ ' : lvl === 'info' ? 'ℹ️ ' : '⚠ ') + msg));
      }
    }
    container.appendChild(button('重新检查', () => buildValidatePanel(container), 'btn small'));
  }

  // ============ 源码面板 ============
  function buildSourcePanel(container) {
    container.innerHTML = '';
    const files = SkinModel.listTextFiles();
    const sel = selectInput(App.sourceFile || files[0], files.map(f => [f, f]), v => {
      App.sourceFile = v;
      buildSourcePanel(container);
    });
    container.appendChild(field('文件', sel));
    const cur = App.sourceFile || files[0];
    if (!cur) return;
    App.sourceFile = cur;
    const ta = el('textarea', 'src-ta');
    ta.value = SkinModel.readTextFile(cur) || '';
    container.appendChild(ta);
    const save = button('应用修改', () => {
      try {
        SkinModel.writeTextFile(cur, ta.value);
        App.commit();
        toast('已应用 ' + cur);
      } catch (e) {
        toast(e.message, true);
      }
    }, 'btn');
    container.appendChild(save);
    if (SkinModel.model.textOverrides.has(cur)) {
      container.appendChild(el('div', 'hint-line', '● 这个文件已被编辑器改过（导出时用你的新内容）。'));
    }
    container.appendChild(el('div', 'hint-line', '这里能改皮肤包里的任何文本文件——界面里没做到的功能都可以在这直接写。'));
    if (/\.(jsonnet|libsonnet)$/i.test(cur)) {
      container.appendChild(el('div', 'hint-line',
        '📌 这是 jsonnet 源码。改完导出后，在元书里长按该皮肤「运行 main.jsonnet」，才会用新源码重新生成键盘。常改的：Constants/Keyboard.libsonnet（预编辑区/各区高度/按键定义）、Components/*.libsonnet（各键盘组件）。'));
    }
  }

  return { buildFilesPanel, buildGlobalPanel, buildLayoutPanel, buildConfigPanel, buildValidatePanel, buildSourcePanel, openEffectCustomizer, importCustomEffect };
})();

</script>
<script>
/* =========================================================
 * resources.js — 图片资源管理 + 可视化切片编辑器
 * ========================================================= */
'use strict';

const Resources = (() => {
  const { el, field, button, toast, numInput } = UI;
  const M = () => SkinModel.model;

  function buildPanel(container) {
    container.innerHTML = '';
    const mode = Renderer.state.mode;
    container.appendChild(el('div', 'panel-hint', `${mode === 'light' ? '浅色' : '深色'}模式的图片资源（顶部可切换模式）`));

    const names = Object.keys(M().resources[mode]).sort();
    const grid = el('div', 'res-grid');
    for (const name of names) {
      const r = M().resources[mode][name];
      const card = el('div', 'res-card');
      const cv = el('canvas', 'res-thumb');
      cv.width = 120; cv.height = 80;
      if (r.img) {
        const ctx = cv.getContext('2d');
        const s = Math.min(120 / r.img.naturalWidth, 80 / r.img.naturalHeight, 1);
        const w = r.img.naturalWidth * s, h = r.img.naturalHeight * s;
        ctx.drawImage(r.img, (120 - w) / 2, (80 - h) / 2, w, h);
      }
      card.appendChild(cv);
      card.appendChild(el('div', 'res-name', name));
      card.appendChild(el('div', 'res-info', `${r.img ? r.img.naturalWidth + '×' + r.img.naturalHeight : '?'} · ${Object.keys(r.slices || {}).length} 个切片`));
      card.onclick = () => openSliceEditor(mode, name);
      grid.appendChild(card);
    }
    container.appendChild(grid);

    const up = el('input'); up.type = 'file'; up.accept = '.png'; up.multiple = true; up.style.display = 'none';
    up.onchange = async () => {
      for (const f of up.files) {
        const name = f.name.replace(/\.png$/i, '');
        await SkinModel.setResourceImage(mode, name, new Uint8Array(await f.arrayBuffer()));
      }
      App.commit();
      buildPanel(container);
      toast('已添加图片');
    };
    container.appendChild(button('＋ 添加 PNG 图片', () => up.click(), 'btn'));
    container.appendChild(up);
    container.appendChild(el('div', 'hint-line', '点击图片可查看/编辑切片（把大图分成多个小图，并设置拉伸保护区）。'));
  }

  // ---------- 切片编辑器 ----------
  function openSliceEditor(mode, name) {
    const r = M().resources[mode][name];
    if (!r) return;
    const m = UI.modal(`图片切片：${name}（${mode === 'light' ? '浅色' : '深色'}）`, 'min(960px, 96vw)');
    const wrap = el('div', 'slice-wrap');
    m.body.appendChild(wrap);

    const left = el('div', 'slice-left');
    const right = el('div', 'slice-right');
    wrap.appendChild(left); wrap.appendChild(right);

    const cv = el('canvas', 'slice-canvas');
    left.appendChild(cv);
    const zoomBar = el('div', 'slice-zoom');
    left.appendChild(zoomBar);

    let zoom = 1;
    if (r.img) zoom = Math.min(1, 560 / r.img.naturalWidth, 460 / r.img.naturalHeight);
    let selected = Object.keys(r.slices || {})[0] || null;
    let drag = null;

    function fit() {
      if (!r.img) return;
      cv.width = Math.max(60, Math.round(r.img.naturalWidth * zoom));
      cv.height = Math.max(60, Math.round(r.img.naturalHeight * zoom));
    }

    function draw() {
      if (!r.img) return;
      fit();
      const ctx = cv.getContext('2d');
      ctx.clearRect(0, 0, cv.width, cv.height);
      // 棋盘底
      for (let y = 0; y < cv.height; y += 12) for (let x = 0; x < cv.width; x += 12) {
        ctx.fillStyle = ((x + y) / 12) % 2 ? '#3c3c46' : '#34343e';
        ctx.fillRect(x, y, 12, 12);
      }
      ctx.drawImage(r.img, 0, 0, cv.width, cv.height);
      for (const [sn, s] of Object.entries(r.slices || {})) {
        if (!s || !s.rect) continue;
        const x = s.rect.x * zoom, y = s.rect.y * zoom, w = s.rect.width * zoom, h = s.rect.height * zoom;
        ctx.strokeStyle = sn === selected ? '#4f8cff' : 'rgba(255,200,60,.8)';
        ctx.lineWidth = sn === selected ? 2 : 1;
        ctx.strokeRect(x, y, w, h);
        if (sn === selected && s.insets) {
          ctx.strokeStyle = 'rgba(90,220,130,.9)';
          ctx.setLineDash([4, 3]);
          const t = (s.insets.top || 0) * zoom, b = (s.insets.bottom || 0) * zoom,
            l = (s.insets.left || 0) * zoom, rr = (s.insets.right || 0) * zoom;
          if (t) { ctx.beginPath(); ctx.moveTo(x, y + t); ctx.lineTo(x + w, y + t); ctx.stroke(); }
          if (b) { ctx.beginPath(); ctx.moveTo(x, y + h - b); ctx.lineTo(x + w, y + h - b); ctx.stroke(); }
          if (l) { ctx.beginPath(); ctx.moveTo(x + l, y); ctx.lineTo(x + l, y + h); ctx.stroke(); }
          if (rr) { ctx.beginPath(); ctx.moveTo(x + w - rr, y); ctx.lineTo(x + w - rr, y + h); ctx.stroke(); }
          ctx.setLineDash([]);
        }
        ctx.fillStyle = sn === selected ? '#4f8cff' : 'rgba(255,200,60,.9)';
        ctx.font = '11px sans-serif';
        ctx.fillText(sn, x + 2, y + 11);
      }
    }

    cv.onmousedown = e => {
      const rect = cv.getBoundingClientRect();
      const px = (e.clientX - rect.left) / zoom, py = (e.clientY - rect.top) / zoom;
      // 命中已有切片
      let hit = null;
      for (const [sn, s] of Object.entries(r.slices || {})) {
        if (s && s.rect && px >= s.rect.x && px <= s.rect.x + s.rect.width && py >= s.rect.y && py <= s.rect.y + s.rect.height) hit = sn;
      }
      if (hit) { selected = hit; drawSide(); draw(); return; }
      // 空白处拖拽新建
      drag = { x0: px, y0: py };
    };
    cv.onmousemove = e => {
      if (!drag) return;
      const rect = cv.getBoundingClientRect();
      drag.x1 = (e.clientX - rect.left) / zoom;
      drag.y1 = (e.clientY - rect.top) / zoom;
      draw();
      const ctx = cv.getContext('2d');
      ctx.strokeStyle = '#4f8cff';
      ctx.setLineDash([5, 4]);
      ctx.strokeRect(Math.min(drag.x0, drag.x1) * zoom, Math.min(drag.y0, drag.y1) * zoom,
        Math.abs(drag.x1 - drag.x0) * zoom, Math.abs(drag.y1 - drag.y0) * zoom);
      ctx.setLineDash([]);
    };
    cv.onmouseup = () => {
      if (!drag || drag.x1 == null) { drag = null; return; }
      const x = Math.round(Math.min(drag.x0, drag.x1)), y = Math.round(Math.min(drag.y0, drag.y1));
      const w = Math.round(Math.abs(drag.x1 - drag.x0)), h = Math.round(Math.abs(drag.y1 - drag.y0));
      drag = null;
      if (w < 4 || h < 4) { draw(); return; }
      let i = 1;
      while (r.slices['IMG' + i]) i++;
      const sn = 'IMG' + i;
      r.slices[sn] = { rect: { x, y, width: w, height: h } };
      selected = sn;
      App.commit();
      drawSide(); draw();
    };

    for (const [z, lab] of [[0.25, '25%'], [0.5, '50%'], [1, '100%'], [2, '200%']]) {
      zoomBar.appendChild(button(lab, () => { zoom = z; draw(); }, 'mini-btn'));
    }
    zoomBar.appendChild(el('span', 'hint-line', ' 在空白处拖拽可框选新切片'));

    function drawSide() {
      right.innerHTML = '';
      // 替换图片
      const up = el('input'); up.type = 'file'; up.accept = '.png'; up.style.display = 'none';
      up.onchange = async () => {
        if (!up.files[0]) return;
        await SkinModel.setResourceImage(mode, name, new Uint8Array(await up.files[0].arrayBuffer()));
        App.commit();
        draw(); drawSide();
        toast('已替换图片（切片保留，注意尺寸是否匹配）');
      };
      right.appendChild(button('替换这张图片…', () => up.click(), 'btn small'));
      right.appendChild(up);
      right.appendChild(button('删除这张图片', () => {
        if (!confirm(`确定删除 ${name}.png 及其切片吗？`)) return;
        SkinModel.deleteResource(mode, name);
        App.commit();
        m.close();
        App.refreshLeftPanel();
      }, 'btn small danger'));

      right.appendChild(el('div', 'fld-label', '切片列表：'));
      for (const sn of Object.keys(r.slices || {})) {
        const row = el('div', 'ref-row' + (sn === selected ? ' selected' : ''));
        row.appendChild(button(sn, () => { selected = sn; drawSide(); draw(); }, 'ref-name'));
        row.appendChild(button('✕', () => {
          delete r.slices[sn];
          if (selected === sn) selected = null;
          App.commit();
          drawSide(); draw();
        }, 'mini-btn'));
        right.appendChild(row);
      }

      if (selected && r.slices[selected]) {
        const s = r.slices[selected];
        s.rect = s.rect || { x: 0, y: 0, width: 10, height: 10 };
        right.appendChild(el('div', 'fld-label', `编辑 ${selected}：`));
        const mkNum = (obj, key, lab) => field(lab, numInput(obj[key], v => {
          if (v == null) delete obj[key]; else obj[key] = v;
          App.commit();
          draw();
        }, { step: 1 }));
        right.appendChild(mkNum(s.rect, 'x', '位置 x'));
        right.appendChild(mkNum(s.rect, 'y', '位置 y'));
        right.appendChild(mkNum(s.rect, 'width', '宽'));
        right.appendChild(mkNum(s.rect, 'height', '高'));
        right.appendChild(el('div', 'fld-label', '拉伸保护区（图片放大时四边不变形的像素数）：'));
        s.insets = s.insets || {};
        right.appendChild(mkNum(s.insets, 'top', '上'));
        right.appendChild(mkNum(s.insets, 'bottom', '下'));
        right.appendChild(mkNum(s.insets, 'left', '左'));
        right.appendChild(mkNum(s.insets, 'right', '右'));
        const renBtn = button('切片改名', () => {
          const nn = prompt('新切片名：', selected);
          if (!nn || nn === selected || r.slices[nn]) return;
          r.slices[nn] = r.slices[selected];
          delete r.slices[selected];
          selected = nn;
          App.commit();
          drawSide(); draw();
        }, 'btn small');
        right.appendChild(renBtn);
      }
    }

    drawSide();
    draw();
  }

  return { buildPanel, openSliceEditor };
})();

</script>

      toolbarSpacer: { action: 'none' },
      toolbarCloseButton: { action: 'dismissKeyboard', size: { width: 44 }, foregroundStyle: 'toolbarCloseFg' },
      toolbarCloseFg: { buttonStyleType: 'systemImage', systemImageName: 'keyboard.chevron.compact.down', fontSize: 18, normalColor: fg },
      horizontalCandidatesStyle: {},
      horizontalCandidatesLayout: [{ HStack: { subviews: [{ Cell: 'horizontalCandidates' }, { Cell: 'expandButton' }] } }],
      horizontalCandidates: { type: 'horizontalCandidates', size: { width: '9/10' }, candidateStyle: 'candidateStyle' },
      candidateStyle: {
        textColor: fg, indexColor: '#888888', commentColor: '#888888',
        preferredTextColor: '#4f8cff', preferredIndexColor: '#4f8cff', preferredCommentColor: '#4f8cff',

      },
      expandButton: { action: { shortcut: '#candidatesBarStateToggle' }, foregroundStyle: 'expandFg' },
      expandFg: { buttonStyleType: 'systemImage', systemImageName: 'chevron.down', fontSize: 16, normalColor: fg },
      verticalCandidatesStyle: {},
      verticalCandidatesLayout: [

        { HStack: { style: 'vBottomRow', subviews: [{ Cell: 'vUp' }, { Cell: 'vDown' }, { Cell: 'vBack' }, { Cell: 'vReturn' }] } },
      ],
      vBottomRow: { size: { height: '1/5' } },
      verticalCandidates: { type: 'verticalCandidates', maxRows: 4, candidateStyle: 'candidateStyle' },
      vUp: { action: { shortcut: '#verticalCandidatesPageUp' }, backgroundStyle: 'sysBackgroundStyle', foregroundStyle: 'vUpFg' },
      vUpFg: { buttonStyleType: 'systemImage', systemImageName: 'chevron.up', fontSize: 16, normalColor: fg },
      vDown: { action: { shortcut: '#verticalCandidatesPageDown' }, backgroundStyle: 'sysBackgroundStyle', foregroundStyle: 'vDownFg' },
      vDownFg: { buttonStyleType: 'systemImage', systemImageName: 'chevron.down', fontSize: 16, normalColor: fg },
      vBack: { action: 'backspace', backgroundStyle: 'sysBackgroundStyle', foregroundStyle: 'vBackFg' },
      vBackFg: { buttonStyleType: 'systemImage', systemImageName: 'delete.left', fontSize: 16, normalColor: fg },
      vReturn: { action: { shortcut: '#candidatesBarStateToggle' }, backgroundStyle: 'sysBackgroundStyle', foregroundStyle: 'vReturnFg' },
      vReturnFg: { buttonStyleType: 'text', text: '收起', fontSize: 14, normalColor: fg },
      keyboardLayout: [],
    };

    const rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
    const layout = [];
    rows.forEach((row, ri) => {
      const subviews = [];
      if (ri === 2) subviews.push({ Cell: 'shiftButton' });
      for (const ch of row) {
        const bn = ch + 'Button';
        doc[bn] = {
          action: { character: ch },
          backgroundStyle: 'keyBackgroundStyle',
          foregroundStyle: bn + 'Fg',
          uppercasedStateForegroundStyle: bn + 'UpFg',
          size: ri === 1 ? { width: '1/9' } : (ri === 2 ? { width: '1/9' } : undefined),
        };
        if (!doc[bn].size) delete doc[bn].size;
        doc[bn + 'Fg'] = textStyle(ch, 22, fg);
        doc[bn + 'UpFg'] = textStyle(ch.toUpperCase(), 22, fg);
        subviews.push({ Cell: bn });
      }
      if (ri === 2) subviews.push({ Cell: 'backspaceButton' });
      layout.push({ HStack: { subviews } });
    });
    doc.shiftButton = { action: 'shift', size: { width: '3/20' }, backgroundStyle: 'sysBackgroundStyle', foregroundStyle: 'shiftFg' };
    doc.shiftFg = { buttonStyleType: 'systemImage', systemImageName: 'shift', fontSize: 18, normalColor: fg };
    doc.backspaceButton = { action: 'backspace', repeatAction: 'backspace', size: { width: '3/20' }, backgroundStyle: 'sysBackgroundStyle', foregroundStyle: 'backspaceFg' };
    doc.backspaceFg = { buttonStyleType: 'systemImage', systemImageName: 'delete.left', fontSize: 18, normalColor: fg };
    layout.push({
      HStack: {
        subviews: [
          { Cell: 'numericButton' }, { Cell: 'commaButton' }, { Cell: 'spaceButton' }, { Cell: 'periodButton' }, { Cell: 'enterButton' },
        ],
      },
    });
    doc.numericButton = { action: { keyboardType: 'numeric' }, size: { width: '3/20' }, backgroundStyle: 'sysBackgroundStyle', foregroundStyle: 'numericFg' };
    doc.numericFg = textStyle('123', 16, fg);
    doc.commaButton = { action: { symbol: '，' }, size: { width: '1/10' }, backgroundStyle: 'keyBackgroundStyle', foregroundStyle: 'commaFg' };
    doc.commaFg = textStyle('，', 22, fg);
    doc.spaceButton = { action: 'space', backgroundStyle: 'keyBackgroundStyle', foregroundStyle: 'spaceFg' };
    doc.spaceFg = textStyle('空格', 16, fg);
    doc.periodButton = { action: { symbol: '。' }, size: { width: '1/10' }, backgroundStyle: 'keyBackgroundStyle', foregroundStyle: 'periodFg' };
    doc.periodFg = textStyle('。', 22, fg);
    doc.enterButton = { action: 'enter', size: { width: '3/20' }, backgroundStyle: 'sysBackgroundStyle', foregroundStyle: 'enterFg', notification: ['enterNtf'] };
    doc.enterFg = textStyle('$returnKeyType', 16, fg);
    doc.enterNtf = { notificationType: 'returnKeyType', returnKeyType: [1, 4, 7], backgroundStyle: 'enterBlueBg', foregroundStyle: 'enterWhiteFg', action: 'enter' };
    doc.enterBlueBg = { buttonStyleType: 'geometry', insets: { top: 5, bottom: 5, left: 3, right: 3 }, normalColor: '#3478f6', highlightColor: '#5a92f7', cornerRadius: 5 };
    doc.enterWhiteFg = textStyle('$returnKeyType', 16, '#ffffff');
    doc.keyboardLayout = layout;
    return doc;
  }

  function buildNumeric(dark) {
    const fg = dark ? '#ffffff' : '#000000';
    const doc = buildKeyboard(dark);
    // 复用基础样式，替换布局为数字键盘
    const layout = [];
    const rows = [['1', '2', '3'], ['4', '5', '6'], ['7', '8', '9'], ['back', '0', 'ret']];
    for (const row of rows) {
      const subviews = [];
      for (const k of row) {
        if (k === 'back') { subviews.push({ Cell: 'returnPinyinButton' }); continue; }
        if (k === 'ret') { subviews.push({ Cell: 'enterButton' }); continue; }
        const bn = 'num' + k + 'Button';
        doc[bn] = { action: { symbol: k }, backgroundStyle: 'keyBackgroundStyle', foregroundStyle: bn + 'Fg' };
        doc[bn + 'Fg'] = textStyle(k, 24, fg);
        subviews.push({ Cell: bn });
      }
      layout.push({ HStack: { subviews } });
    }
    doc.returnPinyinButton = { action: 'returnPrimaryKeyboard', backgroundStyle: 'sysBackgroundStyle', foregroundStyle: 'returnPinyinFg' };
    doc.returnPinyinFg = textStyle('返回', 16, fg);
    doc.keyboardLayout = layout;
    return doc;
  }

  // 中文九键（T9）键盘：布局与动作参照内置 T9 / 热门九键皮肤的标准做法
  // 键位 2~9 发送数字字符给 Rime（需手机启用九键输入方案）
  function buildT9Keyboard(dark) {
    const fg = dark ? '#ffffff' : '#000000';
    const dim = dark ? '#b8b8bd' : '#8a8a8e';
    const doc = buildKeyboard(dark);   // 复用工具栏/候选栏/预编辑/基础样式

    // 清掉 26 键专用定义，保持文件干净
    for (const ch of 'qwertyuiopasdfghjklzxcvbnm') {
      delete doc[ch + 'Button']; delete doc[ch + 'ButtonFg']; delete doc[ch + 'ButtonUpFg'];
    }
    delete doc.shiftButton; delete doc.shiftFg;
    delete doc.commaButton; delete doc.commaFg;
    delete doc.periodButton; delete doc.periodFg;

    // 左列：九键符号列表 + 符号键盘入口
    doc.t9LeftCol = { size: { width: '3/20' } };
    doc.t9RightCol = { size: { width: '3/20' } };
    doc.t9GridRows = { size: { height: '3/4' } };
    doc.t9Collection = {
      type: 't9Symbols', useRimeEngine: true,
      size: { height: '3/4' }, insets: { top: 4, bottom: 4 },
      cellStyle: 't9CollectionCellStyle', displaySeparatorLine: false,
    };
    doc.t9CollectionCellStyle = { backgroundStyle: 't9CellBg', foregroundStyle: 't9CellFg' };
    doc.t9CellBg = { buttonStyleType: 'geometry', insets: { top: 2, bottom: 2, left: 3, right: 3 }, highlightColor: dark ? '#8a8a8d' : '#d0d3d9', cornerRadius: 5 };
    doc.t9CellFg = { buttonStyleType: 'text', fontSize: 17, normalColor: fg };
    doc.t9SymbolicButton = { action: { keyboardType: 'symbolic' }, backgroundStyle: 'sysBackgroundStyle', foregroundStyle: 't9SymbolicFg' };
    doc.t9SymbolicFg = textStyle('符', 16, fg);

    // 中间九宫格：1=逗号/分词位，2~9=拼音键（发数字给 Rime），上滑出数字
    const letters = { 2: 'ABC', 3: 'DEF', 4: 'GHI', 5: 'JKL', 6: 'MNO', 7: 'PQRS', 8: 'TUV', 9: 'WXYZ' };
    doc.t9Key1 = { action: { symbol: '，' }, swipeUpAction: { symbol: '1' }, backgroundStyle: 'keyBackgroundStyle', foregroundStyle: ['t9Key1Fg', 't9Key1UpFg'] };
    doc.t9Key1Fg = textStyle('，', 24, fg, { center: { x: 0.5, y: 0.55 } });
    doc.t9Key1UpFg = textStyle('1', 10, dim, { center: { x: 0.85, y: 0.22 } });
    for (let n = 2; n <= 9; n++) {
      doc['t9Key' + n] = {
        action: { character: String(n) },
        swipeUpAction: { symbol: String(n) },
        backgroundStyle: 'keyBackgroundStyle',
        foregroundStyle: ['t9Key' + n + 'Fg', 't9Key' + n + 'UpFg'],
      };
      doc['t9Key' + n + 'Fg'] = textStyle(letters[n], 17, fg, { fontWeight: 'medium', center: { x: 0.5, y: 0.55 } });
      doc['t9Key' + n + 'UpFg'] = textStyle(String(n), 10, dim, { center: { x: 0.85, y: 0.22 } });
    }

    // 底行：中/英、空格（上滑 0）、123
    doc.t9CnEnButton = { action: { keyboardType: 'alphabetic' }, backgroundStyle: 'sysBackgroundStyle', foregroundStyle: 't9CnEnFg' };
    doc.t9CnEnFg = textStyle('中/英', 14, fg);
    doc.t9SpaceButton = { action: 'space', swipeUpAction: { symbol: '0' }, size: { width: '2/4' }, backgroundStyle: 'keyBackgroundStyle', foregroundStyle: 't9SpaceFg' };
    doc.t9SpaceFg = textStyle('空格', 15, fg);
    doc.t9NumericButton = { action: { keyboardType: 'numeric' }, backgroundStyle: 'sysBackgroundStyle', foregroundStyle: 't9NumericFg' };
    doc.t9NumericFg = textStyle('123', 15, fg);

    // 右列：删除、重输、换行（换行两倍高，带智能变蓝通知）
    doc.t9BackspaceButton = { action: 'backspace', repeatAction: 'backspace', size: { height: '1/4' }, backgroundStyle: 'sysBackgroundStyle', foregroundStyle: 'backspaceFg' };
    doc.t9RetypeButton = { action: { shortcut: '#重输' }, size: { height: '1/4' }, backgroundStyle: 'sysBackgroundStyle', foregroundStyle: 't9RetypeFg' };
    doc.t9RetypeFg = textStyle('重输', 14, fg);
    doc.t9EnterButton = { action: 'enter', backgroundStyle: 'sysBackgroundStyle', foregroundStyle: 'enterFg', notification: ['enterNtf'] };

    doc.keyboardLayout = [
      { VStack: { style: 't9LeftCol', subviews: [{ Cell: 't9Collection' }, { Cell: 't9SymbolicButton' }] } },
      {
        VStack: {
          subviews: [
            {
              HStack: {
                style: 't9GridRows',
                subviews: [
                  { VStack: { subviews: [{ Cell: 't9Key1' }, { Cell: 't9Key4' }, { Cell: 't9Key7' }] } },
                  { VStack: { subviews: [{ Cell: 't9Key2' }, { Cell: 't9Key5' }, { Cell: 't9Key8' }] } },
                  { VStack: { subviews: [{ Cell: 't9Key3' }, { Cell: 't9Key6' }, { Cell: 't9Key9' }] } },
                ],
              },
            },
            { HStack: { subviews: [{ Cell: 't9CnEnButton' }, { Cell: 't9SpaceButton' }, { Cell: 't9NumericButton' }] } },
          ],
        },
      },
      { VStack: { style: 't9RightCol', subviews: [{ Cell: 't9BackspaceButton' }, { Cell: 't9RetypeButton' }, { Cell: 't9EnterButton' }] } },
    ];
    return doc;
  }

  // 按类型生成新键盘：'t26' 26键 / 't9' 中文九键 / 'numeric' 数字键盘
  function newKeyboardByKind(kind, dark) {
    if (kind === 't9') return buildT9Keyboard(!!dark);
    if (kind === 'numeric') return buildNumeric(!!dark);
    return buildKeyboard(!!dark);
  }

  function emptyKeyboard() {
    return buildKeyboard(false);
  }

  // t9Pinyin: true = 中文键盘用九键（T9），false = 26 键全键盘
  function build(t9Pinyin) {
    const config = {
      name: '我的新皮肤',
      author: '我',
      pinyin: {
        iPhone: { portrait: 'pinyin_portrait', landscape: 'pinyin_portrait' },
        iPad: { portrait: 'pinyin_portrait', landscape: 'pinyin_portrait', floating: 'pinyin_portrait' },
      },
      alphabetic: {
        iPhone: { portrait: 'alphabetic_portrait', landscape: 'alphabetic_portrait' },
      },
      numeric: {
        iPhone: { portrait: 'numeric_portrait', landscape: 'numeric_portrait' },
      },
    };
    const docs = { light: {}, dark: {} };
    for (const [mode, dark] of [['light', false], ['dark', true]]) {
      docs[mode]['pinyin_portrait'] = t9Pinyin ? buildT9Keyboard(dark) : buildKeyboard(dark);
      docs[mode]['alphabetic_portrait'] = buildKeyboard(dark);
      docs[mode]['numeric_portrait'] = buildNumeric(dark);
    }
    return { config, docs };
  }

  return { build, emptyKeyboard, buildKeyboard, buildT9Keyboard, buildNumeric, newKeyboardByKind };
})();

</script>

      dark:  { kb: '#0d0d0f', main: '#242427', fn: '#161618', pressed: '#3a3a3e', text: '#f2f2f5', edge: '#000000' } },
    { id: 'sakura', name: '少女粉', emoji: '🌸', tag: '甜甜的樱花色',
      light: { kb: '#ffe3ec', main: '#ffffff', fn: '#ffb3cd', pressed: '#ffc9db', text: '#a23b63', edge: '#f0a8c0' },
      dark:  { kb: '#2b1a22', main: '#5a3244', fn: '#3f2530', pressed: '#7a4560', text: '#ffd9e6', edge: '#1a0f15' } },
    { id: 'sky', name: '天空蓝', emoji: '🩵', tag: '清爽的海天色',
      light: { kb: '#d5e8f7', main: '#ffffff', fn: '#9fc6e8', pressed: '#c2ddf2', text: '#1c4e7a', edge: '#8fb4d6' },
      dark:  { kb: '#111d29', main: '#26435c', fn: '#1a2f42', pressed: '#3a5f80', text: '#cfe6fb', edge: '#0a121a' } },
    { id: 'mint', name: '薄荷绿', emoji: '🌿', tag: '小清新，很舒服',
      light: { kb: '#d7f0e4', main: '#ffffff', fn: '#a3d9c0', pressed: '#c3e8d6', text: '#1d6b4f', edge: '#8fc7ae' },
      dark:  { kb: '#10231b', main: '#254a3a', fn: '#193428', pressed: '#376b54', text: '#cdf3e2', edge: '#081611' } },
    { id: 'sunset', name: '暖阳橙', emoji: '🧡', tag: '温暖活泼',
      light: { kb: '#ffe6d2', main: '#ffffff', fn: '#ffbc8f', pressed: '#ffd2b3', text: '#a8541f', edge: '#f0ad82' },
      dark:  { kb: '#291a10', main: '#56341c', fn: '#3a2718', pressed: '#7a4a2c', text: '#ffe0c9', edge: '#1a0f08' } },
    { id: 'grape', name: '星空紫', emoji: '🔮', tag: '梦幻又高级',
      light: { kb: '#e6ddf7', main: '#ffffff', fn: '#c1a8ea', pressed: '#d5c4f0', text: '#5b3a9c', edge: '#ab90d6' },
      dark:  { kb: '#1a1428', main: '#3a2d5c', fn: '#271e40', pressed: '#544080', text: '#e2d6fb', edge: '#100a1a' } },
    { id: 'gray', name: '高级灰', emoji: '🩶', tag: '商务简洁',
      light: { kb: '#e2e3e7', main: '#ffffff', fn: '#c2c5cc', pressed: '#d5d7dd', text: '#33363d', edge: '#b0b3ba' },
      dark:  { kb: '#1c1c1f', main: '#3a3a3f', fn: '#2a2a2e', pressed: '#54545a', text: '#e8e8ec', edge: '#0e0e10' } },
    { id: 'glass', name: '玻璃透明', emoji: '🫧', tag: '半透明磨砂感',
      light: { kb: '#cdd2daee', main: '#ffffffd0', fn: '#aab0bcb0', pressed: '#fffffff0', text: '#20232a', edge: null },
      dark:  { kb: '#16181cee', main: '#4a4a5099', fn: '#33333a88', pressed: '#6a6a72cc', text: '#f0f0f4', edge: null } },
  ];

  const RADIUS_PRESETS = [['5', '小圆角（默认）', 5], ['9', '中圆角', 9], ['16', '大圆角（药丸形）', 16], ['2', '几乎方正', 2]];

  // ---------- 遍历工具 ----------
  function collectKeyNames(doc) {
    const names = new Set();
    const walk = arr => {
      if (!Array.isArray(arr)) return;
      for (const item of arr) {
        if (item && item.Cell != null) names.add(item.Cell);
        if (item && item.HStack) walk(item.HStack.subviews);
        if (item && item.VStack) walk(item.VStack.subviews);
      }
    };
    for (const k of ['keyboardLayout', 'toolbarLayout', 'horizontalCandidatesLayout', 'verticalCandidatesLayout']) walk(doc[k]);
    return names;
  }

  // 判断一个键属于「主键」还是「功能键」
  function classifyKey(def) {
    const a = def.action;
    if (a == null) return 'main';
    if (typeof a === 'string') return a === 'space' ? 'main' : 'fn';
    if (typeof a === 'object') {
      if ('character' in a || 'symbol' in a) return 'main';
      return 'fn';
    }
    return 'main';
  }

  // 把主题应用到一个键盘文档（dark 决定用哪套配色）
  function applyThemeToDoc(doc, theme, dark, opts) {
    const T = dark ? theme.dark : theme.light;
    let imageKeys = 0;

    // 1) 键盘整体底色
    {
      let st = typeof doc.keyboardStyle?.backgroundStyle === 'string' ? doc[doc.keyboardStyle.backgroundStyle] : null;
      if (!st || st.buttonStyleType === 'fileImage') {
        doc.keyboardStyle = doc.keyboardStyle || {};
        const n = 'wizardKeyboardBg';
        doc[n] = doc[n] || {};
        st = doc[n];
        doc.keyboardStyle.backgroundStyle = n;
      }
      st.buttonStyleType = 'geometry';
      delete st.normalImage; delete st.highlightImage;
      st.normalColor = T.kb;
    }

    // 2) 统计每个背景样式被「主键 / 功能键」使用的情况
    const styleUse = {};
    for (const name of collectKeyNames(doc)) {
      const def = doc[name];
      if (!def || typeof def !== 'object' || def.type) continue;
      const cls = classifyKey(def);
      const ref = def.backgroundStyle;
      if (typeof ref === 'string') (styleUse[ref] = styleUse[ref] || new Set()).add(cls);
    }
    // 3) 给背景样式上色（图片背景跳过，避免破坏图片皮肤）
    for (const sn in styleUse) {
      const st = doc[sn];
      if (!st || typeof st !== 'object') continue;
      if (st.buttonStyleType === 'fileImage') { imageKeys++; continue; }
      const onlyFn = styleUse[sn].has('fn') && !styleUse[sn].has('main');
      st.buttonStyleType = 'geometry';
      st.normalColor = onlyFn ? T.fn : T.main;
      st.highlightColor = T.pressed;
      if (opts.radius != null) st.cornerRadius = opts.radius;
      if (T.edge) st.normalLowerEdgeColor = T.edge;
      else { delete st.normalLowerEdgeColor; delete st.highlightLowerEdgeColor; }
      if (opts.clearShadow) { delete st.normalShadowColor; delete st.highlightShadowColor; delete st.shadowOpacity; delete st.shadowRadius; }
    }

    // 4) 文字/图标统一改色（图片前景不动）
    const seen = new Set();
    for (const name of collectKeyNames(doc)) {
      const def = doc[name];
      if (!def || typeof def !== 'object' || def.type) continue;
      const refs = def.foregroundStyle == null ? [] : (Array.isArray(def.foregroundStyle) ? def.foregroundStyle : [def.foregroundStyle]);
      for (const rn of refs) {
        if (typeof rn !== 'string') continue;
        const st = doc[rn];
        if (!st || seen.has(st)) continue;
        seen.add(st);
        if (st.buttonStyleType === 'text' || st.text != null || st.buttonStyleType === 'systemImage') {
          st.normalColor = T.text;
          if (opts.weight) st.fontWeight = opts.weight;
        }
      }
      // 大写状态前景也跟着改
      const upRefs = def.uppercasedStateForegroundStyle == null ? [] : (Array.isArray(def.uppercasedStateForegroundStyle) ? def.uppercasedStateForegroundStyle : [def.uppercasedStateForegroundStyle]);
      for (const rn of upRefs) {
        if (typeof rn !== 'string') continue;
        const st = doc[rn];
        if (!st || seen.has(st)) continue;
        seen.add(st);
        if (st.buttonStyleType === 'text' || st.text != null) st.normalColor = T.text;
      }
    }

    // 5) 候选栏配色（让候选字也协调）
    for (const csName in doc) {
      const cs = doc[csName];
      if (!cs || typeof cs !== 'object') continue;
      if (cs.textColor !== undefined || cs.preferredTextColor !== undefined) {
        cs.textColor = T.text;
        cs.preferredTextColor = dark ? '#7fb0ff' : '#2f6fed';
        if (cs.preferredIndexColor !== undefined) cs.preferredIndexColor = cs.preferredTextColor;
      }
    }
    // 预编辑文字色
    for (const pn in doc) {
      const p = doc[pn];
      if (p && typeof p === 'object' && p.textColor !== undefined && p.fontSize !== undefined && p.buttonStyleType === undefined) {
        p.textColor = T.text;
      }
    }
    return { imageKeys };
  }

  // 应用主题到整套皮肤（所有键盘 + 浅色/深色），返回统计
  function applyTheme(theme, opts) {
    let boards = 0, imageKeys = 0;
    App.batchEdit(m => {
      for (const dark of [false, true]) {
        const mode = dark ? 'dark' : 'light';
        for (const name in m.docs[mode]) {
          const doc = m.docs[mode][name];
          if (!doc || doc.__parseError) continue;
          const r = applyThemeToDoc(doc, theme, dark, opts);
          imageKeys += r.imageKeys;
          boards++;
        }
      }
    });
    return { boards: boards / 2, imageKeys };
  }

  // ---------- 向导界面 ----------
  const state = { theme: 'ios', radius: 5, weight: '', anim: null, random: false };

  function open() {
    if (!M().loaded) { startNew(); return; }
    step2Theme();
  }

  // 没有皮肤时先建一个
  function startNew() {
    const m = UI.modal('第 1 步 · 先建一个键盘底子', '460px');
    m.body.appendChild(el('div', 'hint-line', '你要做哪种中文键盘？（之后随时能加别的键盘）'));
    const opts = [
      ['t26', '全键盘（26 键）', '就是最常见的 QWERTY 拼音键盘，推荐新手'],
      ['t9', '中文九键（T9）', '微信那种 3×3 九宫格。注意：手机上还要启用「中文九键」输入方案才能打字'],
    ];
    for (const [kind, lab, desc] of opts) {
      const b = button('', async () => {
        m.close();
        await SkinModel.newSkin(kind === 't9');
        App.afterLoad();
        toast('底子建好了，来挑个配色吧');
        setTimeout(step2Theme, 150);
      }, 'pick-item');
      b.innerHTML = `<b>${lab}</b><br><span style="opacity:.65;font-size:12px">${desc}</span>`;
      m.body.appendChild(b);
    }
  }

  // 第 2 步：挑配色
  function step2Theme() {
    const m = UI.modal('第 2 步 · 挑一个配色（点一下立即套用预览）', '520px');
    m.body.appendChild(el('div', 'hint-line', '点任意配色卡片，预览会马上变。浅色和深色两种模式会一起配好，手机切夜间模式也好看。'));
    const grid = el('div', 'wiz-theme-grid');
    for (const t of THEMES) {
      const card = el('button', 'wiz-theme-card');
      const dark = Renderer.state.mode === 'dark';
      const T = dark ? t.dark : t.light;
      card.innerHTML =
        `<div class="wiz-swatch" style="background:${cssColor(T.kb)}">
           <span class="wiz-k" style="background:${cssColor(T.main)};color:${cssColor(T.text)}">A</span>
           <span class="wiz-k" style="background:${cssColor(T.fn)};color:${cssColor(T.text)}">⌫</span>
         </div>
         <div class="wiz-theme-name">${t.emoji} ${t.name}</div>
         <div class="wiz-theme-tag">${t.tag}</div>`;
      card.onclick = () => {
        state.theme = t.id;
        applyTheme(t, { radius: state.radius, weight: state.weight, clearShadow: false });
        [...grid.children].forEach(c => c.classList.remove('sel'));
        card.classList.add('sel');
        toast(`已套用「${t.name}」`);
      };
      if (t.id === state.theme) card.classList.add('sel');
      grid.appendChild(card);
    }
    m.body.appendChild(grid);
    const foot = el('div', 'wiz-foot');
    foot.appendChild(button('下一步：调整细节 →', () => { m.close(); step3Tweak(); }, 'btn primary'));
    m.body.appendChild(foot);
  }

  // 第 3 步：圆角 / 粗细 / 动画 / 随机按下色
  function step3Tweak() {
    const m = UI.modal('第 3 步 · 调整细节（都可跳过）', '480px');
    const theme = THEMES.find(t => t.id === state.theme) || THEMES[0];

    m.body.appendChild(field('按键圆角', UI.selectInput(String(state.radius), RADIUS_PRESETS.map(r => [r[0], r[1]]), v => {
      state.radius = Number(v);
      applyTheme(theme, { radius: state.radius, weight: state.weight });
    })));

    m.body.appendChild(field('字体粗细', UI.selectInput(state.weight, [
      ['', '默认'], ['regular', '常规'], ['medium', '中等'], ['semibold', '半粗'], ['bold', '粗体'],
    ], v => {
      state.weight = v;
      applyTheme(theme, { radius: state.radius, weight: state.weight });
    })));

    const animBox = el('div');
    animBox.appendChild(button('✨ 给所有键加「按下动画」', () => {
      Inspector.openAnimPresetPicker(p => {
        const an = p.id + 'Animation';
        const r = App.applyAnimationEverywhere({ [an]: p.def }, 'all');
        toast(`已给 ${r.keys} 个键加上「${p.name}」，按住预览里的键看看`);
      });
    }, 'btn small'));
    animBox.appendChild(button('🎲 每个键随机按下色', () => {
      document.getElementById('btnRandomPress')?.click();
    }, 'btn small'));
    m.body.appendChild(field('好玩的效果（可选）', animBox));

    const foot = el('div', 'wiz-foot');
    foot.appendChild(button('← 上一步', () => { m.close(); step2Theme(); }, 'btn'));
    foot.appendChild(button('下一步：起名并导出 →', () => { m.close(); step4Export(); }, 'btn primary'));
    m.body.appendChild(foot);
  }

  // 第 4 步：命名 + 导出
  function step4Export() {
    const m = UI.modal('第 4 步 · 起个名字，导出到手机', '480px');
    const cfg = M().config = M().config || {};
    m.body.appendChild(field('皮肤名称', UI.textInput(cfg.name || '我的皮肤', v => {
      App.batchEdit(mm => { if (v) mm.config.name = v; });
    })));
    m.body.appendChild(field('作者（可留空）', UI.textInput(cfg.author || '', v => {
      App.batchEdit(mm => { if (v) mm.config.author = v; else delete mm.config.author; });
    })));
    m.body.appendChild(el('div', 'hint-line',
      '点下面「导出」后：\n' +
      '· 电脑：会下载一个 .cskin 文件，传到手机用元书「皮肤→导入」\n' +
      '· 手机：会弹出保存面板，选「存到文件」，再用元书导入即可\n\n' +
      '想继续精调某个键？关掉这个向导，直接点预览里的键就能改。'));
    const foot = el('div', 'wiz-foot');
    foot.appendChild(button('← 上一步', () => { m.close(); step3Tweak(); }, 'btn'));
    foot.appendChild(button('📦 导出皮肤', () => { m.close(); App.exportFile(); }, 'btn primary'));
    m.body.appendChild(foot);
  }

  // 颜色值 → 预览用 CSS（借用渲染器的解析，支持 8 位含透明度）
  function cssColor(v) { return Renderer.parseColor(v) || v; }

  return { open, THEMES, applyTheme };
})();

<script>
/* =========================================================
 * main.js — 应用主逻辑：状态 / 撤销重做 / 事件 / 页面组织
 * ========================================================= */
'use strict';

const App = (() => {
  const { el, button, toast } = UI;
  const M = () => SkinModel.model;

  const app = {
    selection: null,       // 当前选中的按键名
    layoutArea: 'keyboardLayout',
    sourceFile: null,
    leftTab: 'files',
    syncModes: true,       // 修改同步到另一个明暗模式（默认开，避免"手机深色模式看不到修改"）
    undoStack: [],
    redoStack: [],
    _pendingSnap: null,
  };

  // ---------- 当前文档 ----------
  function currentDoc(mode) {
    const m = mode || Renderer.state.mode;
    const name = Renderer.state.docName;
    if (!name) return null;
    return M().docs[m][name] || null;
  }
  function otherDoc() {
    const other = Renderer.state.mode === 'light' ? 'dark' : 'light';
    return currentDoc(other);
  }

  // ---------- 编辑入口 ----------
  // edit(fn) —— fn(doc) 修改当前文档；edit(null, rawFn) —— 直接修改（config 等）
  function edit(fn, rawFn) {
    pushUndo();
    try {
      if (fn) {
        const doc = currentDoc();
        if (doc) {
          fn(doc);
          M().docDirty[Renderer.state.mode].add(Renderer.state.docName);
          if (app.syncModes) {
            const od = otherDoc();
            if (od) {
              try {
                fn(od);
                M().docDirty[Renderer.state.mode === 'light' ? 'dark' : 'light'].add(Renderer.state.docName);
              } catch (e) { console.warn('同步到另一模式失败', e); }
            }
          }
        }
      }
      if (rawFn) rawFn();
    } catch (e) {
      console.error(e);
      toast('修改失败：' + e.message, true);
    }
    renderPreview();
    updateTitle();
  }

  // 不经过 edit 的修改后手动提交
  function commit() {
    pushUndo();
    if (Renderer.state.docName) M().docDirty[Renderer.state.mode].add(Renderer.state.docName);
    renderPreview();
    updateTitle();
  }

  // 整套批量编辑（向导/一键换肤用）：一次撤销点，fn 直接改整个 model，改完全量刷新
  function batchEdit(fn) {
    pushUndo();
    try { fn(M()); }
    catch (e) { console.error(e); toast('操作失败：' + e.message, true); }
    for (const mode of ['light', 'dark']) for (const n in M().docs[mode]) M().docDirty[mode].add(n);
    M().configDirty = true;
    renderAll();
  }

  // 布局结构编辑（布局树专用）：mut 只应用一次，避免 edit() 在开启「明暗同步改」时
  // 重复执行导致「加一个键变两个 / 上下移动交换两次=无效 / 删一项删两项」。
  // 应用后把布局结构镜像到另一模式，保证浅色/深色排版完全一致。
  const LAYOUT_AREAS = ['keyboardLayout', 'toolbarLayout', 'horizontalCandidatesLayout', 'verticalCandidatesLayout'];
  function editLayout(mut) {
    pushUndo();
    try {
      const doc = currentDoc();
      if (!doc) return;
      mut();  // 只跑一次
      const mode = Renderer.state.mode, name = Renderer.state.docName;
      M().docDirty[mode].add(name);
      if (app.syncModes) {
        const od = otherDoc();
        if (od && !od.__parseError) {
          for (const area of LAYOUT_AREAS) {
            if (Array.isArray(doc[area])) od[area] = JSON.parse(JSON.stringify(doc[area]));
            else if (doc[area] === undefined) delete od[area];
          }
          // 布局里 HStack/VStack 引用的尺寸样式（stackStyleN 等）也复制过去，
          // 否则另一模式会引用到不存在的样式
          syncStackStyles(doc, od);
          M().docDirty[mode === 'light' ? 'dark' : 'light'].add(name);
        }
      }
    } catch (e) { console.error(e); toast('修改失败：' + e.message, true); }
    renderPreview();
    updateTitle();
  }
  function syncStackStyles(src, dst) {
    const used = new Set();
    const walk = arr => {
      if (!Array.isArray(arr)) return;
      for (const it of arr) {
        if (it && it.HStack) { if (typeof it.HStack.style === 'string') used.add(it.HStack.style); walk(it.HStack.subviews); }
        if (it && it.VStack) { if (typeof it.VStack.style === 'string') used.add(it.VStack.style); walk(it.VStack.subviews); }
      }
    };
    for (const area of LAYOUT_AREAS) walk(src[area]);
    for (const n of used) if (src[n] && dst[n] === undefined) dst[n] = JSON.parse(JSON.stringify(src[n]));
  }

  // ---------- 撤销 / 重做 ----------
  function pushUndo() {
    try {
      const snap = SkinModel.snapshot();
      if (app.undoStack.length && app.undoStack[app.undoStack.length - 1] === snap) return;
      app.undoStack.push(snap);
      if (app.undoStack.length > 60) app.undoStack.shift();
      app.redoStack.length = 0;
    } catch (e) { console.warn('快照失败', e); }
  }
  function undo() {
    if (!app.undoStack.length) { toast('没有可撤销的操作'); return; }
    app.redoStack.push(SkinModel.snapshot());
    SkinModel.restore(app.undoStack.pop());
    afterHistoryJump();
  }
  function redo() {
    if (!app.redoStack.length) { toast('没有可重做的操作'); return; }
    app.undoStack.push(SkinModel.snapshot());
    SkinModel.restore(app.redoStack.pop());
    afterHistoryJump();
  }
  function afterHistoryJump() {
    if (Renderer.state.docName && !currentDoc()) Renderer.state.docName = Object.keys(M().docs[Renderer.state.mode])[0] || null;
    renderPreview();
    refreshLeftPanel();
    refreshInspector();
    updateTitle();
  }

  // ---------- 渲染 ----------
  function renderPreview() {
    applyAutoZoom();
    const canvas = document.getElementById('previewCanvas');
    const overlay = document.getElementById('overlayCanvas');
    const doc = currentDoc();
    const empty = document.getElementById('previewEmpty');
    if (!doc || doc.__parseError) {
      canvas.style.display = 'none';
      overlay.style.display = 'none';
      empty.style.display = '';
      empty.textContent = !doc ? '（这个模式下没有此键盘文件）'
        : 'YAML 解析失败，请到「源码」页修复：' + doc.__parseError;
      updateShell(false);
      return;
    }
    canvas.style.display = '';
    overlay.style.display = '';
    empty.style.display = 'none';
    try {
      Renderer.render(canvas, doc);
      Renderer.drawOverlay(overlay, app.selection);
      updateShell(true);
    } catch (e) {
      console.error(e);
      empty.style.display = '';
      empty.textContent = '渲染出错：' + e.message;
      updateShell(false);
    }
  }

  // ---------- iPhone 17 Pro Max 仿真壳 ----------
  function updateShell(hasCanvas) {
    const shell = document.getElementById('phoneShell');
    const screenEl = document.getElementById('phoneScreen');
    const psApp = document.getElementById('psApp');
    const chk = document.getElementById('chkShell');
    const z = Renderer.state.zoom;
    const active = hasCanvas && chk.checked &&
      Renderer.state.device === 'iPhone' && Renderer.state.orientation === 'portrait';

    shell.style.setProperty('--z', z);
    shell.dataset.kb = Renderer.state.mode;
    shell.classList.toggle('bare', !active);
    if (!active) {
      screenEl.style.width = '';
      psApp.style.height = '';
      return;
    }
    const cssW = Renderer.layoutSize.w * z;
    const cssH = Renderer.layoutSize.h * z;
    const screenH = Renderer.DEVICES['iPhone-portrait'].h * z;
    const border = 9 * z;
    screenEl.style.width = (cssW + border * 2) + 'px';
    const topEl = document.getElementById('psTop');
    const topH = topEl.offsetHeight;
    psApp.style.height = Math.max(60 * z, screenH - topH - cssH) + 'px';
    // 输入框里显示预编辑文字，更有输入中的感觉
    const ft = document.getElementById('psFieldText');
    if (ft) ft.textContent = Renderer.state.barMode === 'toolbar' ? 'iMessage 信息' : Renderer.state.sample.preedit;
  }

  // ---------- 移动端自动适配 ----------
  function isNarrowViewport() {
    return window.matchMedia && window.matchMedia('(max-width: 900px)').matches;
  }

  function isAutoZoom() {
    const sel = document.getElementById('selZoom');
    return sel && sel.value === 'auto';
  }

  function previewHeightValue(v, fallback) {
    if (v == null) return fallback;
    if (typeof v === 'number') return v;
    const s = String(v).trim();
    const scr = Renderer.DEVICES[`${Renderer.state.device}-${Renderer.state.orientation}`] || Renderer.DEVICES['iPhone-portrait'];
    if (s.endsWith('vh')) return scr.h * parseFloat(s) / 100;
    if (s.endsWith('dvh')) return scr.h * parseFloat(s) / 100;
    const f = parseFloat(s);
    return isFinite(f) ? f : fallback;
  }

  function applyAutoZoom() {
    if (!isAutoZoom()) return;
    const center = document.getElementById('center');
    if (!center) return;
    const doc = currentDoc();
    const scr = Renderer.DEVICES[`${Renderer.state.device}-${Renderer.state.orientation}`] || Renderer.DEVICES['iPhone-portrait'];
    let previewW = scr.w;
    let previewH = 260;
    if (doc && !doc.__parseError) {
      previewH = previewHeightValue(doc.preeditHeight, 0) +
        previewHeightValue(doc.toolbarHeight, 0) +
        previewHeightValue(doc.keyboardHeight, 220);
    }
    const shellOn = doc && !doc.__parseError && document.getElementById('chkShell')?.checked &&
      Renderer.state.device === 'iPhone' && Renderer.state.orientation === 'portrait';
    if (shellOn) {
      previewW = scr.w + 24;
      previewH = Renderer.DEVICES['iPhone-portrait'].h + 24;
    }
    const availW = Math.max(220, center.clientWidth - 18);
    const availH = Math.max(160, center.clientHeight - 18);
    const z = Math.min(availW / Math.max(1, previewW), availH / Math.max(1, previewH));
    Renderer.state.zoom = Math.max(0.25, Math.min(1.25, z));
  }

  function setupMobileViewportDefaults() {
    if (!isNarrowViewport()) return;
    const zoomSel = document.getElementById('selZoom');
    if (zoomSel) zoomSel.value = 'auto';
    // 手机上编辑时套完整手机壳会把键盘压得过小，默认关闭；需要机身预览可手动再开。
    const shell = document.getElementById('chkShell');
    if (shell) shell.checked = false;
  }


  // ---------- 按键动画播放引擎 ----------
  const Anim = { raf: null, key: null, anims: [], t0: 0, releasedT: null, autoReleaseAt: null, rand: null };

  const normDur = d => {
    const n = Number(d);
    if (!isFinite(n) || n <= 0) return 100;
    return n < 5 ? n * 1000 : n;   // 兼容"秒"写法（如 0.85）
  };
  const lerp = (a, b, p) => a + (b - a) * p;
  const clamp01 = p => Math.max(0, Math.min(1, p));

  function resolveAnims(doc, keyName) {
    const def = doc[keyName];
    if (!def || def.type) return [];
    const names = def.animation == null ? [] : (Array.isArray(def.animation) ? def.animation : [def.animation]);
    return names.map(n => (typeof n === 'string' ? doc[n] : n)).filter(a => a && a.animationType);
  }

  // 帧调度：页面在后台时 requestAnimationFrame 不触发，退化为定时器
  function schedAnimTick() {
    if (document.hidden) {
      Anim.raf = setTimeout(() => animTick(performance.now()), 33);
      Anim.rafIsTimer = true;
    } else {
      Anim.raf = requestAnimationFrame(animTick);
      Anim.rafIsTimer = false;
    }
  }

  function startPressAnim(keyName, opts = {}) {
    const doc = currentDoc();
    if (!doc) return;
    Anim.key = keyName;
    Anim.anims = resolveAnims(doc, keyName);
    Anim.t0 = performance.now();
    Anim.releasedT = null;
    Anim.autoReleaseAt = opts.autoRelease ? Anim.t0 + 200 : null;
    // 每次按下重掷随机数（物理动画的随机位置/角度/选图）
    Anim.rand = { x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, a: Math.random() * 2 - 1, img: Math.random() };
    if (!Anim.raf && Anim.anims.length) schedAnimTick();
    if (!Anim.anims.length) renderPreview();
  }

  function releasePressAnim() {
    if (Anim.key && Anim.releasedT == null) Anim.releasedT = performance.now();
  }

  function animTick(now) {
    Anim.raf = null;
    if (!Anim.key) { Renderer.state.pressAnim = null; renderPreview(); return; }
    if (Anim.autoReleaseAt && now >= Anim.autoReleaseAt && Anim.releasedT == null) {
      Anim.releasedT = Anim.autoReleaseAt;
      if (Renderer.state.highlightKey === Anim.key) Renderer.state.highlightKey = null;
    }
    const pressed = Anim.releasedT == null;
    const el = now - Anim.t0;                    // 按下起的毫秒数
    const relEl = pressed ? 0 : now - Anim.releasedT;

    let scale = null;
    const overlays = [];
    let anyActive = false;

    for (const a of Anim.anims) {
      const t = a.animationType;
      if (t === 'scale') {
        const target = a.scale != null ? Number(a.scale) : 0.95;
        const press = normDur(a.pressDuration), release = normDur(a.releaseDuration);
        let s;
        if (a.isAutoReverse) {
          // 连贯：缩小→立即放大，一次播完
          if (el < press) { s = lerp(1, target, el / press); anyActive = true; }
          else if (el < press + release) { s = lerp(target, 1, (el - press) / release); anyActive = true; }
          else s = 1;
        } else {
          // 分离：按住期间缩小并保持，松开后放大
          if (pressed) { s = lerp(1, target, clamp01(el / press)); anyActive = true; }
          else {
            const p = clamp01(relEl / release);
            s = lerp(target, 1, p);
            if (p < 1) anyActive = true;
          }
        }
        scale = scale == null ? s : Math.min(scale, s);
      } else if (t === 'cartoon') {
        const imgs = a.images || [];
        if (!imgs.length) continue;
        const fps = Number(a.fps) || 30;
        const idx = Math.floor(el / (1000 / fps));
        if (idx < imgs.length) {
          overlays.push({ imgName: String(imgs[idx]).replace(/\.png$/i, ''), x: 0, y: 0, scale: a.targetScale != null ? Number(a.targetScale) : 1, alpha: 1 });
          anyActive = true;
        }
      } else if (t === 'physics') {
        const imgs = a.images || [];
        if (!imgs.length) continue;
        const dur = normDur(a.duration || 600);
        const p = clamp01(el / dur);
        if (p < 1) {
          const pick = a.randomImage ? Math.floor(Anim.rand.img * imgs.length) : 0;
          const sp = a.startPosition || { x: 0, y: 0 }, ep = a.endPosition || { x: 0, y: 0 };
          const rp = a.randomPosition || { x: 0, y: 0 };
          const rx = Anim.rand.x * Number(rp.x || 0), ry = Anim.rand.y * Number(rp.y || 0);
          const x = lerp(Number(sp.x || 0) + rx, Number(ep.x || 0) + rx, p);
          const y = lerp(Number(sp.y || 0) + ry, Number(ep.y || 0) + ry, p);
          const alpha = a.useOpacity ? lerp(a.startOpacity != null ? Number(a.startOpacity) : 1, a.endOpacity != null ? Number(a.endOpacity) : 0.8, p) : 1;
          const baseAngle = Number(a.startAngle || 0) + Anim.rand.a * Number(a.randomAngle || 0);
          const angle = a.useRotation ? lerp(baseAngle, Number(a.endAngle || 0), p) : 0;
          overlays.push({ imgName: String(imgs[pick]).replace(/\.png$/i, ''), x, y, scale: a.targetScale != null ? Number(a.targetScale) : 1, alpha, angle });
          anyActive = true;
        }
      }
    }

    Renderer.state.pressAnim = { key: Anim.key, scale, overlays };
    renderPreview();

    if (anyActive || pressed) {
      schedAnimTick();
    } else {
      // 播完收尾
      Anim.key = null;
      Renderer.state.pressAnim = null;
      renderPreview();
    }
  }

  // 「试玩」：模拟按一下（选中键），立即看动画效果
  function testAnimation(keyName) {
    const doc = currentDoc();
    if (!doc || !keyName) { toast('先在预览里选中一个按键', true); return; }
    if (!resolveAnims(doc, keyName).length) {
      toast('这个键还没有动画。在右侧「按键动画」里添加一个再试', true);
      return;
    }
    Renderer.state.highlightKey = keyName;
    startPressAnim(keyName, { autoRelease: true });
  }

  // ---------- 跨键盘批量应用动画 ----------
  function collectLayoutKeys(d) {
    const names = new Set();
    const walk = arr => {
      if (!Array.isArray(arr)) return;
      for (const item of arr) {
        if (item && item.Cell != null) names.add(item.Cell);
        if (item && item.HStack) walk(item.HStack.subviews);
        if (item && item.VStack) walk(item.VStack.subviews);
      }
    };
    walk(d.keyboardLayout);
    return names;
  }

  // ---------- 横屏分体键盘 ----------
  // 把每一行从中点拆成左右两半，中间插一段透明间隔；奇数行把中间那颗键左右各放一份
  // （照 iOS 原生分体：g/h、v/b 两边都有）。整行按键等比缩小，腾出中间空档。
  const SPLIT_GAP_CELL = 'splitGapButton';
  const SPLIT_GAP_STYLE = 'splitGapStyle';
  function splitFracToNum(w) {
    if (w == null) return null;
    if (typeof w === 'number') return w;
    const s = String(w).trim();
    if (s.includes('/')) { const [a, b] = s.split('/'); const n = parseFloat(a), d = parseFloat(b); return (isFinite(n) && isFinite(d) && d) ? n / d : null; }
    const f = parseFloat(s); return isFinite(f) ? f : null;
  }
  function splitNumToFrac(v) { return (Math.round(v * 1125 * 1000) / 1000) + '/1125'; }
  function splitScaleWidth(w, k) {
    const s = String(w);
    if (s.includes('/')) { const [a, b] = s.split('/'); return (Math.round(parseFloat(a) * k * 1000) / 1000) + '/' + b; }
    return splitNumToFrac(splitFracToNum(w) * k);
  }
  function splitRowSubviews(subs, doc, gap, dup) {
    if (!Array.isArray(subs) || subs.length < 2) return null;
    if (subs.some(s => s && s.Cell === SPLIT_GAP_CELL)) return null; // 已经是分体
    const n = subs.length;
    const leftCount = Math.ceil(n / 2);
    const rightStart = dup ? Math.floor(n / 2) : Math.ceil(n / 2);
    const left = subs.slice(0, leftCount);
    const right = subs.slice(rightStart);
    // 全是固定宽度的键 → 等比缩小腾出空档；含弹性键（如空格）→ 不缩，弹性键自动吸收剩余空间
    const refs = [...left, ...right].filter(s => s && s.Cell != null);
    const widths = refs.map(s => { const def = doc[s.Cell]; return def && def.size ? splitFracToNum(def.size.width) : null; });
    const hasFlex = widths.some(w => w == null);
    if (!hasFlex) {
      const Tf = widths.reduce((a, b) => a + (b || 0), 0);
      if (Tf > 0) {
        const scale = (1 - gap) / Tf;
        const done = new Set();
        for (const s of refs) {
          if (done.has(s.Cell)) continue; done.add(s.Cell);
          const def = doc[s.Cell];
          if (def && def.size && def.size.width != null) def.size.width = splitScaleWidth(def.size.width, scale);
        }
      }
    }
    return [...left, { Cell: SPLIT_GAP_CELL }, ...right];
  }
  function splitDocKeyboard(doc, gap, dup) {
    if (!doc || doc.__parseError || !Array.isArray(doc.keyboardLayout)) return false;
    let changed = false;
    const newLayout = doc.keyboardLayout.map(row => {
      const kind = row && row.HStack ? 'HStack' : (row && row.VStack ? 'VStack' : null);
      if (!kind) return row;
      const cont = row[kind];
      const ns = splitRowSubviews(cont.subviews || [], doc, gap, dup);
      if (!ns) return row;
      changed = true;
      return { [kind]: Object.assign({}, cont, { subviews: ns }) };
    });
    if (!changed) return false;
    doc[SPLIT_GAP_STYLE] = { buttonStyleType: 'geometry', normalColor: '#00000000' };
    doc[SPLIT_GAP_CELL] = { size: { width: splitNumToFrac(gap) }, backgroundStyle: SPLIT_GAP_STYLE, action: { character: '' } };
    doc.keyboardLayout = newLayout;
    return true;
  }
  // scope: 'current' 只当前键盘 | 'landscape' 所有横屏键盘（名字含 landscape）
  function splitKeyboard(opts) {
    opts = opts || {};
    const gap = opts.gap != null ? opts.gap : 0.14;
    const dup = opts.dup !== false;
    const m = M();
    let names;
    if (opts.scope === 'landscape') {
      names = [...new Set([...Object.keys(m.docs.light), ...Object.keys(m.docs.dark)])].filter(n => /landscape/i.test(n));
    } else {
      names = [Renderer.state.docName].filter(Boolean);
    }
    if (!names.length) return { boards: 0, names: [] };
    pushUndo();
    let boards = 0;
    const done = [];
    for (const name of names) {
      let any = false;
      for (const mode of ['light', 'dark']) {
        if (splitDocKeyboard(m.docs[mode][name], gap, dup)) { m.docDirty[mode].add(name); any = true; }
      }
      if (any) { boards++; done.push(name); }
    }
    renderAll();
    return { boards, names: done };
  }

  // 把新的动画/特效引用合并进 def.animation：只替换"同类"（动画=scale；特效=cartoon/physics），
  // 保留另一类，这样"按键动画"和"按键特效"能共存于同一个键。
  function animRefKind(d, n) {
    const a = (typeof n === 'string') ? d[n] : n;
    return (a && (a.animationType === 'cartoon' || a.animationType === 'physics')) ? 'fx' : 'anim';
  }
  function mergeAnimRefs(d, def, newNames) {
    const newKinds = new Set(newNames.map(n => animRefKind(d, n)));
    const cur = def.animation == null ? [] : (Array.isArray(def.animation) ? def.animation : [def.animation]);
    const kept = cur.filter(n => !newKinds.has(animRefKind(d, n)) && !newNames.includes(n));
    const merged = [...kept, ...newNames];
    if (merged.length) def.animation = merged; else delete def.animation;
  }

  // defsMap: {动画名: 动画定义对象}；scope: 'all' 所有键盘 | 'current' 当前键盘
  // 把动画定义写进每个键盘文件（浅+深），并让每个按键引用它（保留已有的按键特效）
  function applyAnimationEverywhere(defsMap, scope) {
    const m = M();
    const animNames = Object.keys(defsMap);
    if (!animNames.length) return { keys: 0, boards: 0 };
    pushUndo();
    let keys = 0, boards = 0;
    const docNames = scope === 'current'
      ? [Renderer.state.docName]
      : [...new Set([...Object.keys(m.docs.light), ...Object.keys(m.docs.dark)])];
    for (const mode of ['light', 'dark']) {
      for (const name of docNames) {
        const d = m.docs[mode][name];
        if (!d || d.__parseError) continue;
        boards++;
        for (const an of animNames) d[an] = JSON.parse(JSON.stringify(defsMap[an]));
        for (const k of collectLayoutKeys(d)) {
          const def = d[k];
          if (!def || typeof def !== 'object' || def.type) continue;
          mergeAnimRefs(d, def, animNames); // 保留已有特效，只替换同类动画
          keys++;
        }
        m.docDirty[mode].add(name);
      }
    }
    SkinModel.markAnimationDirty();
    renderAll();
    return { keys, boards: boards / 2 };
  }

  // 移除动画；scope 同上
  function removeAnimationEverywhere(scope) {
    const m = M();
    pushUndo();
    let keys = 0;
    const docNames = scope === 'current'
      ? [Renderer.state.docName]
      : [...new Set([...Object.keys(m.docs.light), ...Object.keys(m.docs.dark)])];
    for (const mode of ['light', 'dark']) {
      for (const name of docNames) {
        const d = m.docs[mode][name];
        if (!d || d.__parseError) continue;
        for (const k of collectLayoutKeys(d)) {
          const def = d[k];
          if (def && typeof def === 'object' && def.animation) { delete def.animation; keys++; }
        }
        m.docDirty[mode].add(name);
      }
    }
    SkinModel.markAnimationDirty();
    renderAll();
    return keys;
  }

  // ---------- 按键特效参考库（cartoon/physics 图片特效） ----------
  // dataURI(png/webp) -> PNG 字节（元书资源需要 PNG）
  function dataUriToPngBytes(uri) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext('2d').drawImage(img, 0, 0);
        c.toBlob(b => { if (!b) { reject(new Error('convert fail')); return; } b.arrayBuffer().then(ab => resolve(new Uint8Array(ab))); }, 'image/png');
      };
      img.onerror = () => reject(new Error('特效图片解码失败'));
      img.src = uri;
    });
  }
  // scope: 'all' 所有键盘全部按键 | 'current' 当前键盘全部按键 | 'key' 当前选中的键
  // customDef: 可选，自定义后的特效参数（会带上 fx 的 images）
  async function applyEffectPreset(fx, scope, customDef) {
    const m = M();
    pushUndo();
    // 1) 特效图片加入资源（浅+深）
    for (const fr of fx.frames) {
      const bytes = await dataUriToPngBytes(fr.dataURI);
      const rname = fr.name.replace(/\.png$/i, '');
      for (const mode of ['light', 'dark']) await SkinModel.setResourceImage(mode, rname, bytes);
    }
    // 2) 特效定义 + 给按键挂上（保留已有的按键动画，二者共存）
    const theDef = customDef ? Object.assign({}, customDef, { images: fx.def.images.slice() }) : fx.def;
    const defName = fx.defName || ('fxEffect_' + fx.id);
    let docNames, keyFilter = null;
    if (scope === 'key') { docNames = [Renderer.state.docName]; keyFilter = new Set([app.selection]); }
    else if (scope === 'current') docNames = [Renderer.state.docName];
    else docNames = [...new Set([...Object.keys(m.docs.light), ...Object.keys(m.docs.dark)])];
    let keys = 0;
    for (const mode of ['light', 'dark']) {
      for (const name of docNames) {
        const d = m.docs[mode][name]; if (!d || d.__parseError) continue;
        d[defName] = JSON.parse(JSON.stringify(theDef));
        const targets = keyFilter ? [...keyFilter] : collectLayoutKeys(d);
        for (const k of targets) { const def = d[k]; if (!def || typeof def !== 'object' || def.type) continue; mergeAnimRefs(d, def, [defName]); keys++; }
        m.docDirty[mode].add(name);
      }
    }
    SkinModel.markAnimationDirty();
    renderAll();
    return { keys };
  }

  // ---------- 随机按下色 ----------
  function randHex() {
    const h = Math.random() * 360, s = 0.75 + Math.random() * 0.25, l = 0.55 + Math.random() * 0.15;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const to255 = x => Math.round(255 * x).toString(16).padStart(2, '0');
    return '#' + to255(f(0)) + to255(f(8)) + to255(f(4));
  }

  function applyRandomPressColors() {
    const m = M();
    const docNames = [...new Set([...Object.keys(m.docs.light), ...Object.keys(m.docs.dark)])];
    if (!docNames.length) { toast('先导入或新建皮肤', true); return; }
    // 同一个键名在所有键盘/浅深里用同一个随机色，保持一致
    const colorFor = {};
    const pick = kn => colorFor[kn] || (colorFor[kn] = randHex());
    let done = 0, skipped = 0;
    pushUndo();
    for (const mode of ['light', 'dark']) {
      for (const name of docNames) {
        const d = m.docs[mode][name];
        if (!d || d.__parseError || !Array.isArray(d.keyboardLayout)) continue;
        let touched = false;
        for (const kn of collectLayoutKeys(d)) {
          const def = d[kn];
          if (!def || typeof def !== 'object' || def.type) continue; // 跳过集合视图
          const st = Inspector.ensureUniqueStyle(d, kn, def, 'backgroundStyle');
          if (!st) { skipped++; continue; }
          if ((st.buttonStyleType || 'geometry') === 'fileImage') { skipped++; continue; } // 图片背景保持原样
          if ((st.buttonStyleType || 'geometry') !== 'geometry') st.buttonStyleType = 'geometry';
          st.highlightColor = pick(kn);
          done++; touched = true;
        }
        if (touched) m.docDirty[mode].add(name);
      }
    }
    renderAll();
    toast(`已给所有键盘（拼音/数字/符号/横竖屏/iPad）共 ${done} 处按键设置随机按下色${skipped ? `，跳过 ${skipped} 个图片背景键` : ''}。所有键盘类型都生效，导出后手机一样`);
  }

  // 取消全部键盘按键的"按下颜色"（撤销随机色/按下色）
  function clearAllPressColors() {
    const m = M();
    const docNames = [...new Set([...Object.keys(m.docs.light), ...Object.keys(m.docs.dark)])];
    if (!docNames.length) { toast('先导入或新建皮肤', true); return; }
    if (!confirm('取消所有键盘全部按键的"按下颜色"吗？（按键底色不动，只清掉按下时变的那个颜色，可撤销）')) return;
    pushUndo();
    let n = 0;
    for (const mode of ['light', 'dark']) {
      for (const name of docNames) {
        const d = m.docs[mode][name];
        if (!d || d.__parseError || !Array.isArray(d.keyboardLayout)) continue;
        const seen = new Set();
        let touched = false;
        for (const kn of collectLayoutKeys(d)) {
          const def = d[kn];
          if (!def || typeof def !== 'object' || def.type) continue;
          const ref = def.backgroundStyle;
          const st = typeof ref === 'string' ? d[ref] : (ref && !Array.isArray(ref) ? ref : null);
          if (st && !seen.has(st)) { seen.add(st); if (st.highlightColor != null) { delete st.highlightColor; n++; touched = true; } }
        }
        if (touched) m.docDirty[mode].add(name);
      }
    }
    renderAll();
    toast(`已取消 ${n} 处按键的按下颜色`);
  }

  // ---------- 回车键"变化时"文字颜色统一（修复变化时文字色和普通键不一致）----------
  function fgStyleObjs(d, ref) {
    const out = [];
    if (ref == null) return out;
    if (typeof ref === 'string') { const s = d[ref]; if (s && typeof s === 'object') out.push(s); }
    else if (Array.isArray(ref)) { for (const it of ref) { if (!it || typeof it !== 'object') continue; if (it.styleName) { const s = d[it.styleName]; if (s && typeof s === 'object') out.push(s); } else out.push(it); } }
    else if (typeof ref === 'object') out.push(ref);
    return out;
  }
  // 取"键盘普通文字颜色"：优先普通字母键的前景 normalColor
  function sampleKeyboardTextColor(d) {
    const colorOf = kn => {
      const dd = d[kn]; if (!dd || typeof dd !== 'object' || dd.type) return null;
      for (const st of fgStyleObjs(d, dd.foregroundStyle)) {
        if (st && st.normalColor != null && (st.buttonStyleType === 'text' || st.text != null || st.buttonStyleType == null)) return st.normalColor;
      }
      return null;
    };
    for (const kn of collectLayoutKeys(d)) {
      const act = d[kn] && d[kn].action;
      const isChar = (act && typeof act === 'object' && typeof act.character === 'string' && /^[a-zA-Z]$/.test(act.character)) || (typeof act === 'string' && /^[a-z]$/i.test(act));
      if (isChar) { const c = colorOf(kn); if (c) return c; }
    }
    for (const kn of collectLayoutKeys(d)) { const c = colorOf(kn); if (c) return c; }
    return null;
  }
  // 把所有键盘（浅+深）回车键"变化时"的文字颜色统一成该键盘的普通文字色
  function unifyReturnKeyTextColorEverywhere() {
    const m = M();
    const docNames = [...new Set([...Object.keys(m.docs.light), ...Object.keys(m.docs.dark)])];
    pushUndo();
    let n = 0;
    for (const mode of ['light', 'dark']) {
      for (const name of docNames) {
        const d = m.docs[mode][name]; if (!d || d.__parseError) continue;
        const kbColor = sampleKeyboardTextColor(d); if (!kbColor) continue;
        let touched = false;
        const applyTo = ref => { for (const st of fgStyleObjs(d, ref)) { if (st && st.buttonStyleType !== 'geometry' && st.buttonStyleType !== 'fileImage') { st.normalColor = kbColor; n++; touched = true; } } };
        for (const kn of collectLayoutKeys(d)) {
          const dd = d[kn]; if (!dd || typeof dd !== 'object' || dd.type || dd.action !== 'enter') continue;
          // 回车键自己的（含条件）前景 + 所有 returnKeyType 通知的前景（"发送/搜索"变化态）
          applyTo(dd.foregroundStyle);
          const targets = new Set();
          for (const nn of (dd.notification == null ? [] : (Array.isArray(dd.notification) ? dd.notification : [dd.notification]))) if (typeof nn === 'string') targets.add(nn);
          for (const k in d) { const v = d[k]; if (v && typeof v === 'object' && !Array.isArray(v) && v.notificationType === 'returnKeyType') targets.add(k); }
          for (const nk of targets) { const ntf = d[nk]; if (ntf && typeof ntf === 'object') applyTo(ntf.foregroundStyle); }
        }
        if (touched) m.docDirty[mode].add(name);
      }
    }
    renderAll();
    return n;
  }

  function afterLoad() {
    app.undoStack.length = 0;
    app.redoStack.length = 0;
    app.selection = null;

    const cfg = M().config || {};
    let first = null;
    if (cfg.pinyin && cfg.pinyin.iPhone && cfg.pinyin.iPhone.portrait) first = cfg.pinyin.iPhone.portrait;
    const names = Object.keys(M().docs[Renderer.state.mode]);
    Renderer.state.docName = (first && names.includes(first)) ? first : (names[0] || null);

    renderAll();
