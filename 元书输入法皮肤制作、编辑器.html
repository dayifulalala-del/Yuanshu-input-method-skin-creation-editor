    }

    const type = style.buttonStyleType || (style.text != null ? 'text' : (style.normalImage ? 'fileImage' : 'geometry'));

    if (type === 'geometry') {
      paintGeometry(ctx, style, r, pressed);
    } else if (type === 'fileImage') {
      const imgRef = pressed ? (style.highlightImage || style.normalImage) : (style.normalImage || style.highlightImage);
      if (imgRef) {
        const slice = findSlice(state.mode, imgRef.file, imgRef.image);
        if (slice) {
          const cm = style.contentMode || 'scaleToFill';
          let dr = { ...r };
          if (cm === 'center') {
            // 原始点数大小显示；超过可用区域时等比缩小（还原真机观感）
            let w = slice.rect.width / (state.assetScale || 1), h = slice.rect.height / (state.assetScale || 1);
            const fit = Math.min(1, r.w / w, r.h / h);
            w *= fit; h *= fit;
            dr = { x: (center ? center.x : r.x + r.w / 2) - w / 2, y: (center ? center.y : r.y + r.h / 2) - h / 2, w, h };
          } else if (cm === 'scaleAspectFit' || cm === 'scaleAspectFill') {
            const s = cm === 'scaleAspectFit'
              ? Math.min(r.w / slice.rect.width, r.h / slice.rect.height)
              : Math.max(r.w / slice.rect.width, r.h / slice.rect.height);
            const w = slice.rect.width * s, h = slice.rect.height * s;
            dr = { x: (center ? center.x : r.x + r.w / 2) - w / 2, y: (center ? center.y : r.y + r.h / 2) - h / 2, w, h };
          } else if (center) {
            dr = { x: center.x - r.w / 2, y: center.y - r.h / 2, w: r.w, h: r.h };
          }
          ctx.save();
          if (cm === 'scaleAspectFill') { ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip(); }
          drawNinePatch(ctx, slice.img, slice.rect.x, slice.rect.y, slice.rect.width, slice.rect.height,
            slice.insets, dr.x, dr.y, dr.w, dr.h);
          ctx.restore();
        } else {
          paintMissing(ctx, r, (imgRef.file || '?') + (imgRef.image ? ':' + imgRef.image : ''));
        }
      }
    } else if (type === 'text') {
      const color = parseColor(pressed ? (style.highlightColor != null ? style.highlightColor : style.normalColor) : style.normalColor) || (state.mode === 'dark' ? '#fff' : '#000');
      const size = Number(style.fontSize) || 16;
      const weight = fontWeightCss(style.fontWeight);
      ctx.save();
      ctx.fillStyle = color;
      ctx.font = `${weight} ${size}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const cx = center ? center.x : r.x + r.w / 2;
      const cy = center ? center.y : r.y + r.h / 2;
      ctx.fillText(substituteText(style.text), cx, cy);
      ctx.restore();
    } else if (type === 'systemImage') {
      const name = pressed ? (style.highlightSystemImageName || style.systemImageName) : style.systemImageName;
      const color = parseColor(pressed ? (style.highlightColor != null ? style.highlightColor : style.normalColor) : style.normalColor) || (state.mode === 'dark' ? '#fff' : '#000');
      const size = Number(style.fontSize) || Math.min(r.h * 0.5, 22);
      const glyph = sfGlyph(name);
      ctx.save();
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const cx = center ? center.x : r.x + r.w / 2;
      const cy = center ? center.y : r.y + r.h / 2;
      if (glyph) {
        ctx.font = `${fontWeightCss(style.fontWeight)} ${size}px -apple-system, "Segoe UI Symbol", "PingFang SC", sans-serif`;
        ctx.fillText(glyph, cx, cy);
      } else {
        // 未映射的 SF 图标：截断显示名称，不超出按键
        ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
        ctx.font = `500 9px sans-serif`;
        let label = String(name || '');
        if (label.length > 14) label = label.slice(0, 13) + '…';
        ctx.fillText(label, cx, cy, Math.max(10, r.w - 4));
      }
      ctx.restore();
    } else if (type === 'assetImage') {
      const color = parseColor(style.normalColor) || (state.mode === 'dark' ? '#ccc' : '#555');
      ctx.save();
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `500 10px sans-serif`;
      ctx.fillText('[' + (style.assetImageName || 'asset') + ']', r.x + r.w / 2, r.y + r.h / 2);
      ctx.restore();
    }
  }

  function paintGeometry(ctx, style, r, pressed) {
    const radius = Number(style.cornerRadius) || 0;
    const colors = pressed ? (style.highlightColor != null ? style.highlightColor : style.normalColor) : style.normalColor;
    ctx.save();

    // 阴影（完全透明视为无，绝不凭空添加）
    const shadowColor = visibleColor(pressed ? style.highlightShadowColor : style.normalShadowColor);
    if (shadowColor) {
      ctx.shadowColor = shadowColor;
      ctx.shadowBlur = style.shadowRadius != null ? Number(style.shadowRadius) : 3;
      const off = style.shadowOffset || { x: 0, y: 3 };
      ctx.shadowOffsetX = Number(off.x || 0) * state.zoom;
      ctx.shadowOffsetY = Number(off.y != null ? off.y : 3) * state.zoom;
      ctx.globalAlpha = style.shadowOpacity != null ? Number(style.shadowOpacity) : 1;
    }

    // 底边（3D 效果）：画在按键下方 1px，不改变按键本体大小；透明底边等于没有
    const lower = visibleColor(pressed ? style.highlightLowerEdgeColor : style.normalLowerEdgeColor);
    if (lower) {
      ctx.fillStyle = lower;
      roundRectPath(ctx, r.x, r.y + 1.2, r.w, r.h, radius);
      ctx.fill();
    }

    // 填充
    if (colors != null) {
      let fill = null;
      if (Array.isArray(colors) && colors.length > 1) {
        const sp = style.colorStartPoint || { x: 0.5, y: 0 };
        const ep = style.colorEndPoint || { x: 0.5, y: 1 };
        const gtype = style.colorGradientType || 'axial';
        let g;
        if (gtype === 'radial') {
          const cx = r.x + r.w * Number(sp.x), cy = r.y + r.h * Number(sp.y);
          const ex = r.x + r.w * Number(ep.x), ey = r.y + r.h * Number(ep.y);
          const rad = Math.hypot(ex - cx, ey - cy) || Math.max(r.w, r.h) / 2;
          g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
        } else if (gtype === 'conic' && ctx.createConicGradient) {
          g = ctx.createConicGradient(0, r.x + r.w * Number(sp.x), r.y + r.h * Number(sp.y));
        } else {
          g = ctx.createLinearGradient(r.x + r.w * Number(sp.x), r.y + r.h * Number(sp.y),
            r.x + r.w * Number(ep.x), r.y + r.h * Number(ep.y));
        }
        const locs = Array.isArray(style.colorLocation) && style.colorLocation.length === colors.length
          ? style.colorLocation : colors.map((_, i) => i / (colors.length - 1));
        colors.forEach((c, i) => {
          const col = parseColor(c);
          if (col) g.addColorStop(Math.min(1, Math.max(0, Number(locs[i]))), col);
        });
        fill = g;
      } else {
        fill = parseColor(Array.isArray(colors) ? colors[0] : colors);
      }
      if (fill) {
        ctx.fillStyle = fill;
        roundRectPath(ctx, r.x, r.y, r.w, r.h, radius);
        ctx.fill();
      }
    }
    ctx.restore();

    // 边框（不带阴影；透明边框等于没有）
    const borderColor = visibleColor(pressed ? style.highlightBorderColor : style.normalBorderColor);
    const borderSize = Number(style.borderSize) || 0;
    if (borderColor && borderSize > 0) {
      ctx.save();
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = borderSize;
      roundRectPath(ctx, r.x + borderSize / 2, r.y + borderSize / 2, r.w - borderSize, r.h - borderSize, Math.max(0, radius - borderSize / 2));
      ctx.stroke();
      ctx.restore();
    }
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    if (r <= 0) { ctx.rect(x, y, w, h); return; }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function paintMissing(ctx, r, label) {
    ctx.save();
    ctx.strokeStyle = '#e5484d';
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
    ctx.fillStyle = '#e5484d';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('缺:' + label, r.x + r.w / 2, r.y + r.h / 2, r.w - 4);
    ctx.restore();
  }

  // ---------- 按键绘制 ----------
  function paintCell(ctx, doc, node) {
    const { name, rect } = node;
    // 播放中的按键动画：整键缩放
    const anim = state.pressAnim;
    const scaled = anim && anim.key === name && anim.scale != null && Math.abs(anim.scale - 1) > 0.001;
    if (scaled) {
      ctx.save();
      const cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
      ctx.translate(cx, cy);
      ctx.scale(anim.scale, anim.scale);
      ctx.translate(-cx, -cy);
    }
    try {
      paintCellInner(ctx, doc, node);
    } finally {
      if (scaled) ctx.restore();
    }
  }

  function paintCellInner(ctx, doc, node) {
    const { name, def, rect } = node;
    if (!def || typeof def !== 'object') {
      paintMissing(ctx, rect, name);
      return;
    }
    // 集合视图
    if (def.type) {
      paintCollection(ctx, doc, def, rect, name);
      return;
    }
    const pressed = state.highlightKey === name;

    let bgRef = def.backgroundStyle, fgRef = def.foregroundStyle;
    // 大写 / 大写锁定状态：前景换成对应样式
    if (state.shiftState !== 'normal') {
      if (state.shiftState === 'uppercased' && def.uppercasedStateForegroundStyle) fgRef = def.uppercasedStateForegroundStyle;
      if (state.shiftState === 'capsLocked' && (def.capsLockedStateForegroundStyle || def.uppercasedStateForegroundStyle))
        fgRef = def.capsLockedStateForegroundStyle || def.uppercasedStateForegroundStyle;
    }
    // 事件通知覆盖（状态预览命中时，这个键临时换成通知里的样式，还原真机效果）
    const ntfOv = activeNotificationOverride(doc, def);
    if (ntfOv) {
      if (ntfOv.backgroundStyle != null) bgRef = ntfOv.backgroundStyle;
      if (ntfOv.foregroundStyle != null) fgRef = ntfOv.foregroundStyle;
    }

    // cell 自身 insets / bounds
    let r = insetRect(rect, def.insets);

    for (const st of resolveStyleRefList(doc, bgRef)) {
      paintStyle(ctx, doc, applyCellGeometryOverride(st, def), r, { pressed });
    }
    for (const st of resolveStyleRefList(doc, fgRef)) {
      paintStyle(ctx, doc, applyCellGeometryOverride(st, def), r, { pressed });
    }
  }

  // 按键定义上的 bounds/center 会影响内容显示区域
  function applyCellGeometryOverride(style, def) {
    if (!def.bounds && !def.center) return style;
    const merged = Object.assign({}, style);
    if (def.bounds && !merged.bounds) merged.bounds = def.bounds;
    if (def.center && !merged.center) merged.center = def.center;
    return merged;
  }

  // ---------- 集合视图 ----------
  function paintCollection(ctx, doc, def, rect, name) {
    const r = insetRect(rect, def.insets);
    for (const st of resolveStyleRefList(doc, def.backgroundStyle)) paintStyle(ctx, doc, st, rect);

    const type = def.type;
    if (type === 'horizontalCandidates') {
      paintHorizontalCandidates(ctx, doc, def, r);
      return;
    }
    if (type === 'verticalCandidates') {
      paintVerticalCandidates(ctx, doc, def, r);
      return;
    }

    // 数据源
    let data = [];
    if (def.dataSource != null) {
      const ds = typeof def.dataSource === 'string' ? doc[def.dataSource] : def.dataSource;
      if (Array.isArray(ds)) data = ds;
    }
    if (!data.length) {
      if (type === 't9Symbols' || type === 'symbols' || type === 'numericSymbols')
        data = ['，', '。', '？', '！', '…', '：', '；', '~'];
      else if (type === 't9HorizontalSymbols') data = ['分词', "'"];
      else if (type === 'classifiedSymbols') data = ['常用', '中文', '英文', '数学'];
      else if (type === 'subClassifiedSymbols') data = ['，', '。', '、', '：', '；', '「」'];
      else if (type === 'horizontalSymbols') data = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
      else if (type === 'categorySymbols') data = ['。', '，', '、', '！', '？', '：'];
      else data = ['?'];
    }

    const cellStyle = typeof def.cellStyle === 'string' ? doc[def.cellStyle] : def.cellStyle;
    const horizontal = type === 'horizontalSymbols' || type === 't9HorizontalSymbols';
    const sepColor = def.displaySeparatorLine === false ? null : parseColor(def.separatorLineColor) || 'rgba(128,128,128,.25)';

    ctx.save();
    ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();

    if (type === 'subClassifiedSymbols' || type === 'categorySymbols') {
      // 网格
      const rows = Number(def.maximumRow) || 4, cols = Number(def.maximumColumn) || 5;
      const cw = r.w / cols, ch = r.h / rows;
      for (let i = 0; i < Math.min(data.length, rows * cols); i++) {
        const cx = r.x + (i % cols) * cw, cy = r.y + Math.floor(i / cols) * ch;
        paintCollectionCell(ctx, doc, cellStyle, { x: cx, y: cy, w: cw, h: ch }, data[i]);
        if (sepColor && type === 'subClassifiedSymbols') {
          ctx.strokeStyle = sepColor; ctx.lineWidth = 0.5;
          ctx.strokeRect(cx, cy, cw, ch);
        }
      }
    } else if (horizontal) {
      const maxCols = Number(def.maxColumns || def.maxColums) || 5;
      const cw = r.w / Math.min(maxCols, Math.max(1, data.length));
      const items = def.contentRightToLeft ? [...data].reverse() : data;
      for (let i = 0; i < Math.min(items.length, maxCols); i++) {
        paintCollectionCell(ctx, doc, cellStyle, { x: r.x + i * cw, y: r.y, w: cw, h: r.h }, items[i]);
      }
    } else {
      // 纵向列表
      const rowH = Math.max(26, r.h / Math.max(4, Math.min(8, data.length)));
      const n = Math.min(data.length, Math.floor(r.h / rowH) + 1);
      for (let i = 0; i < n; i++) {
        const cellRect = { x: r.x, y: r.y + i * rowH, w: r.w, h: rowH };
        paintCollectionCell(ctx, doc, cellStyle, cellRect, data[i]);
        if (sepColor && i < n - 1) {
          ctx.strokeStyle = sepColor; ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(cellRect.x + 4, cellRect.y + rowH);
          ctx.lineTo(cellRect.x + cellRect.w - 4, cellRect.y + rowH);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  function paintCollectionCell(ctx, doc, cellStyle, rect, item) {
    let label = item;
    if (item && typeof item === 'object') label = item.label != null ? item.label : (item.value != null ? item.value : '');
    let r = rect;
    if (cellStyle) {
      r = insetRect(rect, cellStyle.insets);
      // 单元格样式：背景仅 highlight 时显示，正常状态无背景（还原真机行为）
      const fgList = resolveStyleRefList(doc, cellStyle.foregroundStyle);
      // styleName 自定义样式
      if (item && typeof item === 'object' && item.styleName && doc[item.styleName]) {
        const st = doc[item.styleName];
        for (const s of resolveStyleRefList(doc, st.backgroundStyle)) paintStyle(ctx, doc, s, r);
        for (const s of resolveStyleRefList(doc, st.foregroundStyle)) paintStyle(ctx, doc, s, r);
        return;
      }
      if (fgList.length) {
        for (const fg of fgList) {
          const merged = Object.assign({}, fg, { text: String(label) });
          paintStyle(ctx, doc, merged, r);
        }
        return;
      }
    }
    ctx.save();
    ctx.fillStyle = state.mode === 'dark' ? '#eee' : '#333';
    ctx.font = '16px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(label), r.x + r.w / 2, r.y + r.h / 2);
    ctx.restore();
  }

  function candidateStyleOf(doc, def) {
    const cs = typeof def.candidateStyle === 'string' ? doc[def.candidateStyle] : def.candidateStyle;
    return cs || {};
  }

  function paintHorizontalCandidates(ctx, doc, def, r) {
    const style = candidateStyleOf(doc, def);
    const list = state.sample.candidates;
    ctx.save();
    ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
    let x = r.x + 6;
    const textSize = Number(style.textFontSize) || 18;
    const idxSize = Number(style.indexFontSize) || 18;
    for (let i = 0; i < list.length && x < r.x + r.w; i++) {
      const c = list[i];
      const preferred = i === 0;
      const textColor = parseColor(preferred ? style.preferredTextColor : style.textColor) || (state.mode === 'dark' ? '#fff' : '#000');
      const bg = parseColor(preferred ? style.preferredBackgroundColor : null);
      ctx.font = `400 ${textSize}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
      const w = ctx.measureText(c.text).width + 20;
      if (bg) {
        ctx.fillStyle = bg;
        roundRectPath(ctx, x - 4, r.y + 3, w - 6, r.h - 6, 5);
        ctx.fill();
      }
      ctx.fillStyle = textColor;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(c.text, x, r.y + r.h / 2);
      x += w;
    }
    ctx.restore();
  }

  function paintVerticalCandidates(ctx, doc, def, r) {
    const style = candidateStyleOf(doc, def);
    const list = state.sample.candidates;
    const maxRows = Number(def.maxRows) || 5;
    const sep = parseColor(def.separatorColor);
    const rowH = r.h / maxRows;
    ctx.save();
    ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
    const textSize = Number(style.textFontSize) || 16;
    const idxSize = Number(style.indexFontSize) || 16;
    for (let i = 0; i < Math.min(list.length, maxRows); i++) {
      const c = list[i];
      const preferred = i === 0;
      const y = r.y + i * rowH + rowH / 2;
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      ctx.fillStyle = parseColor(preferred ? style.preferredIndexColor : style.indexColor) || '#888';
      ctx.font = `400 ${idxSize}px -apple-system, sans-serif`;
      ctx.fillText(String(c.index) + '.', r.x + 10, y);
      ctx.fillStyle = parseColor(preferred ? style.preferredTextColor : style.textColor) || (state.mode === 'dark' ? '#fff' : '#000');
      ctx.font = `400 ${textSize}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.fillText(c.text, r.x + 34, y);
      if (sep && i < maxRows - 1) {
        ctx.strokeStyle = sep; ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(r.x + 6, r.y + (i + 1) * rowH);
        ctx.lineTo(r.x + r.w - 6, r.y + (i + 1) * rowH);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // ---------- 动画图片层绘制 ----------
  function paintAnimOverlays(ctx, node) {
    const cx = node.rect.x + node.rect.w / 2;
    const cy = node.rect.y + node.rect.h / 2;
    for (const ov of state.pressAnim.overlays) {
      const res = SkinModel.getResource(state.mode, ov.imgName);
      if (!res || !res.img) continue;
      const scale = (ov.scale || 1) / (state.assetScale || 1);
      const w = res.img.naturalWidth * scale;
      const h = res.img.naturalHeight * scale;
      ctx.save();
      ctx.globalAlpha = ov.alpha != null ? Math.max(0, Math.min(1, ov.alpha)) : 1;
      ctx.translate(cx + (ov.x || 0), cy + (ov.y || 0));
      if (ov.angle) ctx.rotate(ov.angle * Math.PI / 180);
      ctx.drawImage(res.img, -w / 2, -h / 2, w, h);
      ctx.restore();
    }
  }

  // ---------- hint 气泡（长按符号面板）预览 ----------
  // 官方文档：guides/skins/hintsymbolsgrid（长按符号面板）
  // 兼容旧版属性名 holdSymbolsStyle（仓 v2），符号多时自动换行排成网格
  function hintSymbolsOf(doc, def) {
    if (!def) return null;
    const ref = def.hintSymbolsStyle != null ? def.hintSymbolsStyle : def.holdSymbolsStyle;
    if (ref == null) return null;
    return typeof ref === 'string' ? doc[ref] : ref;
  }

  function paintHintSymbols(ctx, doc, node) {
    const def = node.def;
    const hs = hintSymbolsOf(doc, def);
    if (!hs) return;
    const names = hs.symbolStyles || [];
    if (!names.length) return;
    const unit = hs.size || { width: 40, height: 50 };
    const uw = Number(unit.width) || 40, uh = Number(unit.height) || 50;
    const scrW = lastLayoutSize.w || screen().w;

    // 一行放不下就换行 → 网格（与真机的符号面板行为一致）
    const maxCols = Math.max(1, Math.floor((scrW - 8) / uw));
    const cols = Math.min(names.length, maxCols);
    const rows = Math.ceil(names.length / cols);
    const totalW = uw * cols, totalH = uh * rows;

    // 面板对准按键中心，超出屏幕边缘时往回收
    let x = node.rect.x + node.rect.w / 2 - totalW / 2;
    x = Math.max(4, Math.min(x, scrW - totalW - 4));
    let y = node.rect.y - totalH - 4;
    if (y < 0) y = node.rect.y + node.rect.h + 4;

    // 面板整体背景
    const bgRect = { x, y, w: totalW, h: totalH };
    for (const st of resolveStyleRefList(doc, hs.backgroundStyle)) paintStyle(ctx, doc, st, bgRect);

    const selIdx = Number(hs.selectedIndex || 0);
    names.forEach((n, i) => {
      const sdef = typeof n === 'string' ? doc[n] : n;
      const cellRect = {
        x: x + (i % cols) * uw,
        y: y + Math.floor(i / cols) * uh,
        w: uw, h: uh,
      };
      if (!sdef) { paintMissing(ctx, cellRect, String(n)); return; }
      if (i === selIdx) {
        for (const st of resolveStyleRefList(doc, hs.selectedBackgroundStyle)) paintStyle(ctx, doc, st, cellRect);
      }
      for (const st of resolveStyleRefList(doc, sdef.foregroundStyle)) paintStyle(ctx, doc, st, cellRect);
      // 符号本身没有前景样式时，尽量把动作内容画出来（避免面板看起来是空的）
      if (!sdef.foregroundStyle && sdef.action && typeof sdef.action === 'object') {
        const t = sdef.action.symbol != null ? sdef.action.symbol : sdef.action.character;
        if (t != null) {
          ctx.save();
          ctx.fillStyle = state.mode === 'dark' ? '#fff' : '#000';
          ctx.font = '16px -apple-system, "PingFang SC", sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(String(t), cellRect.x + cellRect.w / 2, cellRect.y + cellRect.h / 2);
          ctx.restore();
        }
      }
    });
  }

  // ---------- 主渲染 ----------
  // canvas: HTMLCanvasElement；doc：当前键盘文件对象
  function render(canvas, doc) {
    hitRects = [];
    const scr = screen();
    const ph = resolveHeightParam(doc.preeditHeight, 0);
    const th = resolveHeightParam(doc.toolbarHeight, 0);
    const kh = resolveHeightParam(doc.keyboardHeight, 220);
    const totalH = ph + th + kh;
    const W = scr.w, H = totalH;
    lastLayoutSize = { w: W, h: H };

    const z = state.zoom * (window.devicePixelRatio || 1);
    canvas.width = Math.round(W * z);
    canvas.height = Math.round(H * z);
    canvas.style.width = (W * state.zoom) + 'px';
    canvas.style.height = (H * state.zoom) + 'px';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(z, 0, 0, z, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.textRendering = 'optimizeLegibility';

    // ===== 键盘整体背景 =====
    // 真机行为：皮肤背景叠加在 iOS 系统键盘底色之上（很多皮肤用半透明背景，靠系统底色垫底）
    // 所以必须先铺系统底色，再画皮肤背景，透明皮肤才能显示正确
    const kbStyle = doc.keyboardStyle || {};
    const fullRect = { x: 0, y: 0, w: W, h: H };
    ctx.fillStyle = state.mode === 'dark' ? '#2b2b2d' : '#d1d4d9';
    ctx.fillRect(0, 0, W, H);
    const kbBgList = resolveStyleRefList(doc, kbStyle.backgroundStyle);
    for (const st of kbBgList) paintStyle(ctx, doc, st, fullRect);

    let y = 0;
    // ===== preedit 区 =====
    if (ph > 0) {
      const pr = { x: 0, y, w: W, h: ph };
      const ps = doc.preeditStyle || {};
      const inner = insetRect(pr, ps.insets);
      for (const st of resolveStyleRefList(doc, ps.backgroundStyle)) paintStyle(ctx, doc, st, inner);
      // 前景：专用文本样式 {fontSize, fontWeight, textColor}
      const fg = typeof ps.foregroundStyle === 'string' ? doc[ps.foregroundStyle] : ps.foregroundStyle;
      if (state.barMode !== 'toolbar' || true) {
        const color = parseColor(fg && (fg.textColor || fg.normalColor)) || (state.mode === 'dark' ? '#ddd' : '#333');
        const size = Number(fg && fg.fontSize) || 15;
        ctx.save();
        ctx.fillStyle = color;
        ctx.font = `${fontWeightCss(fg && fg.fontWeight)} ${size}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        if (state.barMode !== 'toolbar') ctx.fillText(state.sample.preedit, inner.x + 2, inner.y + inner.h / 2);
        ctx.restore();
      }
      hitRects.push({ rect: pr, kind: 'area', name: 'preedit', area: 'preedit' });
      y += ph;
    }

    // ===== 工具栏 / 横向候选 =====
    if (th > 0) {
      const tr = { x: 0, y, w: W, h: th };
      if (state.barMode === 'toolbar') {
        const ts = doc.toolbarStyle || {};
        const inner = insetRect(tr, ts.insets);
        for (const st of resolveStyleRefList(doc, ts.backgroundStyle)) paintStyle(ctx, doc, st, inner);
        const nodes = [];
        layoutItems(doc.toolbarLayout, inner, 'v', doc, nodes, 'toolbarLayout');
        for (const n of nodes) {
          if (n.kind === 'cell') {
            paintCell(ctx, doc, n);
            hitRects.push({ rect: n.rect, kind: 'key', name: n.name, area: 'toolbar', path: n.path });
          }
        }
      } else {
        const hcs = doc.horizontalCandidatesStyle || {};
        const inner = insetRect(tr, hcs.insets);
        for (const st of resolveStyleRefList(doc, hcs.backgroundStyle)) paintStyle(ctx, doc, st, inner);
        const nodes = [];
        layoutItems(doc.horizontalCandidatesLayout, inner, 'v', doc, nodes, 'horizontalCandidatesLayout');
        for (const n of nodes) {
          if (n.kind === 'cell') {
            paintCell(ctx, doc, n);
            hitRects.push({ rect: n.rect, kind: 'key', name: n.name, area: 'horizontalCandidates', path: n.path });
          }
        }
      }
      hitRects.push({ rect: tr, kind: 'area', name: state.barMode === 'toolbar' ? 'toolbar' : 'horizontalCandidates', area: 'toolbarArea' });
      y += th;
    }

    // ===== 按键区 / 纵向候选 =====
    const kr = { x: 0, y, w: W, h: kh };
    if (state.barMode === 'vertical' && doc.verticalCandidatesLayout) {
      const vcs = doc.verticalCandidatesStyle || {};
      const inner = insetRect(kr, vcs.insets);
      for (const st of resolveStyleRefList(doc, vcs.backgroundStyle)) paintStyle(ctx, doc, st, inner);
      const nodes = [];
      layoutItems(doc.verticalCandidatesLayout, inner, 'v', doc, nodes, 'verticalCandidatesLayout');
      for (const n of nodes) {
        if (n.kind === 'cell') {
          paintCell(ctx, doc, n);
          hitRects.push({ rect: n.rect, kind: 'key', name: n.name, area: 'verticalCandidates', path: n.path });
        }
      }
    } else {
      const inner = insetRect(kr, kbStyle.insets);
      const nodes = [];
      layoutItems(doc.keyboardLayout, inner, 'v', doc, nodes, 'keyboardLayout');
      for (const n of nodes) {
        if (n.kind === 'cell') {
          paintCell(ctx, doc, n);
          hitRects.push({ rect: n.rect, kind: 'key', name: n.name, area: 'keyboard', path: n.path });
        } else if (n.kind === 'stack') {
          hitRects.push({ rect: n.rect, kind: 'stack', name: n.stackType, area: 'keyboard', path: n.path });
        }
      }
      // hint 预览
      if (state.showHints && state.selectedName) {
        const node = nodes.find(n => n.kind === 'cell' && n.name === state.selectedName);
        if (node) paintHintSymbols(ctx, doc, node);
      }
      // 动画图片层（cartoon / physics 的帧图片）
      if (state.pressAnim && state.pressAnim.overlays && state.pressAnim.overlays.length) {
        const node = nodes.find(n => n.kind === 'cell' && n.name === state.pressAnim.key);
        if (node) paintAnimOverlays(ctx, node);
      }
    }
    hitRects.push({ rect: kr, kind: 'area', name: 'keyboard', area: 'keyboardArea' });

    return { w: W, h: H };
  }

  // 选中高亮（画在 overlay canvas 上）
  function drawOverlay(canvas, selection) {
    const z = state.zoom * (window.devicePixelRatio || 1);
    canvas.width = Math.round(lastLayoutSize.w * z);
    canvas.height = Math.round(lastLayoutSize.h * z);
    canvas.style.width = (lastLayoutSize.w * state.zoom) + 'px';
    canvas.style.height = (lastLayoutSize.h * state.zoom) + 'px';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(z, 0, 0, z, 0, 0);
    ctx.clearRect(0, 0, lastLayoutSize.w, lastLayoutSize.h);
    if (!selection) return;
    const targets = hitRects.filter(h => h.kind === 'key' && h.name === selection);
    for (const t of targets) {
      ctx.strokeStyle = '#4f8cff';
      ctx.lineWidth = 2;
      ctx.setLineDash([]);
      ctx.strokeRect(t.rect.x + 1, t.rect.y + 1, t.rect.w - 2, t.rect.h - 2);
      ctx.fillStyle = 'rgba(79,140,255,0.12)';
      ctx.fillRect(t.rect.x, t.rect.y, t.rect.w, t.rect.h);
    }
  }

  function hitTest(px, py) {
    // px/py 为未缩放坐标
    const keys = hitRects.filter(h => h.kind === 'key');
    for (let i = keys.length - 1; i >= 0; i--) {
      const h = keys[i];
      if (px >= h.rect.x && px <= h.rect.x + h.rect.w && py >= h.rect.y && py <= h.rect.y + h.rect.h) return h;
    }
    const areas = hitRects.filter(h => h.kind === 'area');
    for (const h of areas) {
      if (px >= h.rect.x && px <= h.rect.x + h.rect.w && py >= h.rect.y && py <= h.rect.y + h.rect.h) return h;
    }
    return null;
  }

  return { state, render, drawOverlay, hitTest, parseColor, fontWeightCss, resolveDim, DEVICES,
           sfGlyph, SF_MAP, hintSymbolsOf,
           get hitRects() { return hitRects; }, get layoutSize() { return lastLayoutSize; } };
})();

</script>
<script>
/* =========================================================
 * ui.js — 通用 UI 小控件
 * ========================================================= */
'use strict';

const UI = (() => {

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function field(labelText, control, hint) {
    const wrap = el('div', 'fld');
    const lab = el('label', 'fld-label', labelText);
    wrap.appendChild(lab);
    wrap.appendChild(control);
    if (hint) wrap.appendChild(el('div', 'fld-hint', hint));
    return wrap;
  }

  function section(title, open = true) {
    const d = el('details', 'sec');
    d.open = open;
    const s = el('summary', 'sec-title', title);
    d.appendChild(s);
    const body = el('div', 'sec-body');
    d.appendChild(body);
    return { root: d, body, summary: s };
  }

  function textInput(value, onChange, placeholder) {
    const i = el('input');
    i.type = 'text';
    i.value = value == null ? '' : String(value);
    if (placeholder) i.placeholder = placeholder;
    i.onchange = () => onChange(i.value);
    return i;
  }

  function numInput(value, onChange, opts = {}) {
    const i = el('input');
    i.type = 'number';
    if (opts.step != null) i.step = opts.step;
    if (opts.min != null) i.min = opts.min;
    if (opts.max != null) i.max = opts.max;
    i.value = value == null ? '' : value;
    i.onchange = () => {
      const v = i.value === '' ? null : Number(i.value);
      onChange(v);
    };
    return i;
  }

  function selectInput(value, options, onChange) {
    // options: [[value, label]]
    const s = el('select');
    for (const [v, t] of options) {
      const o = el('option', null, t);
      o.value = v;
      s.appendChild(o);
    }
    if (value != null) s.value = String(value);
    s.onchange = () => onChange(s.value);
    return s;
  }

  function checkbox(value, onChange, labelText) {
    const wrap = el('label', 'chk');
    const c = el('input');
    c.type = 'checkbox';
    c.checked = !!value;
    c.onchange = () => onChange(c.checked);
    wrap.appendChild(c);
    wrap.appendChild(document.createTextNode(labelText || ''));
    return wrap;
  }

  // 颜色输入：支持 #RRGGBB / #RRGGBBAA / 空
  function colorInput(value, onChange) {
    const wrap = el('div', 'color-inp');
    const swatch = el('input');
    swatch.type = 'color';
    const txt = el('input');
    txt.type = 'text';
    txt.placeholder = '如 #ff0000 或 #ff000080';
    const alpha = el('input');
    alpha.type = 'range';
    alpha.min = 0; alpha.max = 100; alpha.title = '透明度';

    function parse(v) {
      const css = Renderer.parseColor(v);
      if (!css) return { hex: '#000000', a: 100, empty: true };
      if (css.startsWith('rgba')) {
        const m = css.match(/rgba\((\d+),(\d+),(\d+),([\d.]+)\)/);
        if (m) {
          const hex = '#' + [m[1], m[2], m[3]].map(x => (+x).toString(16).padStart(2, '0')).join('');
          return { hex, a: Math.round(parseFloat(m[4]) * 100) };
        }
      }
      return { hex: css.length === 4 ? '#' + [...css.slice(1)].map(c => c + c).join('') : css, a: 100 };
    }
    function sync(v) {
      const p = parse(v);
      swatch.value = p.hex;
      alpha.value = p.a;
      txt.value = v == null ? '' : String(v);
      wrap.classList.toggle('empty', v == null || v === '');
    }
    function emit() {
      const hex = swatch.value;
      const a = Number(alpha.value);
      const out = a >= 100 ? hex : hex + Math.round(a / 100 * 255).toString(16).padStart(2, '0');
      txt.value = out;
      onChange(out);
      wrap.classList.remove('empty');
    }
    swatch.oninput = emit;
    alpha.oninput = emit;
    txt.onchange = () => {
      const v = txt.value.trim();
      if (v === '') { onChange(null); wrap.classList.add('empty'); return; }
      sync(v);
      onChange(v);
    };
    const clear = el('button', 'mini-btn', '✕');
    clear.title = '清除颜色';
    clear.onclick = () => { txt.value = ''; onChange(null); wrap.classList.add('empty'); };
    sync(value);
    wrap.appendChild(swatch);
    wrap.appendChild(txt);
    wrap.appendChild(alpha);
    wrap.appendChild(clear);
    return wrap;
  }

  // 尺寸输入（点数 / 分数 / 自动）
  function dimInput(value, onChange) {
    const wrap = el('div', 'dim-inp');
    const mode = el('select');
    for (const [v, t] of [['auto', '自动'], ['pt', '点数'], ['frac', '比例(分数)']]) {
      const o = el('option', null, t); o.value = v; mode.appendChild(o);
    }
    const num = el('input'); num.type = 'number'; num.step = 'any'; num.style.display = 'none';
    const fa = el('input'); fa.type = 'number'; fa.step = 'any'; fa.style.display = 'none'; fa.placeholder = '分子';
    const slash = el('span', null, '/'); slash.style.display = 'none';
    const fb = el('input'); fb.type = 'number'; fb.step = 'any'; fb.style.display = 'none'; fb.placeholder = '分母';

    function setMode(m) {
      mode.value = m;
      num.style.display = m === 'pt' ? '' : 'none';
      fa.style.display = fb.style.display = slash.style.display = m === 'frac' ? '' : 'none';
    }
    if (value == null) setMode('auto');
    else if (typeof value === 'number') { setMode('pt'); num.value = value; }
    else if (typeof value === 'object' && value.percentage != null) { setMode('frac'); fa.value = value.percentage * 100; fb.value = 100; }
    else {
      const s = String(value);
      if (s.includes('/')) { setMode('frac'); const [a, b] = s.split('/'); fa.value = a; fb.value = b; }
      else { setMode('pt'); num.value = parseFloat(s) || ''; }
    }
    function emit() {
      if (mode.value === 'auto') onChange(null);
      else if (mode.value === 'pt') onChange(num.value === '' ? null : Number(num.value));
      else {
        if (fa.value !== '' && fb.value !== '' && Number(fb.value) !== 0) onChange(`${fa.value}/${fb.value}`);
      }
    }
    mode.onchange = () => { setMode(mode.value); emit(); };
    num.onchange = emit; fa.onchange = emit; fb.onchange = emit;
    wrap.appendChild(mode); wrap.appendChild(num); wrap.appendChild(fa); wrap.appendChild(slash); wrap.appendChild(fb);
    return wrap;
  }

  // insets 编辑：{top,left,bottom,right}
  function insetsInput(value, onChange) {
    const wrap = el('div', 'insets-inp');
    const v = value || {};
    const mk = (key, label) => {
      const box = el('div', 'insets-box');
      box.appendChild(el('span', 'insets-lab', label));
      const i = el('input'); i.type = 'number'; i.step = 'any';
      i.value = v[key] == null ? '' : v[key];
      i.onchange = () => {
        const cur = Object.assign({}, v);
        if (i.value === '') delete cur[key]; else cur[key] = Number(i.value);
        Object.assign(v, cur);
        for (const k of Object.keys(v)) if (!(k in cur)) delete v[k];
        onChange(Object.keys(cur).length ? cur : null);
      };
      box.appendChild(i);
      return box;
    };
    wrap.appendChild(mk('top', '上'));
    wrap.appendChild(mk('bottom', '下'));
    wrap.appendChild(mk('left', '左'));
    wrap.appendChild(mk('right', '右'));
    return wrap;
  }

  // 点 {x, y} 编辑
  // opts: { labels, step, defaultVal, min, max }
  // defaultVal —— 字段为空时界面显示的默认值（仅提示，用户不动就不写入数据）
  function pointInput(value, onChange, opts = {}) {
    const labels = opts.labels || ['x', 'y'];
    const step = opts.step != null ? opts.step : 'any';
    const dflt = opts.defaultVal;
    const wrap = el('div', 'pt-inp');
    const v = value || {};
    const mk = (key, label) => {
      const box = el('div', 'insets-box');
      box.appendChild(el('span', 'insets-lab', label));
      const i = el('input'); i.type = 'number'; i.step = step;
      if (opts.min != null) i.min = opts.min;
      if (opts.max != null) i.max = opts.max;
      i.value = v[key] == null ? (dflt == null ? '' : dflt) : v[key];
      i.onchange = () => {
        if (i.value === '') delete v[key]; else v[key] = Number(i.value);
        onChange(Object.keys(v).length ? v : null);
      };
      box.appendChild(i);
      return box;
    };
    wrap.appendChild(mk('x', labels[0]));
    wrap.appendChild(mk('y', labels[1]));
    return wrap;
  }

  function button(text, onClick, cls) {
    const b = el('button', cls || 'btn', text);
    b.onclick = onClick;
    return b;
  }

  function toast(msg, isErr) {
    let t = document.getElementById('toast');
    if (!t) {
      t = el('div'); t.id = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.className = isErr ? 'err show' : 'show';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  // 模态框
  function modal(title, width) {
    const back = el('div', 'modal-back');
    const box = el('div', 'modal');
    if (width) box.style.width = width;
    const head = el('div', 'modal-head');
    head.appendChild(el('span', null, title));
    const close = el('button', 'mini-btn', '✕');
    close.onclick = () => back.remove();
    head.appendChild(close);
    const body = el('div', 'modal-body');
    box.appendChild(head);
    box.appendChild(body);
    back.appendChild(box);
    back.onclick = e => { if (e.target === back) back.remove(); };
    document.body.appendChild(back);
    return { back, body, close: () => back.remove() };
  }

  return { el, field, section, textInput, numInput, selectInput, checkbox, colorInput, dimInput, insetsInput, pointInput, button, toast, modal };
})();

</script>
<script>
/* =========================================================
 * actions.js — 按键动作的描述 / 展示 / 编辑控件
 * 覆盖官方文档全部动作类型
 * ========================================================= */
'use strict';

const Actions = (() => {

  // 标准动作（字符串型）
  const STANDARD = [
    ['space', '空格'],
    ['enter', '回车'],
    ['tab', 'Tab'],
    ['shift', 'Shift'],
    ['backspace', '删除'],
    ['dismissKeyboard', '收起键盘'],
    ['moveCursorBackward', '光标左移'],
    ['moveCursorForward', '光标右移'],
    ['returnPrimaryKeyboard', '返回主键盘'],
    ['returnLastKeyboard', '返回上一个键盘'],
    ['symbolicKeyboardLockStateToggle', '符号键盘锁定切换'],
    ['settings', '打开主应用'],
    ['nextKeyboard', '切换系统下一个输入法'],
    ['none', '无动作'],
  ];

  // 快捷指令：[指令代码, 通俗中文说明]
  const SHORTCUT_PAIRS = [
    ['#简繁切换', '简体/繁体切换'],
    ['#中英切换', '中文/英文切换'],
    ['#RimeSwitcher', '打开方案选单（Rime）'],
    ['#次选上屏', '把第 2 个候选词打上去'],
    ['#三选上屏', '把第 3 个候选词打上去'],
    ['#方案切换', '切换输入方案'],
    ['#左手模式', '键盘靠左（单手模式）'],
    ['#右手模式', '键盘靠右（单手模式）'],
    ['#行首', '光标跳到行首'],
    ['#行尾', '光标跳到行尾'],
    ['#换行', '换行'],
    ['#Enter', '回车（Enter）'],
    ['#重输', '清空正在打的拼音'],
    ['#subCollectionPageUp', '符号面板·上翻页'],
    ['#subCollectionPageDown', '符号面板·下翻页'],
    ['#verticalCandidatesPageUp', '竖排候选·上翻页'],
    ['#verticalCandidatesPageDown', '竖排候选·下翻页'],
    ['#showPhraseView', '打开常用语面板'],
    ['#showPasteboardView', '打开剪贴板面板'],
    ['#toggleScriptView', '打开/关闭脚本面板'],
    ['#candidatesBarStateToggle', '展开/收起候选栏'],
    ['#rimePreviousPage', '候选词·上一页'],
    ['#rimeNextPage', '候选词·下一页'],
    ['#toggleEmbeddedInputMode', '开/关拼音嵌入输入框'],
    ['#keyboardPerformance', '显示键盘性能信息'],
    ['#keyboardMenu', '打开键盘菜单'],
    ['#clearSystemPasteboard', '清空系统剪贴板'],
    ['#deleteText', '删除选中的文本'],
  ];
  const SHORTCUTS = SHORTCUT_PAIRS.map(p => p[0]);
  const SHORTCUT_LABELS = Object.fromEntries(SHORTCUT_PAIRS);

  const KEYBOARD_TYPES = [
    ['pinyin', '拼音中文键盘'],
    ['alphabetic', '英文键盘'],
    ['symbolic', '符号键盘'],
    ['numeric', '数字键盘'],
    ['emojis', 'Emoji 键盘'],
  ];

  // 动作对象 -> 类型标识
  function typeOf(action) {
    if (action == null) return 'none';
    if (typeof action === 'string') return STANDARD.some(([k]) => k === action) ? 'standard' : 'standard';
    if (typeof action === 'object') {
      for (const k of ['character', 'symbol', 'sendKeys', 'openURL', 'runScript', 'keyboardType', 'shortcut', 'switchRimeSchema', 'combine']) {
        if (k in action) return k;
      }
    }
    return 'unknown';
  }

  // 动作 -> 中文可读文本
  function label(action) {
    if (action == null) return '（无）';
    if (typeof action === 'string') {
      const f = STANDARD.find(([k]) => k === action);
      return f ? f[1] : action;
    }
    if (typeof action === 'object') {
      if ('character' in action) return `输入字符 "${action.character}"`;
      if ('symbol' in action) return `输入符号 "${action.symbol}"`;
      if ('sendKeys' in action) return `发送按键 "${action.sendKeys}"`;
      if ('openURL' in action) return `打开链接 ${action.openURL}`;
      if ('runScript' in action) return `运行脚本 ${action.runScript}`;
      if ('keyboardType' in action) {
        const f = KEYBOARD_TYPES.find(([k]) => k === action.keyboardType);
        return `切换键盘 → ${f ? f[1] : action.keyboardType}`;
      }
      if ('shortcut' in action) {
        const zh = SHORTCUT_LABELS[action.shortcut];
        return zh ? `${zh}（${action.shortcut}）` : `快捷指令 ${action.shortcut}`;
      }
      if ('switchRimeSchema' in action) return `切换方案 ${action.switchRimeSchema}`;
      if ('combine' in action) return `组合动作（${(action.combine || []).length} 个）`;
    }
    try { return JSON.stringify(action); } catch (_) { return String(action); }
  }

  // 构建动作编辑控件；onChange(newAction|null)
  function buildEditor(container, action, onChange, opts = {}) {
    container.innerHTML = '';
    const type = typeOf(action);

    const sel = document.createElement('select');
    sel.className = 'act-type';
    const options = [
      ['none', '（无动作）'],
      ['standard', '标准动作'],
      ['character', '输入字符（经 Rime）'],
      ['symbol', '输入符号（直接上屏）'],
      ['sendKeys', '发送组合按键'],
      ['keyboardType', '切换键盘'],
      ['shortcut', '快捷指令'],
      ['switchRimeSchema', '切换 Rime 方案'],
      ['openURL', '打开链接'],
      ['runScript', '运行脚本'],
      ['combine', '组合动作'],
    ];
    for (const [v, t] of options) {
      const o = document.createElement('option');
      o.value = v; o.textContent = t;
      sel.appendChild(o);
    }
    sel.value = type === 'unknown' ? 'none' : type;
    container.appendChild(sel);

    const valWrap = document.createElement('div');
    valWrap.className = 'act-value';
    container.appendChild(valWrap);

    function renderValue() {
      valWrap.innerHTML = '';
      const t = sel.value;
      if (t === 'none') return;
      if (t === 'standard') {
        const s2 = document.createElement('select');
        for (const [v, txt] of STANDARD) {
          const o = document.createElement('option');
          o.value = v; o.textContent = `${txt} (${v})`;
          s2.appendChild(o);
        }
        if (typeof action === 'string') s2.value = action;
        s2.onchange = () => onChange(s2.value);
        valWrap.appendChild(s2);
        if (typeof action !== 'string') onChange(s2.value);
      } else if (t === 'keyboardType') {
        const s2 = document.createElement('select');
        for (const [v, txt] of KEYBOARD_TYPES) {
          const o = document.createElement('option');
          o.value = v; o.textContent = `${txt} (${v})`;
          s2.appendChild(o);
        }
        const oCustom = document.createElement('option');
        oCustom.value = '__custom__'; oCustom.textContent = '自定义键盘…';
        s2.appendChild(oCustom);
        const inp = document.createElement('input');
        inp.type = 'text'; inp.placeholder = '自定义键盘名称'; inp.style.display = 'none';
        const cur = action && action.keyboardType;
        if (cur && KEYBOARD_TYPES.some(([k]) => k === cur)) s2.value = cur;
        else if (cur) { s2.value = '__custom__'; inp.style.display = ''; inp.value = cur; }
        const fire = () => {
          const v = s2.value === '__custom__' ? inp.value.trim() : s2.value;
          if (v) onChange({ keyboardType: v });
        };
        s2.onchange = () => { inp.style.display = s2.value === '__custom__' ? '' : 'none'; fire(); };
        inp.oninput = fire;
        valWrap.appendChild(s2); valWrap.appendChild(inp);
        if (!cur) fire();
      } else if (t === 'shortcut') {
        const s2 = document.createElement('select');
        for (const [v, zh] of SHORTCUT_PAIRS) {
          const o = document.createElement('option');
          o.value = v; o.textContent = `${zh}（${v}）`;
          s2.appendChild(o);
        }
        const oCustom = document.createElement('option');
        oCustom.value = '__custom__'; oCustom.textContent = '自定义指令…';
        s2.appendChild(oCustom);
        const inp = document.createElement('input');
        inp.type = 'text'; inp.placeholder = '如 #deleteText'; inp.style.display = 'none';
        const cur = action && action.shortcut;
        if (cur && SHORTCUTS.includes(cur)) s2.value = cur;
        else if (cur) { s2.value = '__custom__'; inp.style.display = ''; inp.value = cur; }
        const fire = () => {
          const v = s2.value === '__custom__' ? inp.value.trim() : s2.value;
          if (v) onChange({ shortcut: v });
        };
        s2.onchange = () => { inp.style.display = s2.value === '__custom__' ? '' : 'none'; fire(); };
        inp.oninput = fire;
        valWrap.appendChild(s2); valWrap.appendChild(inp);
        if (!cur) fire();
      } else if (t === 'combine') {
        const ta = document.createElement('textarea');
        ta.rows = 4;
        ta.placeholder = '每行一个动作（YAML），如：\n- keyboardType: alphabetic\n- switchRimeSchema: melt_eng';
        try {
          ta.value = action && action.combine ? jsyaml.dump(action.combine) : '';
        } catch (_) { ta.value = ''; }
        ta.onchange = () => {
          try {
            const arr = jsyaml.load(ta.value);
            if (Array.isArray(arr)) { ta.classList.remove('err'); onChange({ combine: arr }); }
            else ta.classList.add('err');
          } catch (_) { ta.classList.add('err'); }
        };
        valWrap.appendChild(ta);
      } else {
        // character / symbol / sendKeys / openURL / runScript / switchRimeSchema
        const inp = document.createElement('input');
        inp.type = 'text';
        const ph = {
          character: '单个字符，如 a', symbol: '符号内容，如 ！',
          sendKeys: '如 Shift+a 或 nihao', openURL: '如 https://… 或 #pasteboardContent',
          runScript: '脚本名称', switchRimeSchema: '方案 ID（推荐）或名称',
        };
        inp.placeholder = ph[t] || '';
        inp.value = action && typeof action === 'object' && action[t] != null ? String(action[t]) : '';
        inp.oninput = () => { if (inp.value !== '') onChange({ [t]: inp.value }); };
        valWrap.appendChild(inp);
      }
    }

    sel.onchange = () => {
      if (sel.value === 'none') { onChange(null); }
      action = null; // 类型切换后旧值失效
      renderValue();
    };
    renderValue();
  }

  return { STANDARD, SHORTCUTS, SHORTCUT_PAIRS, SHORTCUT_LABELS, KEYBOARD_TYPES, typeOf, label, buildEditor };
})();

<script>
/* =========================================================
 * inspector.js — 右侧属性检查器：按键 / 样式 / 气泡 / 动画 / 通知
 * ========================================================= */
'use strict';

const Inspector = (() => {
  const { el, field, section, textInput, numInput, selectInput, checkbox, colorInput, dimInput, insetsInput, pointInput, button, toast } = UI;

  // ============ 样式编辑器 ============
  const STYLE_TYPES = [
    ['geometry', '纯色/渐变（颜色·圆角·边框·阴影）'],
    ['text', '文字'],
    ['fileImage', '皮肤图片（你自己放的 PNG）'],
    ['systemImage', '系统图标（苹果 SF Symbols）'],
    ['assetImage', '应用内置图片'],
  ];

  const CONTENT_MODES = [
    ['', '（默认）'],
    ['scaleToFill', '拉伸填满（可能变形）'],
    ['scaleAspectFit', '等比缩放·完整显示（可能留白）'],
    ['scaleAspectFill', '等比缩放·填满（可能裁掉边）'],
    ['center', '原始大小·居中'],
  ];

  const FONT_WEIGHTS = [
    ['', '（默认）'], ['ultraLight', '极细'], ['thin', '纤细'], ['light', '细'],
    ['regular', '常规'], ['medium', '中等'], ['semibold', '半粗'], ['bold', '粗体'],
    ['heavy', '特粗'], ['black', '最粗'],
  ];

  function set(obj, key, val) {
    if (val == null || val === '') delete obj[key];
    else obj[key] = val;
  }

  // 渐变色（颜色数组）编辑
  // 修改按“样式名字”写入：开着「明暗同步改」时，浅色/深色里的同名样式一起更新
  function gradientInput(doc, styleName, key) {
    const wrap = el('div', 'grad-inp');
    const editStyle = mut => App.edit(d => {
      const st = d[styleName];
      if (st && typeof st === 'object') mut(st);
    });
    function draw() {
      wrap.innerHTML = '';
      const style = doc[styleName] || {};
      const v = style[key];
      const arr = v == null ? [] : (Array.isArray(v) ? v : [v]);
      arr.forEach((c, i) => {
        const row = el('div', 'grad-row');
        row.appendChild(colorInput(c, nv => {
          editStyle(st => {
            const a = Array.isArray(st[key]) ? st[key] : (st[key] != null ? [st[key]] : []);
            if (nv == null) a.splice(i, 1); else a[i] = nv;
            if (a.length === 0) delete st[key];
            else st[key] = a.length === 1 ? a[0] : a;
          });
          draw();
        }));
        const del = button('✕', () => {
          editStyle(st => {
            const a = Array.isArray(st[key]) ? st[key] : (st[key] != null ? [st[key]] : []);
            a.splice(i, 1);
            if (a.length === 0) delete st[key];
            else st[key] = a.length === 1 ? a[0] : a;
          });
          draw();
        }, 'mini-btn');
        row.appendChild(del);
        wrap.appendChild(row);
      });
      const add = button('＋ 加一个颜色（两个以上颜色=渐变过渡）', () => {
        editStyle(st => {
          const a = st[key] == null ? [] : (Array.isArray(st[key]) ? st[key] : [st[key]]);
          a.push('#888888');
          st[key] = a.length === 1 ? a[0] : a;
        });
        draw();
      }, 'btn small');
      wrap.appendChild(add);
    }
    draw();
    return wrap;
  }

  function styleNameOf(doc, style) {
    for (const k in doc) if (doc[k] === style) return k;
    return null;
  }

  // ============ 样式共享检测与「独立化」 ============
  // 统计样式名在整个文件里被引用的次数（深度扫描字符串值）
  function refCount(doc, styleName) {
    let count = 0;
    const walk = v => {
      if (typeof v === 'string') { if (v === styleName) count++; return; }
      if (Array.isArray(v)) { for (const x of v) walk(x); return; }
      if (v && typeof v === 'object') { for (const k in v) walk(v[k]); }
    };
    for (const k in doc) {
      if (k === styleName) continue; // 样式自身不算
      walk(doc[k]);
    }
    return count;
  }

  function uniqueName(doc, base) {
    let n = base, i = 2;
    while (doc[n] != null) n = base + i++;
    return n;
  }

  // 确保 def[refKey] 引用的样式只属于这个键：共享则自动克隆一份
  // 返回可以放心修改的样式对象；条件样式返回 null
  function ensureUniqueStyle(doc, keyName, def, refKey) {
    const ref = def[refKey];
    if (Array.isArray(ref)) return null; // 条件样式/多层，不在快速配色处理范围
    if (ref == null) {
      const n = uniqueName(doc, keyName + 'Bg');
      doc[n] = { buttonStyleType: 'geometry', cornerRadius: 5, insets: { top: 4, bottom: 4, left: 3, right: 3 } };
      def[refKey] = n;
      return doc[n];
    }
    if (typeof ref !== 'string') return typeof ref === 'object' ? ref : null;
    if (!doc[ref]) {
      doc[ref] = { buttonStyleType: 'geometry', cornerRadius: 5 };
      return doc[ref];
    }
    if (refCount(doc, ref) > 1) {
      const n = uniqueName(doc, keyName + 'Bg');
      doc[n] = JSON.parse(JSON.stringify(doc[ref]));
      def[refKey] = n;
      return doc[n];
    }
    return doc[ref];
  }

  // 前景样式独立化：对 string 或 [string] 引用里满足 predicate 的样式做克隆，返回可修改的样式对象列表
  function ensureUniqueFgStyles(doc, keyName, def, predicate) {
    const ref = def.foregroundStyle;
    if (ref == null) return [];
    const isArr = Array.isArray(ref);
    const names = isArr ? ref : [ref];
    const out = [];
    names.forEach((n, i) => {
      if (typeof n !== 'string') return;
      const st = doc[n];
      if (!st || typeof st !== 'object') return;
      if (!predicate(st)) return;
      if (refCount(doc, n) > 1) {
        const nn = uniqueName(doc, keyName + 'Fg');
        doc[nn] = JSON.parse(JSON.stringify(st));
        if (isArr) ref[i] = nn; else def.foregroundStyle = nn;
        out.push(doc[nn]);
      } else {
        out.push(st);
      }
    });
    return out;
  }

  // 图片选择：文件 + 切片
  function imagePicker(value, onChange) {
    const wrap = el('div', 'img-picker');
    const v = value || {};
    const mode = Renderer.state.mode;
    const files = Object.keys(SkinModel.model.resources[mode]);
    const other = Object.keys(SkinModel.model.resources[mode === 'light' ? 'dark' : 'light']).filter(f => !files.includes(f));
    const fileSel = el('select');
    fileSel.appendChild(new Option('（无）', ''));
    for (const f of [...files, ...other]) fileSel.appendChild(new Option(f, f));
    fileSel.value = v.file || '';
    const sliceSel = el('select');
    const thumb = el('canvas', 'img-thumb');
    thumb.width = 72; thumb.height = 48;

    function refreshSlices() {
      sliceSel.innerHTML = '';
      sliceSel.appendChild(new Option('（整张图）', ''));
      const res = fileSel.value ? SkinModel.getResource(mode, fileSel.value) : null;
      if (res) {
        for (const s of Object.keys(res.slices || {})) sliceSel.appendChild(new Option(s, s));
      }
      sliceSel.value = v.image || '';
      drawThumb();
    }
    function drawThumb() {
      const ctx = thumb.getContext('2d');
      ctx.clearRect(0, 0, thumb.width, thumb.height);
      const res = fileSel.value ? SkinModel.getResource(mode, fileSel.value) : null;
      if (!res || !res.img) return;
      let r = { x: 0, y: 0, width: res.img.naturalWidth, height: res.img.naturalHeight };
      if (sliceSel.value && res.slices[sliceSel.value] && res.slices[sliceSel.value].rect) r = res.slices[sliceSel.value].rect;
      const s = Math.min(thumb.width / r.width, thumb.height / r.height);
      const w = r.width * s, h = r.height * s;
      ctx.drawImage(res.img, r.x, r.y, r.width, r.height, (thumb.width - w) / 2, (thumb.height - h) / 2, w, h);
    }
    function emit() {
      if (!fileSel.value) { onChange(null); return; }
      const out = { file: fileSel.value };
      if (sliceSel.value) out.image = sliceSel.value;
      onChange(out);
    }
    fileSel.onchange = () => { v.image = ''; refreshSlices(); emit(); };
    sliceSel.onchange = () => { drawThumb(); emit(); };
    refreshSlices();
    wrap.appendChild(fileSel);
    wrap.appendChild(sliceSel);
    wrap.appendChild(thumb);
    return wrap;
  }

  // 常用 SF Symbols（苹果内置图标）中文对照：[图标名, 中文说明]
  const SF_COMMON = [
    ['delete.left', '删除键 ⌫'], ['delete.left.fill', '删除键（实心）'],
    ['shift', 'Shift 上档 ⇧'], ['shift.fill', 'Shift（按下）'], ['capslock', '大写锁定 ⇪'], ['capslock.fill', '大写锁定（实心）'],
    ['globe', '切换输入法 🌐'], ['keyboard', '键盘'], ['keyboard.chevron.compact.down', '收起键盘'],
    ['return', '回车 ⏎'], ['mic', '麦克风 / 听写'], ['mic.fill', '麦克风（实心）'],
    ['face.smiling', '笑脸 / 表情'], ['gearshape', '设置齿轮'], ['magnifyingglass', '搜索放大镜'],
    ['arrow.up', '箭头 上'], ['arrow.down', '箭头 下'], ['arrow.left', '箭头 左'], ['arrow.right', '箭头 右'],
    ['chevron.up', '尖角 上'], ['chevron.down', '尖角 下'], ['chevron.left', '尖角 左'], ['chevron.right', '尖角 右'],
    ['xmark', '关闭 ✕'], ['ellipsis', '更多 ⋯'], ['list.bullet', '列表'], ['square.grid.2x2', '四宫格菜单'],
    ['doc.on.doc', '复制'], ['doc.on.clipboard', '剪贴板 / 粘贴'], ['paperplane', '发送 ➤'],
    ['textformat', '字体 Aa'], ['textformat.123', '数字 123'], ['textformat.abc', '字母 abc'],
    ['plus', '加号'], ['minus', '减号'], ['pencil', '铅笔 / 编辑'], ['scissors', '剪切'],
    ['trash', '垃圾桶'], ['arrow.uturn.left', '撤销 ↩'], ['arrow.uturn.right', '重做 ↪'],
    ['arrow.left.arrow.right', '左右互换 ⇆'], ['sun.max', '太阳'], ['moon', '月亮'],
    ['star', '星星'], ['star.fill', '星星（实心）'], ['heart', '爱心'], ['heart.fill', '爱心（实心）'],
    ['hand.thumbsup', '点赞'], ['translate', '翻译（需 iOS 17.4+）'], ['photo', '图片'], ['sparkles', '星光 ✦'],
    ['cloud', '云朵'], ['flame', '火焰'], ['leaf', '叶子'], ['bookmark', '书签'], ['quotelevel', '引号'],
  ];

  // 图标选择弹窗：中文名 + 近似字形，点选即填入
  function openSFPicker(cb) {
    const m = UI.modal('选一个苹果内置图标（SF Symbols）', '500px');
    const inp = el('input'); inp.type = 'text'; inp.placeholder = '搜索中文或英文名…'; inp.style.width = '100%';
    const grid = el('div', 'sf-grid');
    function draw() {
      grid.innerHTML = '';
      const q = inp.value.trim().toLowerCase();
      for (const [name, zh] of SF_COMMON) {
        if (q && !name.toLowerCase().includes(q) && !zh.toLowerCase().includes(q)) continue;
        const b = button('', () => { m.close(); cb(name); }, 'sf-item');
        const glyph = Renderer.sfGlyph(name) || '·';
        b.innerHTML = `<span class="sf-glyph">${glyph}</span><span class="sf-zh">${zh}</span><span class="sf-name">${name}</span>`;
        grid.appendChild(b);
      }
    }
    inp.oninput = draw;
    m.body.appendChild(inp);
    m.body.appendChild(grid);
    m.body.appendChild(el('div', 'hint-line', '这里只列出键盘常用图标。苹果全部图标可在「SF Symbols」App 查名字，直接填进输入框也行。\n预览里用近似字符表示，真机上显示的是苹果官方图标。'));
    draw();
  }

  // 完整样式对象编辑器（styleName 是 doc 中的键）
  // 所有修改都按“样式名字”写入两种模式：开着「明暗同步改」时，深色模式同名样式一起更新，
  // 手机夜间模式不再丢修改
  function buildStyleEditor(container, doc, styleName) {
    container.innerHTML = '';
    let style = doc[styleName];
    const editStyle = mut => App.edit(d => {
      const st = d[styleName];
      if (st && typeof st === 'object') mut(st);
    });
    if (!style || typeof style !== 'object') {
      const p = el('div', 'hint-line', `样式 "${styleName}" 不存在`);
      const b = button('创建这个样式', () => {
        App.edit(d => { d[styleName] = { buttonStyleType: 'geometry', normalColor: '#ffffff', cornerRadius: 5 }; });
        buildStyleEditor(container, doc, styleName);
      }, 'btn small');
      container.appendChild(p); container.appendChild(b);
      return;
    }

    const typeSel = selectInput(style.buttonStyleType || 'geometry', STYLE_TYPES, v => {
      editStyle(st => { st.buttonStyleType = v; });
      buildStyleEditor(container, doc, styleName);
    });
    container.appendChild(field('样式类型', typeSel));

    const type = style.buttonStyleType || 'geometry';

    container.appendChild(field('内边距 insets（四周留白，按键间隙就是这么来的）', insetsInput(style.insets, v => editStyle(st => set(st, 'insets', v)))));

    if (type === 'geometry') {
      container.appendChild(field('常态颜色（加多个颜色=渐变）', gradientInput(doc, styleName, 'normalColor')));
      container.appendChild(field('按下颜色（手指按住时显示）', gradientInput(doc, styleName, 'highlightColor')));
      container.appendChild(field('圆角半径（越大越圆润）', numInput(style.cornerRadius, v => editStyle(st => set(st, 'cornerRadius', v)), { step: 0.5, min: 0 })));
      container.appendChild(field('边框宽度', numInput(style.borderSize, v => editStyle(st => set(st, 'borderSize', v)), { step: 0.5, min: 0 })));
      container.appendChild(field('常态边框色', colorInput(style.normalBorderColor, v => editStyle(st => set(st, 'normalBorderColor', v)))));
      container.appendChild(field('按下边框色', colorInput(style.highlightBorderColor, v => editStyle(st => set(st, 'highlightBorderColor', v)))));
      container.appendChild(field('常态底边色（键底一条 3D 立体边）', colorInput(style.normalLowerEdgeColor, v => editStyle(st => set(st, 'normalLowerEdgeColor', v)))));
      container.appendChild(field('按下底边色（3D）', colorInput(style.highlightLowerEdgeColor, v => editStyle(st => set(st, 'highlightLowerEdgeColor', v)))));
      container.appendChild(field('常态阴影色', colorInput(style.normalShadowColor, v => editStyle(st => set(st, 'normalShadowColor', v)))));
      container.appendChild(field('按下阴影色', colorInput(style.highlightShadowColor, v => editStyle(st => set(st, 'highlightShadowColor', v)))));
      container.appendChild(field('阴影透明度 0~1', numInput(style.shadowOpacity, v => editStyle(st => set(st, 'shadowOpacity', v)), { step: 0.05, min: 0, max: 1 })));
      container.appendChild(field('阴影模糊半径', numInput(style.shadowRadius, v => editStyle(st => set(st, 'shadowRadius', v)), { step: 0.5, min: 0 })));
      container.appendChild(field('阴影偏移（x 往右 / y 往下）', pointInput(style.shadowOffset ? { ...style.shadowOffset } : null, v => editStyle(st => set(st, 'shadowOffset', v)))));
      const gradSec = section('渐变高级设置', false);
      gradSec.body.appendChild(field('渐变类型', selectInput(style.colorGradientType || '', [['', '（线性·默认）'], ['axial', '线性 axial（直线过渡）'], ['radial', '辐射 radial（从中心向外）'], ['conic', '锥形 conic（绕圈过渡）']], v => editStyle(st => set(st, 'colorGradientType', v)))));
      gradSec.body.appendChild(field('渐变起点（0~1，左上角是 0,0）', pointInput(style.colorStartPoint ? { ...style.colorStartPoint } : null, v => editStyle(st => set(st, 'colorStartPoint', v)), { step: 0.01, min: 0, max: 1 })));
      gradSec.body.appendChild(field('渐变终点（0~1，右下角是 1,1）', pointInput(style.colorEndPoint ? { ...style.colorEndPoint } : null, v => editStyle(st => set(st, 'colorEndPoint', v)), { step: 0.01, min: 0, max: 1 })));
      gradSec.body.appendChild(field('颜色位置数组（每个颜色停在哪，0~1）', textInput((style.colorLocation || []).join(', '), v => editStyle(st => {

    } else if (type === 'text') {

      container.appendChild(field('常态文字色', colorInput(style.normalColor, v => editStyle(st => set(st, 'normalColor', v)))));
      container.appendChild(field('按下文字色', colorInput(style.highlightColor, v => editStyle(st => set(st, 'highlightColor', v)))));
      container.appendChild(field('位置微调 center（0~1，0.5,0.5=正中）', pointInput(style.center ? { ...style.center } : null, v => editStyle(st => set(st, 'center', v)), { step: 0.01, defaultVal: 0.5, min: 0, max: 1 })));
    } else if (type === 'fileImage') {
      container.appendChild(field('常态图片', imagePicker(style.normalImage, v => editStyle(st => set(st, 'normalImage', v)))));
      container.appendChild(field('按下图片', imagePicker(style.highlightImage, v => editStyle(st => set(st, 'highlightImage', v)))));
      container.appendChild(field('显示模式（图片怎么塞进按键）', selectInput(style.contentMode || '', CONTENT_MODES, v => editStyle(st => set(st, 'contentMode', v)))));
      container.appendChild(field('位置微调 center（0~1）', pointInput(style.center ? { ...style.center } : null, v => editStyle(st => set(st, 'center', v)), { step: 0.01, defaultVal: 0.5, min: 0, max: 1 })));
    } else if (type === 'systemImage') {
      const sfBox = el('div');
      sfBox.appendChild(textInput(style.systemImageName, v => editStyle(st => set(st, 'systemImageName', v)), '如 delete.left'));
      sfBox.appendChild(button('🔍 从常用图标选（带中文对照）', () => {
        openSFPicker(name => {
          editStyle(st => set(st, 'systemImageName', name));
          buildStyleEditor(container, doc, styleName);
        });
      }, 'btn small'));
      container.appendChild(field('SF 图标名称（苹果内置图标）', sfBox));
      container.appendChild(field('按下时换成的图标', textInput(style.highlightSystemImageName, v => editStyle(st => set(st, 'highlightSystemImageName', v)), '留空=不换')));
      container.appendChild(field('图标大小', numInput(style.fontSize, v => editStyle(st => set(st, 'fontSize', v)), { step: 0.5, min: 1 })));
      container.appendChild(field('粗细', selectInput(typeof style.fontWeight === 'string' ? style.fontWeight : '', FONT_WEIGHTS, v => editStyle(st => set(st, 'fontWeight', v)))));
