      container.appendChild(field('阴影透明度 0~1', numInput(style.shadowOpacity, v => editStyle(st => set(st, 'shadowOpacity', v)), { step: 0.05, min: 0, max: 1 })));
      container.appendChild(field('阴影模糊半径', numInput(style.shadowRadius, v => editStyle(st => set(st, 'shadowRadius', v)), { step: 0.5, min: 0 })));
      container.appendChild(field('阴影偏移（x 往右 / y 往下）', pointInput(style.shadowOffset ? { ...style.shadowOffset } : null, v => editStyle(st => set(st, 'shadowOffset', v)))));
      const gradSec = section('渐变高级设置', false);
      gradSec.body.appendChild(field('渐变类型', selectInput(style.colorGradientType || '', [['', '（线性·默认）'], ['axial', '线性 axial（直线过渡）'], ['radial', '辐射 radial（从中心向外）'], ['conic', '锥形 conic（绕圈过渡）']], v => editStyle(st => set(st, 'colorGradientType', v)))));
      gradSec.body.appendChild(field('渐变起点（0~1，左上角是 0,0）', pointInput(style.colorStartPoint ? { ...style.colorStartPoint } : null, v => editStyle(st => set(st, 'colorStartPoint', v)), { step: 0.01, min: 0, max: 1 })));
      gradSec.body.appendChild(field('渐变终点（0~1，右下角是 1,1）', pointInput(style.colorEndPoint ? { ...style.colorEndPoint } : null, v => editStyle(st => set(st, 'colorEndPoint', v)), { step: 0.01, min: 0, max: 1 })));
      gradSec.body.appendChild(field('颜色位置数组（每个颜色停在哪，0~1）', textInput((style.colorLocation || []).join(', '), v => editStyle(st => {
        const arr = v.split(',').map(s => parseFloat(s)).filter(n => isFinite(n));
        set(st, 'colorLocation', arr.length ? arr : null);
      }), '如 0, 0.5, 1')));
      container.appendChild(gradSec.root);
    } else if (type === 'text') {
      container.appendChild(field('文本内容', textInput(style.text, v => editStyle(st => set(st, 'text', v)), '支持 $rimePreedit 等变量')));
      const vars = el('div', 'hint-line', '特殊变量（写进文本会自动被替换）：\n$rimePreedit 正在打的拼音 / $rimeCandidate 第一个候选词 / $rimeCandidateComment 候选词注释\n$rimeSchemaName 输入方案名 / $returnKeyType 回车键文字（发送/搜索…随 App 变）');
      container.appendChild(vars);
      container.appendChild(field('字号', numInput(style.fontSize, v => editStyle(st => set(st, 'fontSize', v)), { step: 0.5, min: 1 })));
      container.appendChild(field('字重（笔画粗细）', selectInput(typeof style.fontWeight === 'string' ? style.fontWeight : '', FONT_WEIGHTS, v => editStyle(st => set(st, 'fontWeight', v)))));
      container.appendChild(field('常态文字色', colorInput(style.normalColor, v => editStyle(st => set(st, 'normalColor', v)))));
      container.appendChild(field('按下文字色', colorInput(style.highlightColor, v => editStyle(st => set(st, 'highlightColor', v)))));
      container.appendChild(field('位置微调 center（0~1，0.5,0.5=正中）', pointInput(style.center ? { ...style.center } : null, v => editStyle(st => set(st, 'center', v)), { step: 0.01, defaultVal: 0.5, min: 0, max: 1 })));
    } else if (type === 'fileImage') {
      container.appendChild(field('常态图片', imagePicker(style.normalImage, v => editStyle(st => set(st, 'normalImage', v)))));
      container.appendChild(field('按下图片', imagePicker(style.highlightImage, v => editStyle(st => set(st, 'highlightImage', v)))));
      container.appendChild(field('显示模式（图片怎么塞进按键）', selectInput(style.contentMode || '', CONTENT_MODES, v => editStyle(st => set(st, 'contentMode', v)))));
      container.appendChild(field('位置微调 center（0~1）', pointInput(style.center ? { ...style.center } : null, v => editStyle(st => set(st, 'center', v)), { step: 0.01, defaultVal: 0.5, min: 0, max: 1 })));
    } else if (type === 'systemImage') {
      const sfBox = el('div');
      sfBox.appendChild(textInput(style.systemImageName, v => editStyle(st => set(st, 'systemImageName', v)), '如 delete.left'));
      sfBox.appendChild(button('🔍 从常用图标选（带中文对照）', () => {
        openSFPicker(name => {
          editStyle(st => set(st, 'systemImageName', name));
          buildStyleEditor(container, doc, styleName);
        });
      }, 'btn small'));
      container.appendChild(field('SF 图标名称（苹果内置图标）', sfBox));
      container.appendChild(field('按下时换成的图标', textInput(style.highlightSystemImageName, v => editStyle(st => set(st, 'highlightSystemImageName', v)), '留空=不换')));
      container.appendChild(field('图标大小', numInput(style.fontSize, v => editStyle(st => set(st, 'fontSize', v)), { step: 0.5, min: 1 })));
      container.appendChild(field('粗细', selectInput(typeof style.fontWeight === 'string' ? style.fontWeight : '', FONT_WEIGHTS, v => editStyle(st => set(st, 'fontWeight', v)))));
      container.appendChild(field('常态颜色', colorInput(style.normalColor, v => editStyle(st => set(st, 'normalColor', v)))));
      container.appendChild(field('按下颜色', colorInput(style.highlightColor, v => editStyle(st => set(st, 'highlightColor', v)))));
      container.appendChild(field('显示模式', selectInput(style.contentMode || '', CONTENT_MODES, v => editStyle(st => set(st, 'contentMode', v)))));
      container.appendChild(el('div', 'hint-line',
        '预览中 SF 图标用近似字符显示，真机效果以 iOS 为准。\n' +
        '📱 真机上图标不显示（空白）的两大原因：\n' +
        '① 图标名拼写错误（大小写、圆点都不能错）\n' +
        '② 你的 iOS 版本还没有这个图标（新图标需要新系统）\n' +
        '不确定就在苹果「SF Symbols」App 里查，或干脆改用「文字」类型直接打一个字符（如 ⇧ ⌫ ⏎）。'));
    } else if (type === 'assetImage') {
      container.appendChild(field('内置图片名称（元书 App 自带的图片）', textInput(style.assetImageName, v => editStyle(st => set(st, 'assetImageName', v)))));
      container.appendChild(field('常态颜色', colorInput(style.normalColor, v => editStyle(st => set(st, 'normalColor', v)))));
      container.appendChild(field('按下颜色', colorInput(style.highlightColor, v => editStyle(st => set(st, 'highlightColor', v)))));
      container.appendChild(field('显示模式', selectInput(style.contentMode || '', CONTENT_MODES, v => editStyle(st => set(st, 'contentMode', v)))));
    }

    // 原始 YAML
    const rawSec = section('此样式的 YAML 源码', false);
    const ta = el('textarea', 'raw-ta');
    ta.rows = 8;
    ta.value = SkinModel.yamlDump({ [styleName]: style });
    ta.onchange = () => {
      try {
        const obj = jsyaml.load(ta.value);
        const newStyle = obj && obj[styleName] != null ? obj[styleName] : obj;
        App.edit(d => { d[styleName] = newStyle; });
        ta.classList.remove('err');
        buildStyleEditor(container, doc, styleName);
      } catch (e) { ta.classList.add('err'); toast('YAML 有误：' + e.message, true); }
    };
    rawSec.body.appendChild(ta);
    container.appendChild(rawSec.root);
  }

  // ============ 样式引用编辑（string | [string] | 条件样式） ============
  // opts.resolveOwner(d)：在任一模式的文档 d 里找到同一个宿主对象。
  // 提供它之后，引用的增删改会同步写进浅色和深色两份文件；不提供则只改当前模式。
  function styleRefEditor(container, doc, owner, key, opts = {}) {
    container.innerHTML = '';
    const resolveOwner = opts.resolveOwner || (d => (d === doc ? owner : null));
    const editOwner = mut => App.edit(d => {
      const o = resolveOwner(d);
      if (o && typeof o === 'object') mut(o);
    });
    const ref = owner[key];
    const isCondition = Array.isArray(ref) && ref.some(x => x && typeof x === 'object');

    if (isCondition) {
      const hint = el('div', 'hint-line', '这是「条件样式」（按条件切换样式的高级写法），用 YAML 直接编辑：');
      container.appendChild(hint);
      const ta = el('textarea', 'raw-ta'); ta.rows = 6;
      ta.value = SkinModel.yamlDump(ref);
      ta.onchange = () => {
        try {
          const v = jsyaml.load(ta.value);
          editOwner(o => { o[key] = v; });
          ta.classList.remove('err');
        } catch (e) { ta.classList.add('err'); }
      };
      container.appendChild(ta);
      return;
    }

    const names = ref == null ? [] : (Array.isArray(ref) ? [...ref] : [ref]);

    function commitNames(list) {
      editOwner(o => {
        if (!list.length) delete o[key];
        else if (list.length === 1 && !opts.forceArray) o[key] = list[0];
        else o[key] = [...list];
      });
      styleRefEditor(container, doc, owner, key, opts);
    }

    names.forEach((n, i) => {
      const row = el('div', 'ref-row');
      const nameBtn = button(n, () => {
        openStyleModal(doc, n);
      }, 'ref-name');
      nameBtn.title = '点击编辑这个样式';
      if (!doc[n]) { nameBtn.classList.add('missing'); nameBtn.title = '样式不存在（点击创建）'; }
      row.appendChild(nameBtn);
      const ren = button('改名', () => {
        const nn = prompt('引用的样式名称：', n);
        if (nn && nn !== n) { const l = [...names]; l[i] = nn; commitNames(l); }
      }, 'mini-btn');
      row.appendChild(ren);
      if (opts.multi) {
        if (i > 0) row.appendChild(button('↑', () => { const l = [...names];[l[i - 1], l[i]] = [l[i], l[i - 1]]; commitNames(l); }, 'mini-btn'));
      }
      row.appendChild(button('✕', () => { const l = [...names]; l.splice(i, 1); commitNames(l); }, 'mini-btn'));
      container.appendChild(row);
    });

    const tools = el('div', 'ref-tools');
    if (opts.multi || !names.length) {
      tools.appendChild(button('＋引用已有样式', () => {
        pickStyleName(doc, n => { commitNames([...names, n]); });
      }, 'btn small'));
      tools.appendChild(button('＋新建样式', () => {
        const base = (opts.baseName || key) + 'Style';
        let n = base, i = 2;
        while (doc[n]) n = base + i++;
        App.edit(d => { d[n] = { buttonStyleType: opts.defaultType || 'geometry' }; });
        commitNames([...names, n]);
        openStyleModal(doc, n);
      }, 'btn small'));
    }
    container.appendChild(tools);
  }

  function pickStyleName(doc, cb) {
    const m = UI.modal('选择样式', '420px');
    const inp = el('input'); inp.type = 'text'; inp.placeholder = '搜索…';
    inp.style.width = '100%';
    const list = el('div', 'pick-list');
    function draw() {
      list.innerHTML = '';
      const q = inp.value.trim().toLowerCase();
      const keys = Object.keys(doc).filter(k => {
        const v = doc[k];
        return v && typeof v === 'object' && !Array.isArray(v) &&
          (v.buttonStyleType || v.normalColor != null || v.normalImage || v.text != null);
      }).filter(k => !q || k.toLowerCase().includes(q)).sort();
      for (const k of keys.slice(0, 200)) {
        const it = button(k, () => { m.close(); cb(k); }, 'pick-item');
        list.appendChild(it);
      }
    }
    inp.oninput = draw;
    m.body.appendChild(inp);
    m.body.appendChild(list);
    draw();
  }

  function openStyleModal(doc, styleName) {
    const m = UI.modal(`编辑样式：${styleName}`, '480px');
    const box = el('div');
    m.body.appendChild(box);
    buildStyleEditor(box, doc, styleName);
  }

  // ============ 动作字段编辑 ============
  // resolveOwner(d)：在任一模式文档里找到同一宿主对象，动作修改会同步浅色+深色
  function actionField(container, doc, owner, key, labelText, resolveOwner) {
    const resolve = resolveOwner || (d => (d === doc ? owner : null));
    const wrap = el('div', 'act-field');
    const head = el('div', 'act-head');
    head.appendChild(el('span', 'fld-label', labelText));
    head.appendChild(el('span', 'act-cur', Actions.label(owner[key])));
    wrap.appendChild(head);
    const box = el('div', 'act-box');
    wrap.appendChild(box);
    Actions.buildEditor(box, owner[key], v => {
      App.edit(d => {
        const o = resolve(d);
        if (!o || typeof o !== 'object') return;
        if (v == null) delete o[key];
        else o[key] = JSON.parse(JSON.stringify(v));
      });
      head.querySelector('.act-cur').textContent = Actions.label(owner[key]);
    });
    container.appendChild(wrap);
  }

  // ============ 按下动画效果库 ============
  // 时长单位是"毫秒"。实测流行皮肤（喜乐/好春光）都用 50~190 这种数值；
  // 用 0.85/0.1 这种"秒"的小数在真机上时长≈0、看不到动画，所以全部统一用毫秒。
  const ANIM_PRESETS = [
    { id: 'official', animName: 'scaleAnimation', name: '轻快（推荐）★', desc: '轻微缩小、干脆利落（scale 0.95 / 60 / 90 毫秒·流行皮肤同款）',
      def: { animationType: 'scale', isAutoReverse: true, scale: 0.95, pressDuration: 60, releaseDuration: 90 } },
    { id: 'pressLight',   name: '轻按缩小',   desc: '轻微缩小，干脆利落（流行皮肤参数风格）',
      def: { animationType: 'scale', isAutoReverse: true, scale: 0.95, pressDuration: 50, releaseDuration: 80 } },
    { id: 'pressClassic', name: '经典回弹',   desc: '明显但不夸张（与热门皮肤「喜乐」同款参数风格）',
      def: { animationType: 'scale', isAutoReverse: true, scale: 0.88, pressDuration: 70, releaseDuration: 110 } },
    { id: 'pressJelly',   name: 'Q弹果冻',    desc: '缩得更小、回弹更久，软软的',
      def: { animationType: 'scale', isAutoReverse: true, scale: 0.78, pressDuration: 90, releaseDuration: 190 } },
    { id: 'pressPop',     name: '放大弹出',   desc: '按下反而变大，像冒泡泡',
      def: { animationType: 'scale', isAutoReverse: true, scale: 1.12, pressDuration: 60, releaseDuration: 130 } },
    { id: 'pressHold',    name: '长按跟手',   desc: '按住时一直缩着，松手才弹回（isAutoReverse: false）',
      def: { animationType: 'scale', isAutoReverse: false, scale: 0.9, pressDuration: 80, releaseDuration: 120 } },
  ];

  // 选择动画效果弹窗；onPick(presetId) 由调用方决定应用到一个键还是全部键
  function openAnimPresetPicker(onPick) {
    const m = UI.modal('选一个按键动画（按下缩放/回弹）', '440px');
    for (const p of ANIM_PRESETS) {
      const item = button('', () => { m.close(); onPick(p); }, 'pick-item');
      item.innerHTML = `<b>${p.name}</b><br><span style="opacity:.65;font-size:12px">${p.desc}</span>`;
      m.body.appendChild(item);
    }
    m.body.appendChild(el('div', 'hint-line',
      '「官方文档示例」和其余几种的时长写法不同（0.85 vs 70）——如果一种在手机上没动静，就换另一种风格试试。\n想要「按键特效」（按下弹出图片/飞溅）用「＋添加按键动画 / 按键特效」里的图片帧/图片飞溅（需要先在「图片」页放入 PNG）。'));
  }

  // 确保预设动画定义存在于 doc，返回定义名
  function ensurePresetAnim(d, preset) {
    const n = preset.animName || (preset.id + 'Animation');
    d[n] = JSON.parse(JSON.stringify(preset.def));
    return n;
  }

  function animationEditor(container, doc, def) {
    container.innerHTML = '';
    // 任何动画改动都标记 animationDirty：jsonnet 皮肤导出时才会生成"动画覆盖层"，重编译后动画不丢
    const editA = (fn, raw) => { App.edit(fn, raw); SkinModel.markAnimationDirty(); };
    const names = def.animation == null ? [] : (Array.isArray(def.animation) ? [...def.animation] : [def.animation]);

    if (names.length) {
      container.appendChild(button('▶ 试玩动画（在预览里看效果）', () => App.testAnimation(App.selection), 'btn small'));
      container.appendChild(button('换一种效果…', () => {
        openAnimPresetPicker(p => {
          editA(d => {
            const dd = d[App.selection]; if (!dd) return;
            const n = ensurePresetAnim(d, p);
            dd.animation = [n];
          });
          animationEditor(container, doc, def);
          setTimeout(() => App.testAnimation(App.selection), 100);
        });
      }, 'btn small'));
      // 满意了？一键铺满整套皮肤
      container.appendChild(button('⚡ 把这个效果应用到所有键盘的全部按键', () => {
        const defsMap = {};
        let hasInline = false;
        for (const n of names) {
          if (typeof n === 'string' && doc[n] && doc[n].animationType) defsMap[n] = doc[n];
          else hasInline = true;
        }
        if (!Object.keys(defsMap).length) { toast('这个键的动画无法批量复制', true); return; }
        if (!confirm('把这个键的动画效果应用到整套皮肤所有键盘（拼音/数字/符号/横竖屏/iPad，浅色+深色）的全部按键吗？\n每个键原有的动画会被替换。（可撤销）')) return;
        const r = App.applyAnimationEverywhere(defsMap, 'all');
        toast(`搞定！${r.boards} 个键盘、${r.keys} 个按键全部用上了这个效果` + (hasInline ? '（个别内联动画已跳过）' : ''));
      }, 'btn small'));
    } else {
      container.appendChild(button('＋ 加按键动画（按下缩放/回弹·6 种预设）', () => {
        openAnimPresetPicker(p => {
          editA(d => {
            const dd = d[App.selection]; if (!dd) return;
            const n = ensurePresetAnim(d, p);
            dd.animation = [n];
          });
          animationEditor(container, doc, def);
          setTimeout(() => App.testAnimation(App.selection), 100);
          toast(`已添加「${p.name}」！按住这个键随时看效果`);
        });
      }, 'btn small'));
    }

    // scale=按键动画（按键缩放）；cartoon/physics=按键特效（按下弹出图片）
    const animKindLabel = t => t === 'scale' ? '动画·缩放' : (t === 'cartoon' ? '特效·图片帧' : t === 'physics' ? '特效·图片飞溅' : (t || '?'));
    names.forEach((n, i) => {
      const row = el('div', 'ref-row');
      const nameBtn = button(n + (doc[n] ? `（${animKindLabel(doc[n].animationType)}）` : '（不存在）'), () => openAnimationModal(doc, n), 'ref-name');
      row.appendChild(nameBtn);
      row.appendChild(button('✕', () => {
        editA(() => {
          const l = [...names]; l.splice(i, 1);
          if (!l.length) delete def.animation; else def.animation = l;
        });
        animationEditor(container, doc, def);
      }, 'mini-btn'));
      container.appendChild(row);
    });
    container.appendChild(button('＋ 添加按键动画 / 按键特效', () => {
      const existing = Object.keys(doc).filter(k => doc[k] && typeof doc[k] === 'object' && doc[k].animationType);
      const m = UI.modal('添加按键动画 / 按键特效', '440px');
      m.body.appendChild(el('div', 'hint-line',
        '• 按键动画＝按下时按键本身缩放/回弹（不用图片）\n• 按键特效＝按下后从键上弹出图片/飞溅'));
      // 从特效参考库选（自带图片，直接用）
      const fxPresets = window.__EFFECT_PRESETS || [];
      if (fxPresets.length && App.selection) {
        m.body.appendChild(el('div', 'hint-line', '✨ 特效参考库（自带图片，点一下就给这个键加上）：'));
        for (const fx of fxPresets) {
          const it = button('', async () => {
            m.close();
            try { await App.applyEffectPreset(fx, 'key'); animationEditor(container, doc, def); setTimeout(() => App.testAnimation(App.selection), 150); toast(`已给这个键加特效「${fx.name}」（可与按键动画共存）`); }
            catch (e) { toast('加特效失败：' + e.message, true); }
          }, 'pick-item');
          const cog = el('span', 'fx-cog', ' 🎛');
          cog.title = '自定义参数'; cog.style.cssText = 'cursor:pointer;float:right';
          cog.onclick = (ev) => { ev.stopPropagation(); m.close(); Panels.openEffectCustomizer(fx, 'key'); };
          it.innerHTML = `<b>✨ ${fx.name}</b><br><span style="opacity:.65;font-size:12px">${fx.desc} · ${fx.frames.length}帧 · 来自「${fx.from}」</span>`;
          it.appendChild(cog);
          m.body.appendChild(it);
        }
        m.body.appendChild(button('📥 导入自己的帧动画特效（选多张 PNG）', () => { m.close(); Panels.importCustomEffect('cartoon'); }, 'pick-item'));
        m.body.appendChild(button('📥 导入自己的飞溅特效（选多张 PNG）', () => { m.close(); Panels.importCustomEffect('physics'); }, 'pick-item'));
        m.body.appendChild(el('div', 'hint-line', '—— 或自己新建 ——'));
      }
      for (const k of existing) {
        m.body.appendChild(button(`引用已有：${k}（${animKindLabel(doc[k].animationType)}）`, () => {
          m.close();
          editA(() => { def.animation = [...names, k]; });
          animationEditor(container, doc, def);
        }, 'pick-item'));
      }
      for (const [t, lab] of [['scale', '🎬 按键动画：按下缩放/回弹'], ['cartoon', '✨ 按键特效：按下播放图片帧（需图片）'], ['physics', '✨ 按键特效：按下图片飞溅/掉落（需图片）']]) {
        m.body.appendChild(button('＋ ' + lab, () => {
          m.close();
          let n = t + 'Animation', i = 2;
          while (doc[n]) n = t + 'Animation' + i++;
          // 默认值与官方文档示例保持一致
          const defaults = {
            scale: { animationType: 'scale', isAutoReverse: true, scale: 0.95, pressDuration: 60, releaseDuration: 90 },
            cartoon: { animationType: 'cartoon', fps: 30, zPosition: 'above', images: [] },
            physics: { animationType: 'physics', duration: 0.6, images: [], startPosition: { x: 0, y: 0 }, endPosition: { x: 0, y: -10 } },
          };
          editA(d => { d[n] = defaults[t]; def.animation = [...names, n]; });
          animationEditor(container, doc, def);
          openAnimationModal(doc, n);
        }, 'pick-item'));
      }
    }, 'btn small'));
    if (names.length) {
      container.appendChild(el('div', 'hint-line', '提示：在预览里按住这个键就会播放；按键特效（图片帧/飞溅）的图片名要填「图片」页里存在的 PNG 文件名。'));
    }
    if (SkinModel.hasJsonnet()) {
      container.appendChild(el('div', 'hint-line',
        '✓ 这是 jsonnet 编译型皮肤：你改的按键动画会在【导出时】自动写进一层 jsonnet 覆盖层，导出后在元书里长按皮肤「运行 main.jsonnet」，动画依然保留、不会被覆盖。（颜色、通知等其它改动也一样会保留。）'));
    }
  }

  // 动画图片列表编辑：手输 + 从图片库点选
  function animImagesField(a) {
    const editA = fn => { App.edit(fn); SkinModel.markAnimationDirty(); };
    const wrap = el('div');
    const ta = el('textarea'); ta.rows = 3;
    ta.value = (a.images || []).join('\n');
    ta.onchange = () => editA(() => { a.images = ta.value.split('\n').map(s => s.trim()).filter(Boolean); });
    wrap.appendChild(ta);
    wrap.appendChild(button('＋从图片库选择…', () => {
      const mode = Renderer.state.mode;
      const names = Object.keys(SkinModel.model.resources[mode]);
      const other = Object.keys(SkinModel.model.resources[mode === 'light' ? 'dark' : 'light']).filter(n => !names.includes(n));
      const all = [...names, ...other];
      if (!all.length) { toast('「图片」页里还没有 PNG，先去添加图片', true); return; }
      const m2 = UI.modal('点选图片加入动画（可连续点多张作为多帧）', '400px');
      for (const n of all) {
        m2.body.appendChild(button(n, () => {
          editA(() => { a.images = [...(a.images || []), n]; });
          ta.value = (a.images || []).join('\n');
          toast('已添加 ' + n);
        }, 'pick-item'));
      }
    }, 'btn small'));
    wrap.appendChild(el('div', 'hint-line', '一行一个图片名（对应「图片」页的 PNG 文件名，不带 .png 也可以）'));
    return wrap;
  }

  function openAnimationModal(doc, name) {

    if (!a) { m.body.appendChild(el('div', 'hint-line', '动画不存在')); return; }

    const box = el('div');
    m.body.appendChild(box);
    // 改动画参数也要标 dirty，jsonnet 皮肤导出时才会写入覆盖层
    const editA = fn => { App.edit(fn); SkinModel.markAnimationDirty(); };

    function draw() {
      box.innerHTML = '';

      box.appendChild(field('动画类型', selectInput(t, [['scale', '缩放 scale'], ['cartoon', '图片帧 cartoon'], ['physics', '物理 physics']], v => { editA(() => { a.animationType = v; }); draw(); })));

        box.appendChild(field('起点', pointInput(a.startPosition ? { ...a.startPosition } : null, v => editA(() => set(a, 'startPosition', v)))));
        box.appendChild(field('终点', pointInput(a.endPosition ? { ...a.endPosition } : null, v => editA(() => set(a, 'endPosition', v)))));
        box.appendChild(field('随机偏移', pointInput(a.randomPosition ? { ...a.randomPosition } : null, v => editA(() => set(a, 'randomPosition', v)))));
        box.appendChild(field('透明度变化', checkbox(a.useOpacity, v => editA(() => { a.useOpacity = v; }), '')));
        box.appendChild(field('起始透明度', numInput(a.startOpacity, v => editA(() => set(a, 'startOpacity', v)), { step: 0.05, min: 0, max: 1 })));
        box.appendChild(field('结束透明度', numInput(a.endOpacity, v => editA(() => set(a, 'endOpacity', v)), { step: 0.05, min: 0, max: 1 })));
        box.appendChild(field('旋转', checkbox(a.useRotation, v => editA(() => { a.useRotation = v; }), '')));

  // 判断某个样式引用是否是「按 $returnKeyType 变化的条件样式」
  function usesReturnKeyCondition(ref) {
    if (!Array.isArray(ref)) return false;
    return ref.some(x => x && typeof x === 'object' && x.conditionKey === '$returnKeyType');
  }

  // 让预览切到某个模拟场景（并同步顶栏下拉框）
  function setPreviewState(v) {
    const sel = document.getElementById('selState');
    if (sel) { sel.value = v; sel.dispatchEvent(new Event('change')); }
  }

  // ============ 通知编辑 ============
  function notificationEditor(container, doc, def) {
    container.innerHTML = '';
    container.appendChild(el('div', 'hint-line',
      '「事件通知」= 让这个键在特定情况下自动换样子或换功能。\n' +
      '举例：① 聊天框里能发送时，回车键自动变蓝（像系统键盘）② 切到英文模式时，中/英键换个颜色 ③ 正在打拼音时，回车键变成"确认"。\n' +
      '不需要的话完全可以不管这里。'));

    // 关键提示：预览里看不到效果 → 用顶栏「状态预览」切换场景才能看到
    container.appendChild(el('div', 'hint-line',
      '👀 看不到效果？通知只在特定场景才触发。请用顶栏的「状态预览」下拉框切到对应场景（如"可发送"），预览里就能看到这个键变样了。'));
    const testBar = el('div');
    testBar.appendChild(button('▶ 预览"可发送"场景', () => setPreviewState('rk4'), 'btn small'));
    testBar.appendChild(button('▶ 预览"打拼音"场景', () => setPreviewState('preedit'), 'btn small'));
    testBar.appendChild(button('↩ 回常规', () => setPreviewState('normal'), 'btn small'));
    container.appendChild(testBar);

    // jsonnet 皮肤：通知改动会随通用覆盖层生效
    if (SkinModel.hasJsonnet()) {
      container.appendChild(el('div', 'hint-line',
        '✓ 这是 jsonnet 编译型皮肤：你在这里改的通知，导出时会写进一层 jsonnet 覆盖层，导入元书后长按皮肤「运行 main.jsonnet」也不会被覆盖、照样生效。'));
    }

    const keyName = App.selection;
    const names = def.notification == null ? [] : (Array.isArray(def.notification) ? [...def.notification] : [def.notification]);

    // 智能检测：这个键是否已用「条件样式」实现了"可发送变蓝"（很多成品皮肤这么做）
    if (!names.length && (usesReturnKeyCondition(def.backgroundStyle) || usesReturnKeyCondition(def.foregroundStyle))) {
      container.appendChild(el('div', 'hint-line ok',
        '✅ 这个键已经通过「条件样式」实现了随回车键类型自动变色（这是成品皮肤常用做法，和"事件通知"效果一样）。\n' +
        '用顶栏「状态预览」切到"可发送"就能看到它变蓝——不需要再加通知。'));
    }

    // 一键模板：回车键智能变蓝
    if (!names.length) {
      container.appendChild(button('＋一键模板：这个键在"可发送"时变蓝（适合回车键）', () => {
        App.edit(d => {
          const dd = d[keyName]; if (!dd) return;
          const ntf = uniqueName(d, keyName + 'BlueNtf');
          const bg = uniqueName(d, keyName + 'BlueBg');
          const fg = uniqueName(d, keyName + 'BlueFg');
          // 尽量继承原背景的内边距和圆角，只换颜色
          let insets = { top: 4, bottom: 4, left: 3, right: 3 }, radius = 5;
          const curBg = typeof dd.backgroundStyle === 'string' ? d[dd.backgroundStyle] : null;
          if (curBg) {
            if (curBg.insets) insets = JSON.parse(JSON.stringify(curBg.insets));
            if (curBg.cornerRadius != null) radius = curBg.cornerRadius;
          }
          d[bg] = { buttonStyleType: 'geometry', insets, cornerRadius: radius, normalColor: '#3478F6', highlightColor: '#5A92F7' };
          d[fg] = { buttonStyleType: 'text', text: '$returnKeyType', fontSize: 16, normalColor: '#FFFFFF' };
          d[ntf] = {
            notificationType: 'returnKeyType', returnKeyType: [1, 4, 7, 9],
            backgroundStyle: bg, foregroundStyle: fg, action: 'enter',
          };
          dd.notification = [ntf];
        });
        notificationEditor(container, doc, def);
        toast('已添加！点上面「▶ 预览可发送场景」马上看效果');
        setTimeout(() => setPreviewState('rk4'), 200);
      }, 'btn small'));
    }
    names.forEach((n, i) => {
      const row = el('div', 'ref-row');
      row.appendChild(button(n + (doc[n] ? `（${doc[n].notificationType || '?'}）` : '（不存在）'), () => openNotificationModal(doc, n), 'ref-name'));
      row.appendChild(button('✕', () => {
        App.edit(() => {
          const l = [...names]; l.splice(i, 1);
          if (!l.length) delete def.notification; else def.notification = l;
        });
        notificationEditor(container, doc, def);
      }, 'mini-btn'));
      container.appendChild(row);
    });
    container.appendChild(button('＋添加事件通知', () => {
      let n = 'myNotification', i = 2;
      while (doc[n]) n = 'myNotification' + i++;
      App.edit(d => { d[n] = { notificationType: 'returnKeyType', returnKeyType: [1, 4, 7] }; def.notification = [...names, n]; });
      notificationEditor(container, doc, def);
      openNotificationModal(doc, n);
    }, 'btn small'));
  }
